/* Concepto: app de bolsillo en una columna. Inicio con meta diaria y baldosas de actividad, sesiones cortas con feedback inmediato, morfemas de los verbos pintados por función. */
:root{
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
  --bg:#EDF1EC; --surface:#FFFFFF; --surface2:#F4F7F3; --ink:#12201A; --muted:#556459; --line:#D3DCD4;
  --gorri:#CF2E2E; --on-gorri:#FFFFFF; --gorri-soft:#FBE4E2; --gorri-deep:#9E1F1F;
  --berde:#1B7A4B; --berde-soft:#DCF1E4; --berde-deep:#125836;
  --urdin:#2557A7; --urdin-soft:#E0EAF9;
  --urre:#B67A00; --urre-soft:#FBEFCF;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1612; --surface:#16231D; --surface2:#1C2C25; --ink:#E8F0EA; --muted:#9DB1A5; --line:#2A3C33;
    --gorri:#FF6B63; --on-gorri:#210A09; --gorri-soft:#43201E; --gorri-deep:#B83F39;
    --berde:#4CD08A; --berde-soft:#173A29; --berde-deep:#2E9962;
    --urdin:#86AEFF; --urdin-soft:#1A2B4C;
    --urre:#F2B84B; --urre-soft:#3A2F14;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1612; --surface:#16231D; --surface2:#1C2C25; --ink:#E8F0EA; --muted:#9DB1A5; --line:#2A3C33;
  --gorri:#FF6B63; --on-gorri:#210A09; --gorri-soft:#43201E; --gorri-deep:#B83F39;
  --berde:#4CD08A; --berde-soft:#173A29; --berde-deep:#2E9962;
  --urdin:#86AEFF; --urdin-soft:#1A2B4C;
  --urre:#F2B84B; --urre-soft:#3A2F14;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,summary,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--urdin);outline-offset:2px}
.app{max-width:680px;margin:0 auto;padding-bottom:110px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{background:none;border:0;padding:6px 0;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;font:700 22px/1 var(--f-display);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--gorri);box-shadow:9px 0 0 -2px var(--berde)}
.chips{display:flex;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:700 14px/1.2 var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap}
.backbtn{display:none;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font:700 16px/1.2 var(--f-body);box-shadow:0 3px 0 var(--line)}
.backbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
body.in-session .backbtn{display:inline-flex}
body.in-session .brand{display:none}
h1.big{font:700 clamp(28px,7vw,38px)/1.08 var(--f-display);letter-spacing:-.03em;margin:8px 0 4px;text-wrap:balance}
h2.sec{font:700 20px/1.2 var(--f-display);letter-spacing:-.02em;margin:28px 0 12px}
.sub{color:var(--muted);margin:0 0 16px}
.es{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}

/* botones */
.btn{border:0;border-radius:14px;padding:13px 20px;font:700 16px/1.2 var(--f-body);background:var(--gorri);color:var(--on-gorri);box-shadow:0 4px 0 var(--gorri-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gorri-deep)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sec:active{box-shadow:0 1px 0 var(--line)}
.btn.ok{background:var(--berde);color:var(--bg);box-shadow:0 4px 0 var(--berde-deep)}
.btn.ok:active{box-shadow:0 1px 0 var(--berde-deep)}
.btn.small{padding:8px 14px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--gorri-deep)}
.btn.sec.small{box-shadow:0 3px 0 var(--line)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* inicio */
.goal{display:flex;align-items:center;gap:16px}
.ring{width:76px;height:76px;flex:none}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--berde);transition:stroke-dashoffset .6s}
.ring text{font:700 18px var(--f-display);fill:var(--ink)}
.goal b{font:700 18px var(--f-display);display:block}
.lvl{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.lvl i,.bar i{display:block;height:100%;background:var(--urre);border-radius:99px;transition:width .5s}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile .ic{font-size:26px;line-height:1.2}
.tile .t{font:700 19px/1.15 var(--f-display);letter-spacing:-.02em}
.tile .s{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{background:var(--berde)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:8px;background:var(--urre-soft);border-radius:12px;padding:8px 12px;font-size:14px}
.badge b{font-family:var(--f-display)}
.badge.off{background:var(--surface2);color:var(--muted);filter:grayscale(1);opacity:.75}

/* navegación inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tab{flex:1;max-width:120px;border:0;background:none;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 12px var(--f-body);color:var(--muted)}
.tab span{font-size:20px;line-height:1.2}
.tab.on{background:var(--gorri-soft);color:var(--ink)}
body.in-session .tabs{display:none}
body.in-session .app{padding-bottom:40px}

/* lista de sets */
.setrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.setrow .ic{font-size:28px}
.setrow .grow b{font:700 18px var(--f-display);letter-spacing:-.02em}
.words{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.w{background:var(--surface2);border-radius:8px;padding:2px 8px;font-size:13px}

/* sesión */
.qtop{display:flex;align-items:center;gap:12px;padding-block:8px 18px}
.x{border:0;background:var(--surface);border:1px solid var(--line);width:38px;height:38px;border-radius:50%;font-size:18px;line-height:1}
.prog{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--berde);border-radius:99px;transition:width .35s}
.combo{font:700 14px var(--f-display);color:var(--urre);min-width:54px;text-align:right;font-variant-numeric:tabular-nums}
.qkind{font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.prompt{font:700 clamp(26px,7vw,34px)/1.15 var(--f-display);letter-spacing:-.03em;margin:0 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;text-wrap:balance}
.big-emoji{font-size:54px;line-height:1.1;margin-bottom:6px}
.speak{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:38px;height:38px;font-size:17px;line-height:1}
.hint{color:var(--muted);margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font:600 17px/1.3 var(--f-body);box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.good{border-color:var(--berde);background:var(--berde-soft)}
.opt.bad{border-color:var(--gorri);background:var(--gorri-soft)}
.typebox{width:100%;font:600 22px var(--f-display);padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.typebox.good{border-color:var(--berde);background:var(--berde-soft)}
.typebox.bad{border-color:var(--gorri);background:var(--gorri-soft)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:2px solid;animation:up .2s ease-out}
.sheet{max-height:64vh;overflow-y:auto}
.sheet.good{background:var(--berde-soft);border-color:var(--berde)}
.sheet.bad{background:var(--gorri-soft);border-color:var(--gorri)}
.sheet .in{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet h3{margin:0;font:700 22px var(--f-display)}
.sheet.good h3{color:var(--berde)}.sheet.bad h3{color:var(--gorri)}
.sheet p{margin:0}
.sheet .why{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.sheet .why small{color:var(--muted)}
.sheet .yours{border-top:1px dashed var(--line);padding-top:8px}
.sheet .again{color:var(--muted);font-size:13px}
.sheetbtn{position:sticky;bottom:0;padding-top:6px}
.sheet.good .sheetbtn{background:var(--berde-soft)}
.sheet.bad .sheetbtn{background:var(--gorri-soft)}
.sheet.ask{background:var(--surface);border-color:var(--line);z-index:26}
.sheet.ask p{color:var(--muted)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.spacer{height:190px}
.helpbox{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin:0 0 16px}
.helpbox .explain{margin:0;width:100%}

/* tarjetas */
.flash{width:100%;min-height:230px;border:1px solid var(--line);border-radius:22px;background:var(--surface);box-shadow:0 5px 0 var(--line);padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.flash .eu{font:700 clamp(32px,9vw,46px)/1.1 var(--f-display);letter-spacing:-.03em}
.flash .back{font:600 24px var(--f-body)}
.flash small{color:var(--muted)}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}

/* constructor de frases */
.line{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-items:flex-start;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0;min-height:56px}
.wt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font:600 18px var(--f-body);box-shadow:0 3px 0 var(--line)}
.wt:active{transform:translateY(2px)}
.wt.gone{visibility:hidden}
.line.good .wt{border-color:var(--berde);background:var(--berde-soft)}
.line.bad .wt{border-color:var(--gorri);background:var(--gorri-soft)}

/* conjugación */
.sel{display:flex;flex-wrap:wrap;gap:8px}
.lvbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.lvbar .sel{margin:0}
.fld{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;font:500 16px var(--f-body)}
textarea.fld{font:500 13px var(--f-mono,monospace);min-height:84px;resize:vertical;word-break:break-all}
.hit{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.hit:last-child{border-bottom:0}.hit b{font:700 17px var(--f-display)}.hit .es{margin-left:auto;text-align:right}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;font-size:17px;flex:none}
.wotd{display:flex;align-items:center;gap:12px}.wotd .big2{font:700 26px var(--f-display)}
.okmsg{color:var(--berde-deep,var(--berde));font-weight:700;margin-top:8px}.errmsg{color:var(--gorri);font-weight:700;margin-top:8px}
.pill{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font:700 15px var(--f-body)}
.pill.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.conj{border-collapse:collapse;width:100%;min-width:300px}
table.conj th,table.conj td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
table.conj tr:last-child td,table.conj tr:last-child th{border-bottom:0}
table.conj thead th{font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface2)}
table.conj th[scope=row]{font:600 15px var(--f-body);color:var(--muted)}
table.conj td{font:700 18px var(--f-mono);letter-spacing:-.02em}
table.conj th small{font-weight:400;font-size:12px;color:var(--muted)}
.m-root{color:var(--urdin)}.m-person{color:var(--gorri)}.m-obj{color:var(--berde)}.m-tense{color:var(--urre)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:10px 0 0}
.legend b{font-family:var(--f-mono)}
.pieces{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin:6px 0 4px}
.piece{display:flex;flex-direction:column;gap:6px;align-items:center}
.piece .f{font:700 22px var(--f-display);padding:10px 14px;border-radius:12px;border:2px solid currentColor;background:var(--surface);letter-spacing:-.02em}
.piece .l{font-size:12px;font-weight:600;color:var(--muted);max-width:92px;text-align:center;line-height:1.25}
.p-sub{color:var(--gorri)}.p-obj{color:var(--berde)}.p-part{color:var(--urdin)}.p-aux{color:var(--urre)}
.explain{background:var(--surface2);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px}
.explain p{margin:0 0 6px}.explain p:last-child{margin:0}
.eq{font:700 15px var(--f-mono);margin:6px 0 0}

/* gramática */
details.g{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 16px}
details.g+details.g{margin-top:10px}
details.g summary{font:700 18px var(--f-display);letter-spacing:-.02em;padding:14px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.g summary::after{content:"+";font-size:22px;line-height:1;color:var(--muted)}
details.g[open] summary::after{content:"–"}
details.g .body{padding-bottom:16px}
details.g p{margin:0 0 10px}
.ex{font:600 17px var(--f-body);background:var(--surface2);border-radius:10px;padding:8px 12px;margin:8px 0}
.ex small{display:block;color:var(--muted);font-weight:400;font-size:14px}
table.mini{border-collapse:collapse;width:100%;font-size:15px}
table.mini td,table.mini th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.mini th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* resultados */
.result{text-align:center;padding-top:24px}
.result .num{font:800 64px/1 var(--f-display);letter-spacing:-.04em;color:var(--urre)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stats3 div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.stats3 b{display:block;font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.stats3 span{font-size:12px;color:var(--muted)}
.lbody{font-size:17px}
.lbody>p{margin:0 0 12px}
.lbody .tscroll,.lbody .pieces{margin:14px 0}
.lbody table.mini{min-width:260px}
.lbody .ex{margin:8px 0}
ul.goals{margin:10px 0 0;padding-left:20px}
ul.goals li{margin:4px 0}
ul.goals.small{font-size:14px;color:var(--muted);margin:10px 0 12px}
.note a{color:var(--urdin)}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;max-width:90vw;text-align:center;animation:up .25s ease-out}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.note{font-size:13px;color:var(--muted);margin-top:14px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* ===== TEMA PIZARRA (v17) (clase de euskaltegi, tiza sobre pizarra verde) ===== */
body{--f-display:'Patrick Hand','Comic Sans MS',cursive;--f-body:'Nunito',system-ui,sans-serif;
 --bg:#1E2B27;--surface:#273833;--surface2:#2F423C;--ink:#F3F0E4;--muted:#B5C0B7;--line:rgba(243,240,228,.32);
 --gorri:#FF8F85;--on-gorri:#2A1210;--gorri-soft:#4A2B2A;--gorri-deep:#FF8F85;
 --berde:#9DE3AE;--berde-soft:#2A4B3A;--berde-deep:#9DE3AE;--urdin:#9CCBFF;--urdin-soft:#25384F;--urre:#FFD879;--urre-soft:#4A4022;--r:14px;color-scheme:dark}
body.th-light{--bg:#EDF1EC;--surface:#FFFFFF;--surface2:#F4F7F3;--ink:#12201A;--muted:#556459;--line:rgba(18,32,26,.28);--gorri:#CF2E2E;--on-gorri:#FFFFFF;--gorri-soft:#FBE4E2;--gorri-deep:#9E1F1F;--berde:#1B7A4B;--berde-soft:#DCF1E4;--berde-deep:#125836;--urdin:#2557A7;--urdin-soft:#E0EAF9;--urre:#8A6200;--urre-soft:#FFF1CC;color-scheme:light}
body{background:radial-gradient(1200px 600px at 20% -10%,rgba(255,255,255,.07),transparent 60%),radial-gradient(900px 500px at 90% 110%,rgba(255,255,255,.05),transparent 60%),var(--bg)}
body::before{background:var(--bg)}
.app{position:relative}
.top{background:var(--bg);border-bottom:2px dashed var(--line)}
.brand{font:400 28px/1 var(--f-display);letter-spacing:.01em}
.brand i{width:16px;height:16px;background:none;border:2.5px solid var(--gorri);border-radius:50% 45% 55% 50%;box-shadow:11px 0 0 -2px var(--berde)}
.chip{background:transparent;border:2px dashed var(--line);font:700 14px var(--f-body);border-radius:255px 15px 225px 15px/15px 225px 15px 255px}
h1.big{font:400 clamp(40px,11vw,60px)/1 var(--f-display);letter-spacing:0;transform:rotate(-1deg);display:inline-block;border-bottom:4px solid var(--urre);padding-bottom:2px}
h2.sec{font:400 28px var(--f-display);letter-spacing:0;color:var(--urre)}
.sub{font-size:17px}
.card,details.g,.tscroll,.stats3 div,.flash,.tile{border:2px dashed var(--line);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;background:var(--surface);box-shadow:none}
.card,.tile{border-radius:22px 12px 20px 14px/14px 20px 12px 22px}
.card,.tile,.flash,.stats3 div{border-style:solid;border-width:2px;border-color:rgba(243,240,228,.45)}
details.g{border-radius:16px 10px 18px 12px/12px 18px 10px 16px;padding:0 16px}
.tiles{gap:14px}
.tile{box-shadow:3px 4px 0 rgba(0,0,0,.35);padding:14px}
.tile:nth-child(odd){transform:rotate(-.6deg)}.tile:nth-child(even){transform:rotate(.5deg)}
.tile:active{transform:translate(2px,3px);box-shadow:1px 1px 0 rgba(0,0,0,.35)}
.tile .t{font:400 26px/1.05 var(--f-display);letter-spacing:0}
.tile .s{color:var(--muted)}
.btn{border-radius:18px 12px 20px 10px/10px 20px 12px 18px;background:var(--ink);color:#1E2B27;box-shadow:3px 4px 0 rgba(0,0,0,.45);font:700 17px var(--f-body)}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 rgba(0,0,0,.45)}
.btn.sec{background:transparent;color:var(--ink);border:2px dashed var(--line);box-shadow:none}
.btn.sec:active{box-shadow:none}
.btn.ok{background:var(--berde);color:#10261A;box-shadow:3px 4px 0 rgba(0,0,0,.45)}
.btn.small,.btn.sec.small{box-shadow:none;font-size:15px}.btn.small{box-shadow:2px 3px 0 rgba(0,0,0,.45)}
.ring .bg{stroke:rgba(243,240,228,.18)}.ring .fg{stroke:var(--urre);stroke-dasharray:none}.ring text{font:400 22px var(--f-display);fill:var(--ink)}
.goal b,.wotd .big2,.setrow .grow b,.piece .f,.result .num,.sheet h3{font-family:var(--f-display);font-weight:400;letter-spacing:0}
.goal b{font-size:22px}.setrow .grow b{font-size:24px}
.lvl,.bar,.prog{background:rgba(243,240,228,.15);border-radius:99px}
.lvl i{background:var(--urre)}.bar i,.prog i{background:var(--berde)}
.badge{border-radius:12px 8px 12px 8px;border:2px dashed var(--line);background:transparent}
.tabs{background:#16201D;border-top:2px dashed var(--line)}
.tab{font:700 12px var(--f-body);border-radius:14px}
.tab.on{background:rgba(255,216,121,.15);color:var(--urre)}
.opt,.wt{background:var(--surface);border:2px solid rgba(243,240,228,.45);border-radius:14px 10px 16px 10px/10px 16px 10px 14px;box-shadow:2px 3px 0 rgba(0,0,0,.35);font:700 18px var(--f-body)}
.opt:active,.wt:active{transform:translate(2px,2px);box-shadow:0 0 0 rgba(0,0,0,.35)}
.opt.good{border-color:var(--berde);background:var(--berde-soft)}.opt.bad{border-color:var(--gorri);background:var(--gorri-soft)}
.typebox,.fld{background:var(--surface);border:2px dashed var(--line);border-radius:12px;color:var(--ink)}
.prompt{font:400 clamp(34px,9vw,46px)/1.05 var(--f-display);letter-spacing:0}
.big-emoji{filter:drop-shadow(0 0 0 transparent)}
.qkind{color:var(--urre);letter-spacing:.14em}
.line{border-bottom:2px dashed var(--line)}
.x,.speak,.spk,.backbtn,.pill{background:transparent;border:2px dashed var(--line);color:var(--ink);box-shadow:none}
.pill.on{background:var(--ink);color:#1E2B27;border-style:solid}
.sheet{border-top:2px dashed}.sheet .why{background:var(--surface2);border-radius:12px}
.sheet.good h3{color:var(--berde)}.sheet.bad h3{color:var(--gorri)}
.flash{min-height:240px}.flash .eu{font:400 clamp(44px,12vw,62px)/1 var(--f-display);letter-spacing:0}.flash .back{font-family:var(--f-display);font-weight:400;font-size:32px}
.ex{background:var(--surface2);border-left:4px solid var(--urre);border-radius:6px}
.explain{background:var(--surface2)}
.w{background:var(--surface2);border-radius:99px;padding:2px 10px}
table.conj td{color:var(--ink)}table.conj thead th{background:var(--surface2)}
.m-root{color:var(--urdin)}.m-person{color:var(--gorri)}.m-obj{color:var(--berde)}.m-tense{color:var(--urre)}
.result .num{font-size:84px;color:var(--urre)}
.toast{background:var(--ink);color:#1E2B27}
.note a{color:var(--urdin)}

#dbody{display:flex;flex-direction:column;gap:10px}#dbody>.card{color:inherit;width:100%}
select.fld{appearance:auto}
.top{gap:10px}.chips{align-items:center}.gear{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;padding:0;background:transparent;border:2px dashed var(--line);color:var(--ink);transition:transform .25s,background .15s,color .15s}
.gear:active{transform:rotate(60deg)}.gear.on{background:var(--ink);color:var(--bg);border-style:solid}
body.in-session .gear{display:none}
.top{gap:8px}.brand{white-space:nowrap;font-size:24px;gap:6px}.brand i{width:14px;height:14px}.chips{gap:6px}.chip{padding:4px 8px;font-size:13px}.gear{width:36px;height:36px}
@media (max-width:370px){.brand{font-size:21px}.chip{padding:3px 6px;font-size:12px}.gear{width:32px;height:32px}.gear svg{width:19px;height:19px}}
@media (max-width:340px){.brand i{display:none}.brand{font-size:19px}.chip{padding:3px 5px;font-size:11.5px}.chips{gap:4px}}
.recap .rc-h{font:700 17px var(--f-display);margin:16px 0 6px;color:var(--ac,inherit)}.recap .rc-step{border-top:1px dashed rgba(128,128,128,.35);margin-top:12px;padding-top:2px}.recap p{line-height:1.45}
.ex.tr small{filter:blur(7px);cursor:pointer;transition:filter .2s;user-select:none}.ex.tr small::after{content:' 👁';filter:none}.ex.tr.on small{filter:none;user-select:text}
/* Móvil: texto y botones algo más grandes (el escritorio no cambia) */
@media (max-width:600px){
body{font-size:17.5px}
.lbody{font-size:18.5px}.sub{font-size:18px}
.btn{font-size:18px;padding-top:15px;padding-bottom:15px}
.tile .s{font-size:14.5px}.tile .t{font-size:1.1em}
.ex{font-size:18px}.ex small{font-size:15.5px}
table.mini{font-size:16.5px}table.mini th{font-size:13px}
.explain{font-size:16.5px}.badge{font-size:15px}.note{font-size:14.5px}
.tab{font-size:12.5px}.tab span{font-size:22px}
.chip{font-size:14px}
}

/* ===== Jolak ===== */
.jg-game{display:flex;gap:14px;align-items:center;text-align:left;width:100%;margin:10px 0;cursor:pointer;font:inherit;color:inherit}
.jg-game .ic{font-size:34px}.jg-game b{font:700 20px var(--f-display);display:block}.jg-game small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.jg-lock{opacity:.6}.jg-need{display:block;color:var(--urre);font-size:14px;margin-top:4px}
.jg-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.jg-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.jg-title{font:700 20px var(--f-display);flex:1}.jg-chip{font-weight:800}
.jg-hint{text-align:center;color:var(--muted);margin-top:14px}.jg-q{font:800 34px/1.2 var(--f-display);text-align:center;margin:10px 0}.jg-streak{text-align:center;min-height:24px;font-weight:800;color:var(--urre)}
.jg-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.jg-opt{padding:16px 8px;font:700 20px var(--f-body);border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.jg-opt.ok{background:var(--berde);color:#fff;border-color:var(--berde)}.jg-opt.no{background:var(--gorri);color:#fff;border-color:var(--gorri)}
.jg-g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.jg-mc{aspect-ratio:1/.78;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px var(--f-body);cursor:pointer;padding:4px;position:relative}
.jg-mc .b{display:none;line-height:1.15;word-break:break-word}.jg-mc .b span{display:block;font-size:26px}
.jg-mc.up .f,.jg-mc.done .f{display:none}.jg-mc.up .b,.jg-mc.done .b{display:block}.jg-mc .f{font-size:26px}
.jg-mc.done{background:var(--berde);color:#fff;border-color:var(--berde);opacity:.85}
.jg-target{text-align:center;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:17px}.jg-target b{display:block;font:800 22px var(--f-display);color:var(--urre)}
.jg-target.chg{animation:jgp .5s 3}@keyframes jgp{50%{transform:scale(1.06);background:var(--urre);color:#fff}}
.jg-arena{position:relative;height:min(52vh,420px);overflow:hidden;border:2px dashed var(--line);border-radius:16px;margin-top:10px;background:var(--surface2)}
.jg-fall{position:absolute;top:0;left:0;padding:8px 12px;border-radius:12px;background:var(--surface);border:2px solid var(--ink);font-weight:700;font-size:16px;cursor:pointer;white-space:nowrap;max-width:96%}
.jg-fall.good{background:var(--berde);color:#fff}.jg-fall.bad{background:var(--gorri);color:#fff}
.jg-notice{position:absolute;left:8%;right:8%;top:38%;z-index:5;text-align:center;padding:14px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:15px}.jg-notice b{display:block;font:800 22px var(--f-display)}.jg-notice.heal{background:var(--berde);color:#fff}

/* generador de frases «participio + auxiliar» */
function genSentence(v,tk,i){
  const nor=v.ty==='nor';
  let subj,parts,aux,rule;
  if(tk==='oraina'){ // hábito
    subj=nor?PRON[i]:NORK[i]; aux=nor?CONJ.izan.T.oraina.f[i]:CONJ.ukan.T.oraina1.f[i];
    parts=[v.obj,v.hab,aux]; if(v.p==='bizi')parts=[v.obj,'bizi',aux];
  }else if(tk==='ari'){
    subj=PRON[i]; aux=CONJ.izan.T.oraina.f[i]; parts=[v.obj,v.hab,'ari',aux];
  }else if(tk==='iragana'){
    subj=nor?PRON[i]:NORK[i]; aux=nor?CONJ.izan.T.iragana.f[i]:CONJ.ukan.T.iragana1.f[i];
    parts=[v.obj,v.p,aux];
  }else if(tk==='perfektua'){
    subj=nor?PRON[i]:NORK[i]; aux=nor?CONJ.izan.T.oraina.f[i]:CONJ.ukan.T.oraina1.f[i];
    parts=[v.obj,v.p,aux];
  }else{
    subj=nor?PRON[i]:NORK[i]; aux=nor?CONJ.izan.T.oraina.f[i]:CONJ.ukan.T.oraina1.f[i];
    parts=[v.obj,v.fut,aux];
  }
  const tokens=[subj].concat(parts);
  const tn=TEN[tk]; let esTxt=null;
  if(i===0){
    const si=(v.only&&!v.only.includes(tk))?null:v.s[tn.si];
    if(si)esTxt='(Yo) '+si+' '+v.eso;
  }
  return {tokens,aux,subj,esTxt,tk};
}

let tt;
function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{e.hidden=true},2800)}
function burst(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#CF2E2E','#1B7A4B','#E8B130','#2557A7'];
  const P=Array.from({length:70},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*11-3,r:Math.random()*6+3,c:cols[rnd(4)],a:1}));
  let f=0;
  (function tick(){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a-=.012;x.globalAlpha=Math.max(p.a,0);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});
    if(++f<110)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height);
  })();
}
function say(t,slow){
  try{
    const s=window.speechSynthesis;if(!s)return;
    const u=new SpeechSynthesisUtterance(t);
    const v=s.getVoices().find(v=>/^eu/i.test(v.lang));
    if(v){u.voice=v;u.lang=v.lang}else u.lang='eu-ES';
    u.rate=slow?.55:.85;s.cancel();s.speak(u);
  }catch(e){}
}

/* ===== VOCABULARIO ===== */
const wid=(s,w)=>s.id+':'+w[0];
const allWords=all=>VOCAB.filter(s=>all||lvOf(s)===S.level).flatMap(s=>s.w.map(w=>({id:wid(s,w),eu:w[0],es:w[1],em:w[2],set:s.id})));
const setWords=s=>s.w.map(w=>({id:wid(s,w),eu:w[0],es:w[1],em:w[2],set:s.id}));
const mast=id=>S.m[id]||0;
const bump=(id,ok)=>{S.m[id]=Math.max(0,Math.min(4,mast(id)+(ok?1:-1)))};
const setPct=s=>Math.round(s.w.reduce((a,w)=>a+mast(wid(s,w)),0)/(s.w.length*4)*100);
function pickWords(pool,n){
  const out=[],p=pool.slice();
  while(out.length<n&&p.length){
    const wts=p.map(w=>5-mast(w.id));
    let r=Math.random()*wts.reduce((a,b)=>a+b,0),i=0;
    for(;i<p.length-1;i++){r-=wts[i];if(r<=0)break}
    out.push(p.splice(i,1)[0]);
  }
  return out;
}
function vocabQ(w,pool){
  const all=allWords();
  let others=pool.filter(x=>x.id!==w.id&&x.es!==w.es);
  if(others.length<3)others=all.filter(x=>x.id!==w.id&&x.es!==w.es);
  others=shuffle(others);
  const rev=`<b>${esc(w.eu)}</b> = ${esc(w.es)}`;
  const wset=VOCAB.find(s=>s.id===w.set);
  const why=`<b>${esc(w.eu)}</b> significa «${esc(w.es)}».${wset?`<br><small>Está en el tema <b>${esc(wset.eu)}</b> (${esc(wset.es)}).</small>`:''}`;
  const m=mast(w.id),r=Math.random();
  if(m>=2&&r<.5)return{k:'type',kind:'Idatzi euskaraz',p:w.es,em:w.em,hint:'Escríbelo en euskera',ans:w.eu,expl:rev,rev,why,wid:w.id};
  if(r<.75)return{k:'choice',kind:'Zer esan nahi du?',p:w.eu,em:w.em,say:w.eu,hint:'¿Qué significa?',opts:shuffle([w.es].concat(others.slice(0,3).map(x=>x.es))),ans:w.es,expl:rev,rev,why,wid:w.id};
  return{k:'choice',kind:'Nola esaten da euskaraz?',p:w.es,em:w.em,hint:'¿Cómo se dice en euskera?',opts:shuffle([w.eu].concat(others.slice(0,3).map(x=>x.eu))),ans:w.eu,expl:rev,rev,why,wid:w.id};
}
const vocabQs=(pool,n)=>pickWords(pool,n).map(w=>vocabQ(w,pool));
function flashQs(pool,n){
  return pickWords(pool,n).map(w=>({k:'flash',wid:w.id,eu:w.eu,es:w.es,em:w.em,rev:`<b>${esc(w.eu)}</b> = ${esc(w.es)}`}));
}

/* ===== CONJUGACIÓN ===== */
const segHTML=a=>a.map(([s,r])=>`<span class="m-${r}">${esc(s)}</span>`).join('');
const pastOk=()=>!!(window.FORCEPAST||S.level==='a2'||S.a1test===1||(S.lessons&&S.lessons.l10!=null)||(typeof SES!=='undefined'&&SES&&SES.cfg&&SES.cfg.test));
function genConj(vk){
  const c=CONJ[vk];let tks=Object.keys(c.T);if(!pastOk()&&!c.lv){const pr=tks.filter(k=>!/^iragana/.test(k));if(pr.length)tks=pr}
  const tk=tks[rnd(tks.length)],i=rnd(6),t=c.T[tk],ans=t.f[i];
  const pr=pronOf(c)[i];
  const forms=Object.values(c.T).flatMap(x=>x.f);
  const same=t.f.filter(f=>f!==ans);
  const rest=shuffle(forms.filter(f=>f!==ans&&!same.includes(f)));
  const opts=shuffle([ans].concat(shuffle(same).concat(rest).slice(0,3)));
  const seg=t.seg?segHTML(t.seg[i]):esc(ans);
  const rev=`${esc(pr)} <b>${esc(ans)}</b> · ${vk}, ${esc(t.e)}`;
  const series=t.f.map((f,k)=>k===i?`<b>${esc(f)}</b>`:esc(f)).join(' · ');
  const note=(typeof VNOTE!=='undefined'&&VNOTE[vk])?`<br><small>${VNOTE[vk]}</small>`:'';
  const why=`Se pedía <b>${vk}</b>, ${esc(t.e)}, persona <b>${esc(pr)}</b> (${pronEs(c)[i]}): <b>${seg}</b>.<br><small>Serie completa: ${series}</small>${note}`;
  return{k:S.typeMode?'type':'choice',kind:'Aditza · konjugatu',p:pr+' ___',hint:`${vk} · ${t.e} · ${pronEs(c)[i]}`,opts,ans,expl:`${esc(pr)} <b>${seg}</b>`,why,rev,key:vk+tk+i,vk,meta:{vk,tk,i}};
}
function conjQs(vks,n){
  const out=[],seen=new Set();let tries=0;
  while(out.length<n&&tries++<80){const q=genConj(vks[rnd(vks.length)]);if(!seen.has(q.key)){seen.add(q.key);out.push(q)}}
  return out;
}

/* ===== FRASES ===== */
function genTip(v,tk){
  const a=v.ty==='nor'
    ?'Sin objeto directo → auxiliar <b>izan</b> (naiz, zara, da…) y el sujeto no lleva -k.'
    :'Con objeto directo → auxiliar <b>ukan</b> (dut, duzu, du…) y el sujeto lleva -k (ni → nik).';
  const t={
    oraina:`<b>${v.hab}</b> = forma habitual del participio (${v.p}).`,
    ari:'«ari» + auxiliar de <b>izan</b> = estar haciéndolo ahora. Aquí el sujeto va sin -k.',
    iragana:`participio <b>${v.p}</b> sin cambios + auxiliar en pasado.`,
    perfektua:`participio <b>${v.p}</b> + auxiliar en presente = acción ya hecha («he …»).`,
    geroa:`<b>${v.fut}</b> = participio + <b>${v.fut.endsWith('go')?'-go':'-ko'}</b> (-go tras -n, -ko en el resto).`
  }[tk];
  return a+'<br>'+t;
}
function buildQs(n){
  if(S.level==='a2')return pick(SENT2,n).map(s=>sq({es:s.es,t:s.t,x:s.x,tip:s.tip}));
  const nCur=Math.ceil(n*0.6);
  const cur=pick(SENT,nCur).map(s=>({k:'build',kind:'Eraiki esaldia',es:s.es,tokens:s.t,extra:s.x||[],expl:`${esc(s.es)}<br><small>${esc(s.tip)}</small><br><small>Hay otros órdenes posibles; este es el neutro.</small>`,rev:`<b>${esc(cap(s.t.join(' ')))}.</b> ${esc(s.es)}`}));
  const gen=[],seen=new Set();let tries=0;
  while(gen.length<n-cur.length&&tries++<60){
    const v=PART[rnd(PART.length)],tk=Object.keys(TEN)[rnd(5)];
    if(v.only&&!v.only.includes(tk))continue;
    const i=rnd(6),g=genSentence(v,tk,i),key=g.tokens.join(' ');
    if(seen.has(key))continue;seen.add(key);
    const es=g.esTxt||`${PRON_ES[i]} · ${v.es} «${v.eso}» · ${TEN[tk].es}`;
    gen.push({k:'build',kind:'Eraiki esaldia',es,tokens:g.tokens,extra:[],expl:`${esc(es)}<br><small>${genTip(v,tk)}</small>`,rev:`<b>${esc(cap(key))}.</b> ${esc(es)}`});
  }
  return shuffle(cur.concat(gen));
}
function nnQs(n){
  return pick(NN,n).map(([vb,es,ty])=>({
    k:'choice',kind:'Nor ala nork?',help:'Pregúntate: ¿hay un «qué» (objeto directo) después del verbo? Si no lo hay, el auxiliar es izan. Si lo hay, es ukan.',p:vb,hint:`${es} · ¿qué auxiliar necesita?`,
    opts:['izan (naiz, zara, da…)','ukan (dut, duzu, du…)'],ans:ty==='nor'?'izan (naiz, zara, da…)':'ukan (dut, duzu, du…)',
    expl:ty==='nor'?`<b>${vb}</b> no lleva objeto directo → <b>izan</b>, sujeto sin -k.`:`<b>${vb}</b> lleva objeto directo (¿qué?) → <b>ukan</b>, sujeto con -k.`,
    rev:`<b>${vb}</b> (${es}) → ${ty==='nor'?'izan':'ukan'}`
  }));
}

function typeQs(n){
  const nc=Math.ceil(n/2),na=n-nc;
  const cl=pick(VT_CL,nc).map(([vb,es,t,eu,ex])=>({
    k:'choice',kind:'Zein aditz mota?',p:vb,hint:es+' · ¿de qué tipo es?',opts:shuffle(VT.slice()),ans:VT[t],
    help:'Mira quién participa: solo sujeto (NOR) · sujeto + objeto «qué» (NOR-NORK) · algo que le pasa o le gusta a alguien (NOR-NORI) · alguien da/dice algo a alguien (NOR-NORI-NORK).',
    expl:`<b>${vb}</b> → <b>${VT[t].split(' · ')[0]}</b>.<br><small>${esc(eu)} · ${esc(ex)}</small>`,rev:`<b>${vb}</b> (${es}) → ${VT[t].split(' · ')[0]}`}));
  const ax=pick(VT_AUX,na).map(([s,es,ans,wr])=>({
    k:'choice',kind:'Auxiliarra',p:s,hint:es,opts:shuffle([ans].concat(wr)),ans,
    help:'Decide el tipo de verbo y elige el auxiliar: naiz (NOR) · dut (NOR-NORK) · zait/zaio (NOR-NORI) · diot/dit (NOR-NORI-NORK).',

function lev(a,b){const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];}for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function allForms(){const o=[];Object.entries(CONJ).forEach(([vk,c])=>Object.entries(c.T).forEach(([tk,t])=>t.f.forEach((f,i)=>o.push({vk,tk,i,f,t,c}))));return o}
function yoursText(q,given){
  if(given==null||!String(given).trim())return '';
  const g=esc(given);
  if(q.meta){
    const m=q.meta,hits=allForms().filter(x=>x.f===String(given).trim().toLowerCase());
    if(!hits.length)return `Tu respuesta <b>${g}</b> no es una forma de ningún verbo del curso. Revisa la ortografía.`;
    const h=hits.find(x=>x.vk===m.vk&&x.tk===m.tk)||hits.find(x=>x.vk===m.vk)||hits[0];
    const pr=pronOf(h.c)[h.i],want=pronOf(CONJ[m.vk])[m.i];
    let r;
    if(h.vk!==m.vk)r=`es de otro verbo, no de <b>${m.vk}</b>`;
    else if(h.tk===m.tk)r=`es de otra persona (aquí se pedía <b>${esc(want)}</b>)`;
    else if(h.i===m.i)r=`es de otro tiempo (aquí se pedía ${esc(CONJ[m.vk].T[m.tk].e)})`;
    else r='cambian la persona y el tiempo';

 steps:[
 {t:'Los pronombres y «izan»',h:'<p><b>izan</b> significa <b>ser</b>. Cada persona tiene su forma. El pronombre se puede omitir, porque el verbo ya indica quién es.</p>',
  tb:'<table class="mini"><tr><th></th><th>izan</th><th></th></tr><tr><td>ni</td><td><b>naiz</b></td><td>yo soy</td></tr><tr><td>zu</td><td><b>zara</b></td><td>tú eres</td></tr><tr><td>hura</td><td><b>da</b></td><td>él / ella es</td></tr><tr><td>gu</td><td><b>gara</b></td><td>somos</td></tr><tr><td>zuek</td><td><b>zarete</b></td><td>sois</td></tr><tr><td>haiek</td><td><b>dira</b></td><td>son</td></tr></table>',
  tip:'<b>hura</b> no distingue género: vale para «él» y «ella». <b>zu</b> es tú (uno solo) y <b>zuek</b> es vosotros.'},
 {t:'El orden: el verbo va al final',h:'<p>La frase vasca termina con el verbo. Primero dices quién, luego el dato, y cierras con <b>izan</b>.</p>',
  pc:[['Ni','p-sub','quién'],['Dabid','p-obj','el dato'],['naiz','p-aux','soy']],
  ex:[['Ni Dabid naiz.','Yo soy David.'],['Zu euskalduna zara.','Tú eres euskaldun (hablante de euskera).'],['Gu lagunak gara.','Nosotros somos amigos.']]},
 {t:'Preguntar y decir de dónde eres',h:'<p>Para preguntar de dónde eres: <b>nongoa</b>. La respuesta usa <b>-koa / -goa</b>: lugar + «-ko» (tras vocal) o «-go» (tras consonante) + a.</p>',
  ex:[['Nor zara zu?','¿Quién eres tú?'],['Nongoa zara?','¿De dónde eres?'],['Baztangoa naiz.','Soy de Baztan.'],['Iruñekoa naiz.','Soy de Pamplona.'],['Non bizi zara?','¿Dónde vives?'],['Elizondon bizi naiz.','Vivo en Elizondo.']],
  tip:'«bizi izan» (vivir) usa <b>izan</b> como auxiliar: bizi <b>naiz</b>, bizi <b>zara</b>.'},
 {t:'Decir que no',h:'<p>Pones <b>ez</b> delante del verbo: <b>ez naiz</b>, <b>ez zara</b>. Para preguntas de sí o no se añade <b>-al</b> o se sube la entonación.</p>',
  ex:[['Ez naiz Dabid.','No soy David.'],['Euskalduna al zara?','¿Eres euskaldun?'],['Bai, naiz. / Ez, ez naiz.','Sí, lo soy. / No, no lo soy.']]}
 ],
 make:()=>[].concat(conjQs(['izan'],4),lsq('nongoa'),SQ(0,1,15),[
  mc('Nongoa zara?','Baztan → «de Baztan»','Completa','Baztangoa',['Baztanekoa','Baztanera','Baztanen'],'Tras consonante (-n) se usa <b>-go</b>: Baztan + go + a = Baztangoa.'),
  mc('Ez naiz…','«No soy David»','¿Cómo se dice?','Ez naiz Dabid',['Naiz ez Dabid','Dabid ez dut','Ez da Dabid'],'<b>ez</b> + auxiliar: ez naiz.')
 ])},

{id:'l3',n:3,eu:'Gauzak',es:'El artículo, el plural y «hau / hori»',ic:'📦',min:7,
 goals:['Poner el artículo (-a) y el plural (-ak)','Usar «bat» y los números con el nombre','Señalar con hau, hori y hura'],
 steps:[
 {t:'El artículo va pegado al final',h:'<p>No hay «el / la» como palabra suelta. Se añade <b>-a</b> al final del nombre. El plural añade <b>-ak</b>.</p>',
  tb:'<table class="mini"><tr><th>Sin artículo</th><th>El / la</th><th>Los / las</th></tr><tr><td>etxe</td><td><b>etxea</b></td><td><b>etxeak</b></td></tr><tr><td>liburu</td><td><b>liburua</b></td><td><b>liburuak</b></td></tr><tr><td>behi</td><td><b>behia</b></td><td><b>behiak</b></td></tr><tr><td>gizon</td><td><b>gizona</b></td><td><b>gizonak</b></td></tr></table>',
  tip:'Si el nombre ya acaba en <b>-a</b>, no cambia en singular: <b>ama</b> (la madre). El plural sí: <b>amak</b>.'},
 {t:'«bat» y los números',h:'<p><b>bat</b> = un / una, y va <b>detrás</b> del nombre. Con otros números, el nombre va <b>sin artículo y sin plural</b>.</p>',
  ex:[['liburu bat','un libro'],['bi liburu','dos libros (no «bi liburuak»)'],['hiru etxe','tres casas'],['etxe handi bat','una casa grande']]},
 {t:'Hau, hori, hura',h:'<p>Tres formas de señalar, según la distancia.</p>',
  tb:'<table class="mini"><tr><th>Singular</th><th>Plural</th><th>Significa</th></tr><tr><td><b>hau</b></td><td>hauek</td><td>este (cerca de mí)</td></tr><tr><td><b>hori</b></td><td>horiek</td><td>ese (cerca de ti)</td></tr><tr><td><b>hura</b></td><td>haiek</td><td>aquel (lejos)</td></tr></table>',
  ex:[['Hau liburua da.','Esto es el libro.'],['Hori ez da nire etxea.','Esa no es mi casa.'],['Haiek behiak dira.','Aquellas son vacas.']]},
 {t:'El adjetivo va detrás',h:'<p>El adjetivo se coloca <b>después</b> del nombre, y es el adjetivo quien lleva el artículo.</p>',
  pc:[['etxe','p-obj','nombre'],['handia','p-part','adjetivo + a']],
  ex:[['etxe handia','la casa grande'],['mendi garaia','el monte alto'],['txakur txikiak','los perros pequeños']]}
 ],
 make:()=>[].concat(vq('etxea',3),[
  mc('El artículo','«la casa»','¿Cómo se dice?','etxea',['etxe a','etxeak','etxe bat'],'<b>etxe</b> + a = etxea.','El artículo no es una palabra aparte: se pega al final del nombre.'),
  mc('El plural','«los libros»','¿Cómo se dice?','liburuak',['liburua','liburu bat','liburuk'],'Plural: <b>liburu + ak</b> = liburuak.'),
  mc('Números','«dos libros»','¿Cómo se dice?','bi liburu',['bi liburuak','bi liburua','liburu bi'],'Tras un número el nombre queda sin artículo ni plural: <b>bi liburu</b>.'),
  mc('Bat','«una casa»','¿Cómo se dice?','etxe bat',['bat etxe','etxea bat','etxeak bat'],'<b>bat</b> va detrás del nombre: etxe bat.'),
  mc('Señalar','«Esto es el libro»','¿Cómo se dice?','Hau liburua da',['Hori liburua da','Hau liburu bat','Hura liburuak dira'],'<b>hau</b> = esto (cerca de mí). El verbo va al final: da.'),
  mc('Adjetivos','«la casa grande»','¿Cómo se dice?','etxe handia',['handia etxe','etxea handi','etxe handi bat'],'Nombre + adjetivo con artículo: <b>etxe handia</b>.')
 ])},

{id:'l4',n:4,eu:'Non? Nora? Nondik?',es:'Casos de lugar y «egon»',ic:'📍',min:8,
 goals:['Decir en, a y desde un lugar con -n, -ra y -tik','Usar -ko / -go para «de» un sitio','Distinguir egon (estar) de izan (ser)'],
 steps:[
 {t:'Las terminaciones de lugar',h:'<p>Donde el español usa «en, a, desde, de», el euskera añade una terminación al final del lugar.</p>',
  tb:'<table class="mini"><tr><th>Pregunta</th><th>Final</th><th>etxea</th><th>Elizondo</th></tr><tr><td>Non? <small>(dónde)</small></td><td>-n</td><td>etxe<b>an</b></td><td>Elizondo<b>n</b></td></tr><tr><td>Nora? <small>(adónde)</small></td><td>-ra</td><td>etxe<b>ra</b></td><td>Elizondo<b>ra</b></td></tr><tr><td>Nondik? <small>(desde)</small></td><td>-tik</td><td>etxe<b>tik</b></td><td>Elizondo<b>tik</b></td></tr><tr><td>Nongo? <small>(de)</small></td><td>-ko</td><td>etxe<b>ko</b></td><td>Elizondo<b>ko</b></td></tr></table>',
  tip:'Si el lugar acaba en <b>consonante</b>, cambia un poco: Baztan → <b>Baztanen</b> (en), <b>Baztanera</b> (a), <b>Baztanetik</b> (desde), <b>Baztango</b> (de).'},
 {t:'Egon: estar en un sitio',h:'<p>Para decir <b>dónde está</b> algo o alguien se usa <b>egon</b>, no izan.</p>',
  tb:'<table class="mini"><tr><th></th><th>egon</th></tr><tr><td>ni</td><td><b>nago</b></td></tr><tr><td>zu</td><td><b>zaude</b></td></tr><tr><td>hura</td><td><b>dago</b></td></tr><tr><td>gu</td><td><b>gaude</b></td></tr><tr><td>zuek</td><td><b>zaudete</b></td></tr><tr><td>haiek</td><td><b>daude</b></td></tr></table>',
  ex:[['Ni etxean nago.','Estoy en casa.'],['Behiak mendian daude.','Las vacas están en el monte.'],['Ama sukaldean dago.','Mamá está en la cocina.']]},
 {t:'Ir y venir',h:'<p><b>joan</b> (ir) y <b>etorri</b> (venir) tienen formas propias, sin auxiliar. Se usan con <b>-ra</b> y <b>-tik</b>.</p>',
  tb:'<table class="mini"><tr><th></th><th>joan (ir)</th><th>etorri (venir)</th></tr><tr><td>ni</td><td><b>noa</b></td><td><b>nator</b></td></tr><tr><td>zu</td><td><b>zoaz</b></td><td><b>zatoz</b></td></tr><tr><td>hura</td><td><b>doa</b></td><td><b>dator</b></td></tr><tr><td>gu</td><td><b>goaz</b></td><td><b>gatoz</b></td></tr><tr><td>zuek</td><td><b>zoazte</b></td><td><b>zatozte</b></td></tr><tr><td>haiek</td><td><b>doaz</b></td><td><b>datoz</b></td></tr></table>',
  pc:[['Ni','p-sub','quién'],['Iruñera','p-obj','adónde (-ra)'],['noa','p-aux','voy']],
  ex:[['Gu Baztanera goaz.','Vamos a Baztan.'],['Zu Elizondotik zatoz.','Vienes de Elizondo.'],['Ni etxera noa.','Voy a casa.']],
  tip:'Ser o estar: <b>Baztangoa naiz</b> (soy de allí, izan). <b>Baztanen nago</b> (ahora estoy allí, egon).'}
 ],
 make:()=>[].concat(conjQs(['egon','joan','etorri'],5),lsq('noa'),SQ(4,5,8,16),[
  mc('Non?','etxea → «en casa»','Añade la terminación','etxean',['etxera','etxetik','etxeko'],'<b>-n</b> responde a «non»: etxean.'),
  mc('Nora?','etxea → «a casa»','Añade la terminación','etxera',['etxean','etxetik','etxeko'],'<b>-ra</b> = «a, hacia»: etxera.'),
  mc('Nondik?','Elizondo → «desde Elizondo»','Añade la terminación','Elizondotik',['Elizondon','Elizondora','Elizondoko'],'<b>-tik</b> = «desde».'),
  mc('Ser o estar','«Estoy en Elizondo»','¿Cuál es?','Elizondon nago',['Elizondon naiz','Elizondora nago','Elizondotik nago'],'Dónde estás → <b>egon</b> (nago) + <b>-n</b>.'),
  mc('Baztan','«Voy a Baztan»','¿Cómo se dice?','Baztanera noa',['Baztanra noa','Baztango noa','Baztanen noa'],'Baztan acaba en consonante: + <b>era</b> = Baztanera.')
 ])},

{id:'l5',n:5,eu:'Zenbakiak',es:'Números, precios y edad',ic:'🔢',min:8,
 goals:['Contar hasta 100','Preguntar y decir precios','Decir tu edad (con «ukan», ¡sorpresa!)'],
 steps:[
 {t:'Del 1 al 20',h:'<p>Memoriza estos: son la base de todo lo demás.</p>',
  tb:'<table class="mini"><tr><td>1 <b>bat</b></td><td>6 <b>sei</b></td><td>11 <b>hamaika</b></td><td>16 <b>hamasei</b></td></tr><tr><td>2 <b>bi</b></td><td>7 <b>zazpi</b></td><td>12 <b>hamabi</b></td><td>17 <b>hamazazpi</b></td></tr><tr><td>3 <b>hiru</b></td><td>8 <b>zortzi</b></td><td>13 <b>hamahiru</b></td><td>18 <b>hamazortzi</b></td></tr><tr><td>4<b>lau</b></td><td>9 <b>bederatzi</b></td><td>14 <b>hamalau</b></td><td>19 <b>hemeretzi</b></td></tr><tr><td>5 <b>bost</b></td><td>10 <b>hamar</b></td><td>15 <b>hamabost</b></td><td>20 <b>hogei</b></td></tr></table>',
  tip:'Del 11 al 17 es <b>hama-</b> + número (hama + bi = hamabi). Es la regla del 10 + n.'},
 {t:'De veinte en veinte',h:'<p>El euskera cuenta de <b>veinte en veinte</b>, como el francés «quatre-vingts». Los decenas son:</p>',
  tb:'<table class="mini"><tr><td>20 <b>hogei</b></td><td>60 <b>hirurogei</b></td></tr><tr><td>30 <b>hogeita hamar</b> <small>(20+10)</small></td><td>70 <b>hirurogeita hamar</b></td></tr><tr><td>40 <b>berrogei</b></td><td>80 <b>laurogei</b></td></tr><tr><td>50 <b>berrogeita hamar</b></td><td>90 <b>laurogeita hamar</b></td></tr><tr><td colspan="2">100 <b>ehun</b></td></tr></table>',
  ex:[['hogeita bat','21 (veinte y uno)'],['hogeita bost','25'],['berrogeita zazpi','47'],['laurogeita bi','82']],
  tip:'Entre la decena y la unidad va <b>eta</b> («y»), pegado: hogei<b>ta</b> bost.'},
 {t:'Precios y horas',h:'<p><b>Zenbat da?</b> = ¿cuánto es? Con un euro, el verbo va en singular (<b>da</b>). Con más, en plural (<b>dira</b>).</p>',
  ex:[['Zenbat da?','¿Cuánto es?'],['Euro bat da.','Es un euro.'],['Bost euro dira.','Son cinco euros.'],['Zer ordu da?','¿Qué hora es?'],['Ordu bata da. / Biak dira. / Hirurak dira.','Es la una. / Son las dos. / Son las tres.']],
  tip:'Para las horas, tu profesor te dirá la fórmula exacta. Aquí practicamos precios y edad.'},
 {t:'La edad usa «ukan»',h:'<p>En euskera no «eres» años: los <b>tienes</b>. Como son varios años (plural), el auxiliar es <b>ditut</b>, el plural de <b>dut</b>.</p>',
  pc:[['Zenbat','p-sub','cuántos'],['urte','p-obj','años'],['dituzu','p-aux','tienes']],
  ex:[['Zenbat urte dituzu?','¿Cuántos años tienes?'],['Berrogei urte ditut.','Tengo cuarenta años.'],['Hogeita bost urte ditu.','Tiene veinticinco años.']]}
 ],
 make:()=>[].concat(vq('zenbakiak',4),[
  mc('Zenbakiak','hogei','¿Qué número es?','20',['12','2','200'],'<b>hogei</b> = 20. Base del sistema de veintes.'),
  mc('Zenbakiak','berrogei','¿Qué número es?','40',['14','4','60'],'<b>berrogei</b> = 40 (dos veintes).'),
  mc('Zenbakiak','laurogei','¿Qué número es?','80',['40','60','90'],'<b>laurogei</b> = 80 (cuatro veintes).'),
  mc('Zenbakiak','25','¿Cómo se dice?','hogeita bost',['hogei bost','bost hogei','hamabost'],'20 + 5 = <b>hogei-ta bost</b>.'),
  mc('Prezioak','«Son cinco euros»','¿Cómo se dice?','Bost euro dira',['Bost euro da','Bost euroak dira','Euro bost dira'],'Más de uno → <b>dira</b>, y el nombre sin plural: bost euro.'),
  mc('Adina','«Tengo 30 años»','¿Cómo se dice?','Hogeita hamar urte ditut',['Hogeita hamar urte naiz','Hogeita hamar urte dut','Ni hogeita hamar naiz'],'Los años se <b>tienen</b>: urte <b>ditut</b> (plural).')
 ])}
];
</script>
<script>
/* ===== LECCIONES (6-11) ===== */
LESSONS.push(
{id:'l6',n:6,eu:'Familia',es:'De quién es, cómo es, qué tengo',ic:'👨‍👩‍👧',min:8,
 goals:['Decir de quién es algo con -ren / -en','Usar nire, zure, haren…','Describir con «nolakoa» y tener con «eduki»'],
 steps:[
 {t:'De quién: -ren',h:'<p>«La casa del padre» se dice al revés: <b>del padre la casa</b>. Al dueño se le añade <b>-ren</b> (tras vocal) o <b>-en</b> (tras consonante).</p>',
  ex:[['aitaren etxea','la casa del padre'],['amaren liburua','el libro de la madre'],['Dabiden txakurra','el perro de David'],['Baztanen bizi gara','vivimos en Baztan (aquí -en = en)']],
  tip:'Ojo: en <b>Dabiden</b> el «-en» es genitivo (de David). En <b>Baztanen</b> es «en Baztan». Mismas letras, distinto papel.'},
 {t:'Mi, tu, su…',h:'<p>Los posesivos van <b>antes</b> del nombre.</p>',
  tb:'<table class="mini"><tr><th></th><th>de</th><th>ejemplo</th></tr><tr><td>ni</td><td><b>nire</b></td><td>nire ama = mi madre</td></tr><tr><td>zu</td><td><b>zure</b></td><td>zure etxea = tu casa</td></tr><tr><td>hura</td><td><b>haren</b></td><td>haren anaia = su hermano</td></tr><tr><td>gu</td><td><b>gure</b></td><td>gure familia</td></tr><tr><td>zuek</td><td><b>zuen</b></td><td>zuen lagunak</td></tr><tr><td>haiek</td><td><b>haien</b></td><td>haien seme</td></tr></table>'},
 {t:'¿Cómo es? Nolakoa',h:'<p>Para describir: <b>Nolakoa da...?</b> y respondes con nombre + adjetivo (con artículo) + <b>da</b>.</p>',
  pc:[['Ama','p-sub','quién'],['polita','p-part','adjetivo'],['da','p-aux','es']],
  ex:[['Nolakoa da zure aita?','¿Cómo es tu padre?'],['Nire aita altua da.','Mi padre es alto.'],['Amona zaharra da.','La abuela es mayor.']]},
 {t:'Tener: eduki',h:'<p><b>eduki</b> = tener. Va con sujeto en <b>-k</b> (nik, zuk…). Una cosa: <b>daukat</b>. Varias: <b>dauzkat</b>.</p>',
  tb:'<table class="mini"><tr><th></th><th>1 cosa</th><th>varias</th></tr><tr><td>nik</td><td>daukat</td><td>dauzkat</td></tr><tr><td>zuk</td><td>daukazu</td><td>dauzkazu</td></tr><tr><td>hark</td><td>dauka</td><td>dauzka</td></tr><tr><td>guk</td><td>daukagu</td><td>dauzkagu</td></tr></table>',
  ex:[['Nik arreba bat daukat.','Tengo una hermana.'],['Nik bi anai dauzkat.','Tengo dos hermanos.']]}
 ],
 make:()=>[].concat(vq('familia',3),conjQs(['eduki'],3),lsq('fam','gen'),[
  mc('-ren','«la casa del padre»','¿Cómo se dice?','aitaren etxea',['etxea aitaren','aita etxea','aitak etxea'],'El dueño va primero con <b>-ren</b>: aita<b>ren</b> etxea.','Piensa en el orden: primero va el dueño con su terminación de «de», después la cosa.'),
  mc('-en','«el perro de David»','¿Cómo se dice?','Dabiden txakurra',['Dabidaren txakurra','Dabid txakurra','Txakurra Dabiden'],'Tras consonante: <b>-en</b>. Dabid + en.'),
  mc('Posesivos','«mi madre»','¿Cómo se dice?','nire ama',['ama nire','zure ama','nik ama'],'El posesivo va delante: <b>nire</b> ama.'),
  mc('Eduki','«Tengo dos hermanos»','¿Auxiliar correcto?','Bi anai dauzkat',['Bi anai daukat','Bi anai naiz','Bi anai nago'],'Varias cosas → <b>dauzkat</b>.')
 ])},

{id:'l7',n:7,eu:'Ukan',es:'El verbo auxiliar con objeto (nork)',ic:'🔧',min:10,
 goals:['Entender cuándo se usa ukan (dut, du…) y cuándo izan','Poner el sujeto en -k (nik, aitak…)','Pasar de singular (dut) a plural (ditut)'],
 steps:[
 {t:'La idea clave: ¿hay un «qué»?',h:'<p>La mayoría de verbos necesitan un <b>auxiliar</b>. Para elegirlo, hazte una pregunta: <b>¿lo que hago, lo hago «a algo»?</b></p>',
  tb:'<table class="mini"><tr><th>Sin objeto → <b>izan</b></th><th>Con objeto → <b>ukan</b></th></tr><tr><td>joan (ir), etorri (venir), bizi (vivir), egon</td><td>jan (comer), edan (beber), ikusi, irakurri, ikasi</td></tr><tr><td>Ni etxera joaten <b>naiz</b>.</td><td>Nik ogia jaten <b>dut</b>.</td></tr></table>',
  tip:'Truco: si puedes preguntar «¿qué?» después del verbo («como… ¿qué? pan»), es <b>ukan</b>.'},
 {t:'El sujeto lleva -k',h:'<p>Cuando el verbo lleva objeto, quien lo hace se marca con <b>-k</b>. Es el rasgo más raro del euskera para un hispanohablante, y el más importante.</p>',
  tb:'<table class="mini"><tr><th>sin objeto</th><th>con objeto (-k)</th></tr><tr><td>ni</td><td><b>nik</b></td></tr><tr><td>zu</td><td><b>zuk</b></td></tr><tr><td>hura</td><td><b>hark</b></td></tr><tr><td>gu</td><td><b>guk</b></td></tr><tr><td>zuek</td><td>zuek</td></tr><tr><td>haiek</td><td>haiek</td></tr></table>',
  ex:[['Aita etxera doa.','El padre va a casa. (sin objeto)'],['Aitak ogia jaten du.','El padre come pan. (con objeto: aitak)'],['Amak liburua irakurtzen du.','La madre lee el libro.']]},
 {t:'Las formas: dut, duzu, du…',h:'<p>Cada forma se arma con piezas: <b>d-</b> (lo) + <b>u</b> (raíz) + el final que dice quién lo hace. Si hay <b>varios</b> objetos, la raíz cambia a <b>itu</b>.</p>',
  tb:'<table class="mini"><tr><th></th><th>1 objeto</th><th>varios</th></tr><tr><td>nik</td><td>dut</td><td>ditut</td></tr><tr><td>zuk</td><td>duzu</td><td>dituzu</td></tr><tr><td>hark</td><td>du</td><td>ditu</td></tr><tr><td>guk</td><td>dugu</td><td>ditugu</td></tr><tr><td>zuek</td><td>duzue</td><td>dituzue</td></tr><tr><td>haiek</td><td>dute</td><td>dituzte</td></tr></table>',
  ex:[['Nik liburua irakurtzen dut.','Leo el libro.'],['Nik liburuak irakurtzen ditut.','Leo los libros.']],
  tip:'El auxiliar concuerda con el <b>objeto</b>, no con el sujeto: un libro → dut; varios → ditut.'},
 {t:'Aplícalo: de la frase al auxiliar',h:'<p>Paso a paso con una frase real:</p><p>1. ¿Hay un «qué»? Sí (ogia) → <b>ukan</b>.<br>2. Sujeto con <b>-k</b>: ni → <b>nik</b>.<br>3. Un solo objeto → <b>dut</b>.</p>',
  pc:[['Nik','p-sub','quién (-k)'],['ogia','p-obj','qué'],['jaten','p-part','verbo'],['dut','p-aux','auxiliar (ukan)']]}
 ],

{id:'l8',n:8,eu:'Ohiturak',es:'Hábitos y lo que haces ahora',ic:'⏰',min:8,
 goals:['Formar el verbo habitual con -ten / -tzen','Decir que algo está pasando ahora con «ari»','Colocar ez y las palabras de frecuencia'],
 steps:[
 {t:'El verbo habitual',h:'<p>Para hablar de lo que haces <b>normalmente</b>, el verbo toma la forma habitual (<b>-ten / -tzen</b>) y añades el auxiliar.</p>',
  tb:'<table class="mini"><tr><th>Participio</th><th>Habitual</th></tr><tr><td>jan</td><td><b>jaten</b></td></tr><tr><td>edan</td><td><b>edaten</b></td></tr><tr><td>ikasi</td><td><b>ikasten</b></td></tr><tr><td>ikusi</td><td><b>ikusten</b></td></tr><tr><td>irakurri</td><td><b>irakurtzen</b></td></tr><tr><td>joan</td><td><b>joaten</b></td></tr><tr><td>etorri</td><td><b>etortzen</b></td></tr></table>',
  pc:[['Nik','p-sub','quién (-k)'],['kafea','p-obj','qué'],['edaten','p-part','habitual'],['dut','p-aux','auxiliar']],
  tip:'Estas formas hay que aprenderlas con cada verbo. No hay regla que las cubra todas.'},
 {t:'Ahora mismo: ari izan',h:'<p>Para decir que <b>estás haciendo algo ahora</b>: forma habitual + <b>ari</b> + <b>izan</b>. Aquí el auxiliar es siempre <b>izan</b>, aunque el verbo lleve objeto, y el sujeto vuelve a ir sin -k.</p>',
  pc:[['Ni','p-sub','quién (sin -k)'],['kafea','p-obj','qué'],['edaten','p-part','habitual'],['ari','p-part','ahora'],['naiz','p-aux','izan']],
  ex:[['Ni euskara ikasten ari naiz.','Estoy aprendiendo euskera.'],['Ama ogia jaten ari da.','Mamá está comiendo pan.']]},
 {t:'Con qué frecuencia',h:'<p>Estas palabras sitúan el hábito y se colocan en la frase antes del verbo.</p>',
  ex:[['egunero','cada día'],['beti','siempre'],['sarri','a menudo'],['batzuetan','a veces'],['inoiz ez','nunca'],['Egunero kafea edaten dut.','Cada día bebo café.'],['Beti euskaraz hitz egiten dugu.','Siempre hablamos en euskera.']]},
 {t:'Decir que no',h:'<p><b>ez</b> va justo antes del auxiliar. Después queda el verbo.</p>',
  pc:[['Nik','p-sub','quién'],['ez','p-part','no'],['dut','p-aux','auxiliar'],['kafea','p-obj','qué'],['edaten','p-part','verbo']],
  ex:[['Nik ez dut kafea edaten.','No bebo café.'],['Ni ez naiz Iruñera joaten.','No voy a Pamplona.']]}
 ],
 make:()=>[].concat(gb(['oraina','ari'],5),lsq('ez1'),vq('aditzak',2),[
  mc('Habitual','jan → «comer, habitual»','¿Cuál es?','jaten',['jateten','jan','jan du'],'<b>jan</b> → <b>jaten</b> (irregular, hay que aprenderlo).','Es la forma habitual, con terminación -ten o -tzen. Este verbo es irregular.'),
  mc('Habitual','irakurri → «leer, habitual»','¿Cuál es?','irakurtzen',['irakurten','irakurri','irakurri du'],'<b>irakurri</b> → <b>irakurtzen</b>.'),
  mc('Ari izan','«Estoy bebiendo agua»','¿Cómo se dice?','Ni ura edaten ari naiz',['Nik ura edaten ari dut','Ni ura edan naiz','Ni ura edaten dut ari'],'Con <b>ari</b> el auxiliar es <b>izan</b> y el sujeto va sin -k: Ni… ari naiz.')
 ])},

{id:'l9',n:9,eu:'Gustuak eta beharrak',es:'Gustar, querer y tener que',ic:'❤️',min:9,

 steps:[
 {t:'Gustar funciona «al revés»',h:'<p>En euskera no «gustas» algo: <b>algo te gusta a ti</b>. Lo que gusta es el sujeto; a quien le gusta lleva <b>-ri</b>.</p>',
  tb:'<table class="mini"><tr><th>A quién</th><th>le gusta</th></tr><tr><td>niri <small>(a mí)</small></td><td>gustatzen <b>zait</b></td></tr><tr><td>zuri</td><td>gustatzen <b>zaizu</b></td></tr><tr><td>hari</td><td>gustatzen <b>zaio</b></td></tr><tr><td>guri</td><td>gustatzen <b>zaigu</b></td></tr><tr><td>zuei</td><td>gustatzen <b>zaizue</b></td></tr><tr><td>haiei</td><td>gustatzen <b>zaie</b></td></tr></table>',
  pc:[['Niri','p-sub','a quién (-ri)'],['kafea','p-obj','qué gusta'],['gustatzen','p-part','verbo'],['zait','p-aux','me']],
  ex:[['Niri kafea gustatzen zait.','Me gusta el café.'],['Zuri zer gustatzen zaizu?','¿Qué te gusta a ti?']]},
 {t:'Una cosa o varias',h:'<p>El auxiliar concuerda con <b>lo que gusta</b>. Si es plural, pasa de <b>zait</b> a <b>zaizkit</b> (y así con todas las personas: zaizu → zaizkizu).</p>',
  ex:[['Niri sagarra gustatzen zait.','Me gusta la manzana.'],['Niri sagarrak gustatzen zaizkit.','Me gustan las manzanas.'],['Guri mendia gustatzen zaigu.','Nos gusta el monte.']],
  tip:'No importa quién siente el gusto: importa si <b>lo que gusta</b> es uno (zait) o varios (zaizkit).'},
 {t:'Querer y tener que',h:'<p>Dos verbos muy útiles, los dos con <b>ukan</b> (sujeto en -k). Van detrás del verbo en <b>participio</b>.</p>',
  pc:[['Nik','p-sub','quién (-k)'],['euskara','p-obj','qué'],['ikasi','p-part','verbo'],['nahi','p-part','querer'],['dut','p-aux','auxiliar']],
  ex:[['Kafe bat nahi dut.','Quiero un café.'],['Nik euskara ikasi nahi dut.','Quiero aprender euskera.'],['Nik etxera joan behar dut.','Tengo que ir a casa.']]},
 {t:'En negativo',h:'<p>Para decir que <b>no te gusta</b>, <b>ez</b> va antes del auxiliar.</p>',
  ex:[['Niri ez zait kafea gustatzen.','No me gusta el café.'],['Nik ez dut ura nahi.','No quiero agua.']]}
 ],
 make:()=>[].concat(lsq('gus1','gus2','nahi','behar','dial1'),vq('janaria',3),[
  mc('Gustatu','«Me gusta el café»','¿Auxiliar?','Niri kafea gustatzen zait',['Niri kafea gustatzen dut','Nik kafea gustatzen zait','Niri kafea gustatzen zaizkit'],'Lo que gusta es singular → <b>zait</b>. «A mí» = niri.','Dos cosas: ¿a quién le gusta (lleva -ri)? ¿Lo que gusta es uno o varios?'),
  mc('Gustatu','«Me gustan las manzanas»','¿Auxiliar?','Niri sagarrak gustatzen zaizkit',['Niri sagarrak gustatzen zait','Nik sagarrak gustatzen ditut','Niri sagarrak gustatzen nago'],'Lo que gusta es plural → <b>zaizkit</b>.'),
  mc('Gustatu','«A ti te gusta la sidra»','¿Cuál es?','Zuri sagardoa gustatzen zaizu',['Zuri sagardoa gustatzen zait','Zuk sagardoa gustatzen duzu','Zuri sagardoa gustatzen du'],'Para «a ti»: <b>zuri</b> + <b>zaizu</b>.')
 ])},

 ],
 make:()=>[].concat(lsq('dial1'),SQ(1,13,18),[
  mc('Mesedez','Pides un café','¿Cuál es?','Kafe bat nahi dut, mesedez',['Kafea naiz, mesedez','Kafe bat zait, mesedez','Kafe dut bat'],'<b>nahi dut</b> = quiero.'),
  mc('Prezioa','Preguntas el precio','¿Cuál es?','Zenbat da?',['Non dago?','Nor da?','Zer da?'],'<b>Zenbat da?</b> = ¿cuánto es?','Es una pregunta por la cantidad, con el verbo «ser» en singular.'),
  mc('Bidea','«¿Dónde está el baño?»','¿Cuál es?','Non dago komuna?',['Nora doa komuna?','Non da komuna?','Nor dago komuna?'],'<b>Non dago…?</b> con <b>egon</b>.'),
  mc('Gustatu','«Me gusta el monte»','¿Cuál es?','Niri mendia gustatzen zait',['Nik mendia gustatzen dut','Ni mendia naiz','Niri mendiak gustatzen zait'],'<b>niri</b> + <b>zait</b>.')
 ])},

{id:'l12',n:12,eu:'Data eta denbora',es:'Días, meses, estaciones, fecha y adjetivos',ic:'🗓️',min:9,
 goals:['Decir los días, los meses y las estaciones','Preguntar y decir la fecha (Zein egun da gaur?)','Usar adjetivos: etxe handia, etxea handia da'],
 steps:[
 {t:'Egunak eta hilabeteak',h:'<p>Los días de la semana y los meses se escriben <b>con minúscula</b>. Todos los meses acaban en <b>-a</b>.</p>',
  tb:'<table class="mini"><tr><th>Egunak</th><th></th><th>Hilabeteak</th><th></th></tr><tr><td><b>astelehena</b></td><td>lunes</td><td><b>urtarrila</b></td><td>enero</td></tr><tr><td><b>asteartea</b></td><td>martes</td><td><b>otsaila</b></td><td>febrero</td></tr><tr><td><b>asteazkena</b></td><td>miércoles</td><td><b>martxoa</b></td><td>marzo</td></tr><tr><td><b>osteguna</b></td><td>jueves</td><td><b>apirila</b></td><td>abril</td></tr><tr><td><b>ostirala</b></td><td>viernes</td><td><b>maiatza</b></td><td>mayo</td></tr><tr><td><b>larunbata</b></td><td>sábado</td><td><b>ekaina</b></td><td>junio</td></tr><tr><td><b>igandea</b></td><td>domingo</td><td><b>uztaila</b></td><td>julio</td></tr><tr><td></td><td></td><td><b>abuztua</b></td><td>agosto</td></tr><tr><td></td><td></td><td><b>iraila</b></td><td>septiembre</td></tr><tr><td></td><td></td><td><b>urria</b></td><td>octubre</td></tr><tr><td></td><td></td><td><b>azaroa</b></td><td>noviembre</td></tr><tr><td></td><td></td><td><b>abendua</b></td><td>diciembre</td></tr></table>',
  tip:'<b>astea</b> = semana y <b>eguna</b> = día. Los nombres ya llevan el artículo: asteartea = «el martes».'},
 {t:'Urtaroak',h:'<p>Las cuatro estaciones. Con <b>-n</b> dices «en» (como en los lugares: etxean).</p>',
  tb:'<table class="mini"><tr><th>Urtaroa</th><th></th><th>En…</th></tr><tr><td><b>udaberria</b></td><td>primavera</td><td>udaberrian</td></tr><tr><td><b>uda</b></td><td>verano</td><td>udan</td></tr><tr><td><b>udazkena</b></td><td>otoño</td><td>udazkenean</td></tr><tr><td><b>negua</b></td><td>invierno</td><td>neguan</td></tr></table>',
  ex:[['Udan Baztanera joaten naiz.','En verano voy a Baztan.'],['Neguan elurra egiten du.','En invierno nieva.'],['Zein urtaro da?','¿Qué estación es?']],
  tip:'Fíjate: <b>uda → udan</b>, <b>negua → neguan</b>, <b>udazkena → udazkenean</b>. Es el mismo «en» de <b>etxean</b> (en la casa).'},
 {t:'La fecha',h:'<p>Para preguntar el día: <b>Zein egun da gaur?</b> Para la fecha: <b>Zein da gaurko data?</b></p><p>La fecha se forma así: <b>mes + -(r)en + número + a</b>. Si añades el año, va primero con <b>-ko</b>.</p>',
  pc:[['azaroa','p-obj','mes'],['+ren','p-aux','de'],['6a','p-sub','día']],
  ex:[['Zein egun da gaur?','¿Qué día es hoy?'],['Gaur ostirala da.','Hoy es viernes.'],['Zein da gaurko data?','¿Cuál es la fecha de hoy?'],['Gaurko data azaroaren 6a da.','La fecha de hoy es el 6 de noviembre.'],['2026ko azaroaren 6a','6 de noviembre de 2026'],['Noiz da zure urtebetetzea?','¿Cuándo es tu cumpleaños?'],['Nire urtebetetzea maiatzaren 3a da.','Mi cumpleaños es el 3 de mayo.']],
  tip:'<b>noiz</b> = cuándo. Los números se escriben con cifras y se leen con el artículo: 6a = seia.'},
 {t:'Adjektiboak',h:'<p>El adjetivo va <b>detrás del nombre</b> y lleva el artículo: <b>etxe handia</b> (la casa grande). Si lo usas con el verbo <b>izan</b>: <b>Etxea handia da</b>. Con <b>bat</b> pierde el artículo: <b>etxe handi bat</b>.</p>',
  tb:'<table class="mini"><tr><th></th><th></th><th></th><th></th></tr><tr><td><b>handia</b></td><td>grande</td><td><b>txikia</b></td><td>pequeño</td></tr><tr><td><b>zaharra</b></td><td>viejo</td><td><b>berria</b></td><td>nuevo</td></tr><tr><td><b>ona</b></td><td>bueno</td><td><b>txarra</b></td><td>malo</td></tr><tr><td><b>luzea</b></td><td>largo</td><td><b>laburra</b></td><td>corto</td></tr><tr><td><b>garestia</b></td><td>caro</td><td><b>merkea</b></td><td>barato</td></tr><tr><td><b>beroa</b></td><td>caliente</td><td><b>hotza</b></td><td>frío</td></tr><tr><td><b>azkarra</b></td><td>rápido</td><td><b>motela</b></td><td>lento</td></tr><tr><td><b>gaztea</b></td><td>joven</td><td><b>polita</b></td><td>bonito</td></tr></table>',
  ex:[['Etxe handia','La casa grande'],['Etxea handia da.','La casa es grande.'],['Liburu berri bat daukat.','Tengo un libro nuevo.']],
  tip:'Plural: <b>etxe handiak</b> (las casas grandes). Cuanto más lo uses con colores y objetos que ya conoces (etxe zuria, liburu berdea), antes lo automatizas.'}
 ],
 make:()=>(Object.assign(LS,{
   dat1:{t:['gaur','ostirala','da'],es:'Hoy es viernes.',tip:'Zein egun da gaur? → Gaur + día + da.'},
   dat2:{t:['gaurko','data','azaroaren','6a','da'],es:'La fecha de hoy es el 6 de noviembre.',tip:'mes + -(r)en + número + a: azaroa → azaroaren 6a.'},
   dat3:{t:['nire','urtebetetzea','maiatzaren','3a','da'],es:'Mi cumpleaños es el 3 de mayo.',tip:'Noiz da zure urtebetetzea? → Nire urtebetetzea + fecha + da.'},
   adj1:{t:['etxea','handia','da'],es:'La casa es grande.',tip:'El adjetivo va detrás del nombre y con artículo: handia.'},
   adj2:{t:['liburu','berri','bat','daukat'],es:'Tengo un libro nuevo.',tip:'Con bat el adjetivo pierde el artículo: berri bat (no berria bat).'},
   urt1:{t:['udan','Baztanera','joaten','naiz'],es:'En verano voy a Baztan.',tip:'-n = en: uda → udan.'}
 }),[].concat(lsq('dat2','dat3','adj2','urt1'),vq('hilabeteak',3),vq('urtaroak',3),vq('adjetiboak',3),[
  mc('Data','«¿Qué día es hoy?»','¿Cuál es?','Zein egun da gaur?',['Noiz da gaur?','Non da gaur?','Zein egun dago gaur?'],'<b>Zein egun da gaur?</b> con izan.'),
  mc('Data','«El 6 de noviembre»','¿Cuál es?','azaroaren 6a',['azaroa 6a','azaroak 6a','azaroan 6a'],'mes + <b>-(r)en</b> + número + <b>a</b>.'),
  mc('Data','Noiz da zure urtebetetzea?','¿Qué pregunta?','¿Cuándo es tu cumpleaños?',['¿Cuántos años tienes?','¿Dónde vives?','¿Qué día es hoy?'],'<b>noiz</b> = cuándo.'),
  mc('Urtaroak','«En invierno»','¿Cuál es?','neguan',['negua','neguaren','negutik'],'-n = en: negua → <b>neguan</b>.'),
  mc('Adjektiboak','«Una casa grande»','¿Cuál es?','etxe handi bat',['etxe handia bat','handi etxe bat','etxea handi bat'],'Con <b>bat</b> el adjetivo va sin artículo.'),
  mc('Adjektiboak','handia ↔ ?','Su contrario','txikia',['berria','zaharra','garestia'],'<b>handia</b> = grande, <b>txikia</b> = pequeño.')
 ]))}
);
</script>

{id:'b1',lv:'a1',n:13,eu:'Non dago?',es:'Dónde está: sobre, bajo, dentro…',ic:'📍',min:7,

  tb:'<table class="mini"><tr><th>Euskera</th><th>Español</th></tr><tr><td><b>gainean</b></td><td>sobre, encima de</td></tr><tr><td><b>azpian</b></td><td>debajo de</td></tr><tr><td><b>barruan</b></td><td>dentro de</td></tr><tr><td><b>kanpoan</b></td><td>fuera de</td></tr><tr><td><b>ondoan</b></td><td>al lado de</td></tr><tr><td><b>aurrean</b></td><td>delante de</td></tr><tr><td><b>atzean</b></td><td>detrás de</td></tr><tr><td><b>artean</b></td><td>entre</td></tr></table>',
  tip:'Si el nombre acaba en -a, se añade <b>-ren</b> (mahaia → mahaiaren). Si acaba en consonante, <b>-en</b> (Dabid → Dabiden).'},
 {t:'Con personas y cosas',h:'<p>Con los posesivos no hace falta genitivo: <b>nire ondoan</b> (a mi lado), <b>zure atzean</b> (detrás de ti).</p>',
  ex:[['Liburua mahaiaren gainean dago.','El libro está sobre la mesa.'],['Katua aulkiaren azpian dago.','El gato está debajo de la silla.'],['Txakurra etxearen kanpoan dago.','El perro está fuera de la casa.'],['Nire ondoan dago.','Está a mi lado.']]},
 {t:'Preguntar dónde está',h:'<p>La pregunta es <b>Non dago…?</b> (singular) o <b>Non daude…?</b> (plural). Contestas con la posición y <b>dago / daude</b> al final.</p>',
  ex:[['Non dago telefonoa?','¿Dónde está el teléfono?'],['Mahaiaren gainean dago.','Está sobre la mesa.'],['Non daude gakoak?','¿Dónde están las llaves?']],
  tip:'Siempre <b>egon</b> (dago / daude) para decir dónde está algo.'}
 ],

{id:'b2',lv:'a1',n:22,eu:'Nori eman diozu?',es:'«A quién» (-ri) y «para quién» (-rentzat)',ic:'🎁',min:8,
 goals:['Decir a quién se hace algo con -ri','Decir para quién con -(r)entzat','Usar diot, diozu, dio… (eman)'],
 steps:[
 {t:'-ri: «a quién»',h:'<p>Para decir <b>a quién</b> (el destinatario) se añade <b>-ri</b> al nombre: <b>ama → amari</b>. Con pronombres cambia:</p>',
  tb:'<table class="mini"><tr><th>Pronombre</th><th>A…</th></tr><tr><td>ni</td><td><b>niri</b> a mí</td></tr><tr><td>zu</td><td><b>zuri</b> a ti</td></tr><tr><td>hura</td><td><b>hari</b> a él / ella</td></tr><tr><td>gu</td><td><b>guri</b> a nosotros</td></tr><tr><td>zuek</td><td><b>zuei</b> a vosotros</td></tr><tr><td>haiek</td><td><b>haiei</b> a ellos</td></tr></table>',
  tip:'Con nombres propios: Dabid → <b>Dabiri</b>. En plural: amak → <b>amei</b>.'},
 {t:'-rentzat: «para quién»',h:'<p><b>-(r)entzat</b> = <b>para</b>. Si el nombre acaba en -a: <b>-rentzat</b> (amarentzat); si no, <b>-entzat</b>. Con pronombres: <b>niretzat</b>, <b>zuretzat</b>, <b>harentzat</b>…</p>',
  ex:[['Hau zuretzat da.','Esto es para ti.'],['Kafea amarentzat da.','El café es para mamá.'],['Opari bat niretzat?','¿Un regalo para mí?']]},
 {t:'eman: dar',h:'<p><b>eman</b> (dar) lleva tres cosas: quien da (nik), lo que se da (liburua) y a quién (amari). En el verbo aparece todo junto: <b>diot</b> = yo se lo doy (a él/ella).</p>',
  tb:'<table class="mini"><tr><th></th><th>(a él/ella)</th></tr><tr><td>nik</td><td><b>diot</b></td></tr><tr><td>zuk</td><td><b>diozu</b></td></tr><tr><td>hark</td><td><b>dio</b></td></tr><tr><td>guk</td><td><b>diogu</b></td></tr><tr><td>zuek</td><td><b>diozue</b></td></tr><tr><td>haiek</td><td><b>diote</b></td></tr></table>',
  ex:[['Nik amari liburua ematen diot.','Yo le doy el libro a mamá.'],['Nori eman diozu kafea?','¿A quién le has dado el café?'],['Zuk Dabiri ura ematen diozu.','Tú le das agua a David.']],
  tip:'Con varias cosas: <b>dizkiot, dizkiozu, dio→dizkio…</b> (liburuak ematen dizkiot).'}
 ],
 make:()=>[].concat(SQ0(['nik','amari','liburua','ematen','diot'],'Yo le doy el libro a mamá.','amari = a mamá; diot = yo se lo doy.'),SQ0(['kafea','amarentzat','da'],'El café es para mamá.','ama + rentzat = para mamá.'),conjQs(['eman'],3),vq('aditzak',3),[
  mc('-ri','«A mamá»','¿Cuál es?','amari',['amak','amarentzat','amaren'],'Destinatario: <b>-ri</b>.'),
  mc('-ri','«A mí»','¿Cuál es?','niri',['nik','nire','niretzat'],'<b>niri</b> = a mí.'),
  mc('-rentzat','«Para ti»','¿Cuál es?','zuretzat',['zuri','zuk','zure'],'<b>zuretzat</b> = para ti.'),
  mc('eman','«Yo se lo doy»','¿Cuál es?','diot',['dut','dio','diozu'],'<b>diot</b> = nik (yo) + a él/ella.'),
  mc('eman','«Tú se lo das»','¿Cuál es?','diozu',['diot','dio','duzu'],'<b>diozu</b> = zuk (tú).')
 ])},

{id:'b3',lv:'a2',n:1,eu:'Gustatzen zait / zaio',es:'Gustar con todas las personas',ic:'💚',min:8,
 goals:['Decir a quién le gusta algo: niri, zuri, hari, guri…','Distinguir zait / zaio… (una cosa) de zaizkit / zaizkio… (varias)','Hacer y contestar «¿Zer gustatzen zaizu?»'],
 steps:[
 {t:'A quién le gusta',h:'<p>En <b>gustatu</b> lo que gusta es el «sujeto» y a quién le gusta va en <b>-ri</b>. El verbo concuerda con <b>a quién</b>:</p>',
  tb:'<table class="mini"><tr><th>A quién</th><th>1 cosa</th><th>Varias</th></tr><tr><td>niri (a mí)</td><td><b>zait</b></td><td><b>zaizkit</b></td></tr><tr><td>zuri (a ti)</td><td><b>zaizu</b></td><td><b>zaizkizu</b></td></tr><tr><td>hari (a él/ella)</td><td><b>zaio</b></td><td><b>zaizkio</b></td></tr><tr><td>guri (a nosotros)</td><td><b>zaigu</b></td><td><b>zaizkigu</b></td></tr><tr><td>zuei (a vosotros)</td><td><b>zaizue</b></td><td><b>zaizkizue</b></td></tr><tr><td>haiei (a ellos)</td><td><b>zaie</b></td><td><b>zaizkie</b></td></tr></table>',
  tip:'Si gustan <b>varias</b> cosas aparece <b>-zki-</b>: zait → zaizkit.'},
 {t:'Frases',h:'<p>Orden: <b>a quién + lo que gusta + gustatzen + verbo</b>.</p>',
  ex:[['Amari kafea gustatzen zaio.','A mamá le gusta el café.'],['Guri mendia gustatzen zaigu.','A nosotros nos gusta el monte.'],['Niri sagarrak gustatzen zaizkit.','A mí me gustan las manzanas.'],['Zer gustatzen zaizu?','¿Qué te gusta?']]},
 {t:'No me gusta',h:'<p>Para negar, <b>ez</b> justo antes del auxiliar: <b>Niri ez zait kafea gustatzen</b>. Para preguntar: <b>Gustatzen al zaizu…?</b></p>',
  ex:[['Niri ez zait gustatzen.','A mí no me gusta.'],['Gustatzen al zaizu euskara?','¿Te gusta el euskera?'],['Bai, asko gustatzen zait.','Sí, me gusta mucho.']]}
 ],
 make:()=>[].concat(SQ0(['amari','kafea','gustatzen','zaio'],'A mamá le gusta el café.','zaio = le gusta (una cosa).'),SQ0(['guri','mendia','gustatzen','zaigu'],'A nosotros nos gusta el monte.','zaigu = nos gusta.'),conjQs(['gustatu'],4),[
  mc('Gustatu','«A ti te gusta el café»','¿Cuál es?','Zuri kafea gustatzen zaizu',['Zuri kafea gustatzen zait','Zuk kafea gustatzen duzu','Zuri kafea gustatzen zaio'],'<b>zuri</b> → <b>zaizu</b>.'),
  mc('Gustatu','«A mí me gustan las manzanas»','¿Cuál es?','Niri sagarrak gustatzen zaizkit',['Niri sagarrak gustatzen zait','Niri sagarrak gustatzen zaizkio','Nik sagarrak gustatzen dut'],'Varias cosas: <b>zaizkit</b>.'),
  mc('Gustatu','«A mamá le gusta…»','Elige la forma del verbo','zaio',['zait','zaie','zaigu'],'<b>Amari</b> (a él/ella) → <b>zaio</b>.'),
  mc('Gustatu','«A ellos les gusta»','Elige la forma del verbo','zaie',['zaio','zaigu','zaizu'],'<b>haiei</b> → <b>zaie</b>.'),
  mc('Gustatu','«¿Te gusta el euskera?»','¿Cuál es?','Gustatzen al zaizu euskara?',['Gustatzen al duzu euskara?','Gustatzen zaizu al euskara?','Al gustatzen zaizu euskara?'],'<b>al</b> justo antes del auxiliar.')
 ])},

{id:'b4',lv:'a1',n:17,eu:'Nahi, behar, ezin',es:'Querer, tener que y no poder',ic:'🚧',min:7,
 goals:['Usar nahi dut, behar dut y ezin dut con otro verbo','Colocar el auxiliar correctamente','Dar una excusa o decir lo que puedes hacer'],
 steps:[
 {t:'Tres verbos útiles',h:'<p>Los tres se usan con <b>otro verbo en infinitivo</b> (el participio) y el auxiliar <b>ukan</b>.</p>',
  tb:'<table class="mini"><tr><th>Euskera</th><th>Español</th></tr><tr><td><b>nahi dut</b></td><td>quiero</td></tr><tr><td><b>behar dut</b></td><td>tengo que / necesito</td></tr><tr><td><b>ezin dut</b></td><td>no puedo</td></tr></table>',

  tip:'<b>nahi / behar</b> van detrás del verbo; <b>ezin</b> va <b>delante</b> (ezin dut ikasi).'},
 {t:'Otras personas',h:'<p>Cambia el auxiliar como ya sabes: <b>duzu</b> (tú), <b>du</b> (él/ella), <b>dugu</b> (nosotros)…</p>',
  ex:[['Zuk kafea nahi duzu.','Tú quieres café.'],['Amak lan egin behar du.','Mamá tiene que trabajar.'],['Guk ezin dugu etorri.','Nosotros no podemos venir.']]},
 {t:'Preguntas y excusas',h:'<p>Con <b>al</b> preguntas y con <b>ezin</b> te excusas: <b>Etorri nahi al duzu?</b> — <b>Ezin dut, lan egin behar dut.</b></p>',

  mc('Ezin','«No puedo estudiar»','¿Cuál es?','Ezin dut ikasi',['Ikasi ezin naiz','Ez dut ikasi behar','Ikasi nahi ez dut'],'<b>ezin</b> va delante: ezin dut ikasi.'),
  mc('Behar','«Mamá tiene que trabajar»','Elige el auxiliar','du',['dut','duzu','dute'],'Hark (ella) → <b>du</b>.'),

 ],vq('aditzak',3))},
