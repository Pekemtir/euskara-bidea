  tip:'<b>ari</b> + auxiliar con <b>izan</b> siempre (nintzen, zen…), como en presente.'},
 {t:'Palabras de tiempo',h:'<p>Marcadores del pasado:</p>',
  tb:'<table class="mini"><tr><th>Euskera</th><th>Español</th></tr><tr><td><b>txikitan</b></td><td>de pequeño</td></tr><tr><td><b>gaztetan</b></td><td>de joven</td></tr><tr><td><b>atzo</b></td><td>ayer</td></tr><tr><td><b>iaz</b></td><td>el año pasado</td></tr><tr><td><b>orduan</b></td><td>entonces</td></tr></table>'}
 ],
 make:()=>[].concat(SQ0(['txikitan','mendira','joaten','nintzen'],'De pequeño iba al monte.','habitual + nintzen.'),SQ0(['ikasten','ari','nintzen'],'Estaba estudiando.','ari + nintzen.'),[
  mc('Iragana','«De pequeño comía pan»','¿Cuál es?','Txikitan ogia jaten nuen',['Txikitan ogia jaten dut','Txikitan ogia jan dut','Txikitan ogia jaten nintzen'],'habitual + <b>nuen</b>.'),
  mc('Ari','«Estaba leyendo»','¿Cuál es?','Irakurtzen ari nintzen',['Irakurri nuen','Irakurtzen ari naiz','Irakurtzen nuen ari'],'<b>ari nintzen</b>.'),
  mc('Iragana','«Nosotros íbamos» (hábito)','¿Cuál es?','joaten ginen',['joaten gara','joan genuen','joango ginen'],'<b>ginen</b> = gu en pasado (izan).'),
  mc('Denbora','«De pequeño»','¿Cuál es?','txikitan',['gaztetan','atzo','iaz'],'<b>txikitan</b>.'),
  mc('Denbora','«De joven»','¿Cuál es?','gaztetan',['txikitan','atzo','orain'],'<b>gaztetan</b>.')
 ])},

{id:'b11',lv:'a2',n:5,eu:'Maite zaitut',es:'«Te quiero», «me ve»: objeto de 1.ª y 2.ª persona',ic:'💛',min:9,
 goals:['Decir «te» y «me» con el auxiliar: zaitut, nauzu','Usar maite zaitut, ikusten zaitut','Reconocer gaitu / gaituzu (nos)'],
 steps:[
 {t:'Cuando el objeto soy yo, tú o nosotros',h:'<p>Hasta ahora el objeto era una cosa (dut, ditut). Cuando el objeto es una <b>persona</b> (me, te, nos) el auxiliar cambia entero. Estas son las formas más útiles:</p>',
  tb:'<table class="mini"><tr><th>Quién → a quién</th><th>Auxiliar</th></tr><tr><td>nik → zu</td><td><b>zaitut</b> (te)</td></tr><tr><td>hark → zu</td><td><b>zaitu</b></td></tr><tr><td>guk → zu</td><td><b>zaitugu</b></td></tr><tr><td>zuk → ni</td><td><b>nauzu</b> (me)</td></tr><tr><td>hark → ni</td><td><b>nau</b></td></tr><tr><td>haiek → ni</td><td><b>naute</b></td></tr><tr><td>hark → gu</td><td><b>gaitu</b> (nos)</td></tr><tr><td>zuk → gu</td><td><b>gaituzu</b></td></tr><tr><td>haiek → gu</td><td><b>gaituzte</b></td></tr></table>',
  tip:'No hace falta memorizar la tabla entera: empieza por <b>zaitut</b> (te … yo), <b>nauzu</b> (me … tú) y <b>nau</b> (me … él/ella).'},
 {t:'En frases',h:'<p>Se usan con verbos como <b>ikusi, maite izan, entzun, ezagutu</b>.</p>',
  ex:[['Maite zaitut.','Te quiero.'],['Ikusten zaitut.','Te veo.'],['Zuk ni ikusten nauzu.','Tú me ves.'],['Amak maite gaitu.','Mamá nos quiere.'],['Entzuten nauzu?','¿Me oyes?']]},
 {t:'Ojo con el orden',h:'<p>El auxiliar sigue al final y concuerda con <b>quién hace</b> y <b>a quién</b>: no se puede adivinar solo por el sujeto. Si dudas, fíjate en el objeto: <b>zu → zait-</b>, <b>ni → nau-</b>, <b>gu → gai-</b>.</p>'}
 ],
 make:()=>[].concat(SQ0(['maite','zaitut'],'Te quiero.','zaitut = yo a ti.'),SQ0(['zuk','ni','ikusten','nauzu'],'Tú me ves.','nauzu = tú a mí.'),[
  mc('Zaitut','«Te quiero»','¿Cuál es?','Maite zaitut',['Maite nauzu','Maite dut','Maite zait'],'Yo → ti: <b>zaitut</b>.'),
  mc('Nauzu','«Tú me ves»','¿Cuál es?','Ikusten nauzu',['Ikusten zaitut','Ikusten du','Ikusten gaitu'],'Tú → mí: <b>nauzu</b>.'),
  mc('Gaitu','«Mamá nos quiere»','Elige el auxiliar','gaitu',['gaitut','zaitu','nau'],'Hark → gu: <b>gaitu</b>.'),
  mc('Nau','«Él/ella me ve»','Elige el auxiliar','nau',['nauzu','zaitu','naute'],'Hark → ni: <b>nau</b>.'),
  mc('Zaitu','«Él/ella te ve»','Elige el auxiliar','zaitu',['zaitut','nauzu','gaitu'],'Hark → zu: <b>zaitu</b>.')
 ])},

{id:'b12',lv:'a1',n:24,eu:'Aginduak',es:'Órdenes, peticiones y prohibiciones',ic:'📣',min:7,
 goals:['Dar órdenes sencillas con el verbo suelto (Itxi atea!)','Usar zatoz, zoaz, zaude','Pedir con cortesía (ezazu) y prohibir (ez)'],
 steps:[
 {t:'El verbo suelto',h:'<p>La orden más sencilla es el <b>participio solo</b>: sin auxiliar ni pronombre.</p>',
  ex:[['Itxi atea!','¡Cierra la puerta!'],['Ireki leihoa!','¡Abre la ventana!'],['Etorri hona!','¡Ven aquí!'],['Entzun!','¡Escucha!']]},
 {t:'Zatoz, zoaz, zaude',h:'<p>Tres imperativos propios que usarás mucho:</p>',
  tb:'<table class="mini"><tr><th>A uno (zu)</th><th>A varios (zuek)</th><th></th></tr><tr><td><b>zatoz</b></td><td>zatozte</td><td>ven</td></tr><tr><td><b>zoaz</b></td><td>zoazte</td><td>ve</td></tr><tr><td><b>zaude</b></td><td>zaudete</td><td>quédate / espera</td></tr></table>',
  ex:[['Zatoz hona!','¡Ven aquí!'],['Zoaz etxera!','¡Vete a casa!'],['Zaude isilik!','¡Cállate! (estate quieto)']]},
 {t:'Cortesía y prohibición',h:'<p>Para pedir con educación: verbo + <b>ezazu</b> (a ti) / <b>ezazue</b> (a vosotros). Para prohibir: <b>ez</b> + verbo (o <b>ez ezazu</b> + verbo).</p>',
  ex:[['Ireki ezazu atea, mesedez.','Abre la puerta, por favor.'],['Itxi ezazue leihoa.','Cerrad la ventana.'],['Ez ireki atea!','¡No abras la puerta!'],['Ez ezazu ireki.','No la abras (educado).']]}
 ],
 make:()=>[].concat(SQ0(['zatoz','hona'],'Ven aquí.','zatoz = ven (etorri).'),SQ0(['ireki','ezazu','atea'],'Abre la puerta.','verbo + ezazu = petición educada.'),[
  mc('Agindua','«¡Cierra la puerta!»','¿Cuál es?','Itxi atea!',['Itxi dut atea','Ixten atea','Atea itxi naiz'],'Orden simple: <b>participio solo</b>.'),
  mc('Agindua','«Ven aquí»','¿Cuál es?','Zatoz hona',['Zatoz horra','Etorri naiz hona','Dator hona'],'<b>zatoz</b> = ven.'),
  mc('Agindua','«Vete a casa»','¿Cuál es?','Zoaz etxera',['Zatoz etxera','Zaude etxera','Noa etxera'],'<b>zoaz</b> = ve.'),
  mc('Agindua','«Espera aquí»','¿Cuál es?','Zaude hemen',['Zoaz hemen','Zatoz hemen','Zaudete hemen'],'<b>zaude</b> = quédate, espera.'),
  mc('Agindua','«No abras»','¿Cuál es?','Ez ireki!',['Ireki ez!','Ez irekia!','Ireki ezin!'],'<b>ez</b> + verbo.')
 ])},

{id:'b13',lv:'a2',n:6,eu:'Dezaket eta naiteke',es:'Poder: puedo hacer, puedo ir',ic:'💪',min:8,
 goals:['Formar el potencial: dezaket (con objeto), naiteke (sin objeto)','Pedir permiso: Sar naiteke?','Distinguir ezin dut de dezaket'],
 steps:[
 {t:'Dos tablas de «poder»',h:'<p>Para <b>poder</b> hay formas propias. Se usa el participio y la forma que corresponde al tipo de verbo:</p>',
  tb:'<table class="mini"><tr><th></th><th>con objeto<br>(ukan)</th><th>sin objeto<br>(izan)</th></tr><tr><td>ni</td><td><b>dezaket</b></td><td><b>naiteke</b></td></tr><tr><td>zu</td><td><b>dezakezu</b></td><td><b>zaitezke</b></td></tr><tr><td>hura</td><td><b>dezake</b></td><td><b>daiteke</b></td></tr><tr><td>gu</td><td><b>dezakegu</b></td><td><b>gaitezke</b></td></tr><tr><td>zuek</td><td><b>dezakezue</b></td><td><b>zaitezkete</b></td></tr><tr><td>haiek</td><td><b>dezakete</b></td><td><b>daitezke</b></td></tr></table>',
  tip:'<b>Euskaraz hitz egin dezaket</b> (hablar lleva objeto) · <b>Etor naiteke</b> (venir no lo lleva).'},
 {t:'Preguntar si puedes',h:'<p>Mismas formas en pregunta, con <b>al</b> si quieres: <b>Sar naiteke?</b> (¿puedo pasar?), <b>Hitz egin dezaket?</b></p>',
  ex:[['Sar naiteke?','¿Puedo pasar?'],['Euskaraz hitz egin dezaket.','Puedo hablar en euskera.'],['Bihar etor naiteke.','Mañana puedo venir.'],['Telefonoa erabil dezaket?','¿Puedo usar el teléfono?']]},
 {t:'Dezaket o ezin dut',h:'<p>La negación es <b>ezin</b> + el auxiliar normal: <b>Ezin dut etorri</b> (no puedo venir). El potencial se usa sobre todo en afirmativo y para pedir permiso.</p>'}
 ],
 make:()=>[].concat(conjQs(['ahal (dezaket)','ahal (naiteke)'],5),SQ0(['euskaraz','hitz','egin','dezaket'],'Puedo hablar en euskera.','objeto → dezaket.'),[
  mc('Potentziala','«Puedo venir» (etorri)','¿Cuál es?','Etor naiteke',['Etor dezaket','Etorri dut','Etor nahi dut'],'etorri no lleva objeto → <b>naiteke</b>.'),
  mc('Potentziala','«Puedo leer el libro»','¿Cuál es?','Liburua irakur dezaket',['Liburua irakur naiteke','Liburua irakurri dut','Liburua irakurtzen naiz'],'irakurri lleva objeto → <b>dezaket</b>.'),
  mc('Baimena','«¿Puedo pasar?»','¿Cuál es?','Sar naiteke?',['Sar dezaket?','Sartu al dut?','Sar naiz?'],'<b>naiteke</b>.')
 ])},

{id:'b14',lv:'a1',n:23,eu:'Norekin? Zertaz?',es:'Con quién, en qué (transporte), hasta, hacia',ic:'🚆',min:8,
 goals:['Decir «con» con -rekin: amarekin, nirekin','Decir el medio con -z: autobusez, oinez','Usar -raino (hasta) y -rantz (hacia)'],
 steps:[
 {t:'-rekin: «con»',h:'<p>Para <b>con alguien</b> se añade <b>-rekin</b> (o <b>-ekin</b> si acaba en consonante). Con pronombres:</p>',
  tb:'<table class="mini"><tr><th>Pronombre</th><th>Con…</th></tr><tr><td>ni</td><td><b>nirekin</b></td></tr><tr><td>zu</td><td><b>zurekin</b></td></tr><tr><td>hura</td><td><b>harekin</b></td></tr><tr><td>gu</td><td><b>gurekin</b></td></tr><tr><td>zuek</td><td><b>zuekin</b></td></tr><tr><td>haiek</td><td><b>haiekin</b></td></tr></table>',
  ex:[['Amarekin mendira joaten naiz.','Voy al monte con mamá.'],['Norekin bizi zara?','¿Con quién vives?'],['Nirekin zatoz?','¿Vienes conmigo?']]},
 {t:'-z: el medio',h:'<p><b>-z</b> dice <b>cómo</b> o <b>en qué</b>: autobusez (en autobús), trenez, autoz, oinez (a pie), euskaraz (en euskera).</p>',
  ex:[['Autobusez etorri naiz.','He venido en autobús.'],['Oinez joaten naiz lanera.','Voy al trabajo a pie.'],['Trenez joaten naiz.','Voy en tren.']]},
 {t:'-raino y -rantz',h:'<p><b>-raino</b> = hasta (el punto final): <b>Iruñeraino</b>. <b>-rantz</b> = en dirección a: <b>mendirantz</b>.</p>',
  ex:[['Iruñeraino autobusez noa.','Voy hasta Pamplona en autobús.'],['Etxerantz noa.','Voy hacia casa.']]}
 ],
 make:()=>[].concat(SQ0(['amarekin','mendira','joaten','naiz'],'Voy al monte con mamá.','-rekin = con.'),SQ0(['autobusez','etorri','naiz'],'He venido en autobús.','-z = en (medio).'),vq('garraioak',3),[
  mc('-rekin','«Conmigo»','¿Cuál es?','nirekin',['niretzat','niri','nirea'],'<b>nirekin</b> = conmigo.'),
  mc('-rekin','«Con mamá»','¿Cuál es?','amarekin',['amari','amarentzat','amaz'],'<b>-rekin</b> = con.'),
  mc('-z','«A pie»','¿Cuál es?','oinez',['oinean','oinetan','oinera'],'<b>oinez</b> = a pie.'),
  mc('-z','«En tren»','¿Cuál es?','trenez',['trenean','trenera','trenarekin'],'<b>-z</b> para el medio de transporte.'),
  mc('-raino','«Hasta Pamplona»','¿Cuál es?','Iruñeraino',['Iruñean','Iruñetik','Iruñarekin'],'<b>-raino</b> = hasta.')
 ])},

{id:'b15',lv:'a2',n:7,eu:'Esan du…',es:'Contar lo que otros dicen y preguntas indirectas',ic:'💬',min:9,
 goals:['Contar lo que alguien dice con -ela (que)','Hacer preguntas indirectas con -n','Responder baietz / ezetz'],
 steps:[
 {t:'-ela: «que»',h:'<p>Para decir <b>que</b> + algo, al auxiliar se le añade <b>-(e)la</b>: <b>dela, duela, dudala, naizela, dagoela</b>. Se usa tras <b>esan</b> (decir), <b>pentsatu</b> (pensar), <b>uste izan</b> (creer).</p>',
  tb:'<table class="mini"><tr><th>Auxiliar</th><th>Que…</th></tr><tr><td>da</td><td><b>dela</b></td></tr><tr><td>dago</td><td><b>dagoela</b></td></tr><tr><td>naiz</td><td><b>naizela</b></td></tr><tr><td>du</td><td><b>duela</b></td></tr><tr><td>dut</td><td><b>dudala</b></td></tr></table>',
  ex:[['Amak esan du etorriko dela.','Mamá ha dicho que vendrá.'],['Esan dut ondo nagoela.','He dicho que estoy bien.'],['Uste dut euskara polita dela.','Creo que el euskera es bonito.']]},
 {t:'Preguntas indirectas',h:'<p>Dentro de otra frase, la pregunta lleva <b>-n</b> en el auxiliar: <b>non dagoen</b> (dónde está), <b>zer den</b> (qué es), <b>zer duzun</b> (qué tienes).</p>',
  ex:[['Badakizu non dagoen udaletxea?','¿Sabes dónde está el ayuntamiento?'],['Ez dakit zer den.','No sé qué es.'],['Galdetu dut noiz etorriko den.','He preguntado cuándo vendrá.']]},
 {t:'Baietz eta ezetz',h:'<p>Para contar un «sí» o un «no» ajeno: <b>baietz esan du</b> (dijo que sí), <b>ezetz esan du</b> (dijo que no).</p>',
  ex:[['Baietz esan du.','Ha dicho que sí.'],['Ezetz esan dut.','He dicho que no.']]}
 ],
 make:()=>[].concat(SQ0(['esan','du','etorriko','dela'],'Ha dicho que vendrá.','da + ela = dela.'),[
  mc('-ela','«Dice que está en casa» (dago)','¿Cuál es?','Etxean dagoela esaten du',['Etxean dagoen esaten du','Etxean dago esaten du','Etxean dagoela da'],'dago + <b>ela</b>.'),
  mc('-ela','«Creo que es bonito» (da)','¿Cuál es?','Polita dela uste dut',['Polita dena uste dut','Polita da uste dut','Polita delako uste dut'],'da + <b>ela</b> = dela.'),
  mc('-ela','«He dicho que tengo» (dut)','Elige la forma','dudala',['duela','dutela','dudan'],'dut + <b>ala</b> = dudala.'),
  mc('Galdera','«¿Sabes dónde está?»','¿Cuál es?','Badakizu non dagoen?',['Badakizu non dago?','Badakizu non dagoela?','Badakizu non da?'],'Pregunta indirecta: <b>-n</b>: dagoen.'),
  mc('Baietz','«Ha dicho que sí»','¿Cuál es?','Baietz esan du',['Bai esan du','Ezetz esan du','Baina esan du'],'<b>baietz</b> = que sí.')
 ])},

{id:'b16',lv:'a1',n:26,eu:'Baldin eta…',es:'«Si», «cuando», «antes de» y «después de»',ic:'🔀',min:9,
 goals:['Formar el condicional real con ba- (si…)','Decir «cuando» con -(e)nean','Usar baino lehen y eta gero'],
 steps:[
 {t:'Ba-: «si»',h:'<p>Para <b>si</b> + algo real, se pone <b>ba-</b> delante del auxiliar: <b>badut, baduzu, badu, bazara, badago</b>.</p>',
  tb:'<table class="mini"><tr><th>Auxiliar</th><th>Si…</th></tr><tr><td>dut</td><td><b>badut</b></td></tr><tr><td>duzu</td><td><b>baduzu</b></td></tr><tr><td>da</td><td><b>bada</b></td></tr><tr><td>zara</td><td><b>bazara</b></td></tr><tr><td>dago</td><td><b>badago</b></td></tr></table>',
  ex:[['Nahi baduzu, etorri.','Si quieres, ven.'],['Euria egiten badu, etxean geratuko naiz.','Si llueve, me quedaré en casa.'],['Etortzen bazara, esan.','Si vienes, dímelo.']]},
 {t:'-(e)nean: «cuando»',h:'<p>Para <b>cuando</b>, al auxiliar se le añade <b>-(e)nean</b>: <b>naizenean, zarenean, denean, dudanean, duzunean</b>.</p>',
  ex:[['Etxera heltzen naizenean, afaltzen dut.','Cuando llego a casa, ceno.'],['Gaixorik zarenean, medikuarenera joan.','Cuando estés enfermo, ve al médico.']]},
 {t:'Antes y después',h:'<p><b>baino lehen</b> = antes de · <b>eta gero</b> = y después. Sirven para ordenar acciones.</p>',
  ex:[['Afaldu baino lehen dutxatzen naiz.','Me ducho antes de cenar.'],['Jan eta gero, kafea hartzen dut.','Después de comer, tomo café.']]}
 ],
 make:()=>[].concat(SQ0(['nahi','baduzu','etorri'],'Si quieres, ven.','ba- + duzu = baduzu.'),[
  mc('Ba-','«Si tienes» (duzu)','¿Cuál es?','baduzu',['duzula','duzunean','duzu ba'],'<b>ba-</b> + duzu.'),
  mc('Ba-','«Si vienes» (zara, etortzen)','¿Cuál es?','etortzen bazara',['etortzen zarenean','etortzen zarela','etortzen baino lehen'],'<b>ba-</b> = si.'),
  mc('-nean','«Cuando llego» (naiz)','¿Cuál es?','heltzen naizenean',['heltzen bazara','heltzen naizela','heltzen eta gero'],'naiz + <b>enean</b> = naizenean.'),
  mc('Denbora','«Antes de cenar»','¿Cuál es?','Afaldu baino lehen',['Afaldu eta gero','Afaldu orduan','Afaltzean baino'],'<b>baino lehen</b> = antes de.'),
  mc('Denbora','«Después de comer»','¿Cuál es?','Jan eta gero',['Jan baino lehen','Jan bada','Jan duela'],'<b>eta gero</b> = después de.')
 ])},

{id:'b17',lv:'a1',n:16,eu:'Eguraldia',es:'El tiempo atmosférico',ic:'🌦️',min:6,
 goals:['Decir qué tiempo hace','Usar ari du (llueve, nieva)','Comparar el tiempo en cada estación'],
 steps:[
 {t:'Qué tiempo hace',h:'<p>Pregunta: <b>Zer eguraldi dago?</b> (¿qué tiempo hace?). Hay dos estructuras muy útiles:</p>',
  tb:'<table class="mini"><tr><th>Estructura</th><th>Ejemplo</th></tr><tr><td><b>… ari du</b></td><td>Euria ari du (llueve)</td></tr><tr><td><b>… egiten du</b></td><td>Hotz egiten du (hace frío)</td></tr><tr><td><b>… dago</b></td><td>Eguzkia dago (hace sol)</td></tr></table>',
  ex:[['Euria ari du.','Está lloviendo.'],['Elurra ari du.','Está nevando.'],['Gaur hotz egiten du.','Hoy hace frío.'],['Udan bero egiten du.','En verano hace calor.'],['Hodei asko daude.','Hay muchas nubes.']]},
 {t:'Eguraldia Baztanen',h:'<p>En Baztan llueve mucho: <b>Baztanen euria egiten du askotan</b> (en Baztan llueve a menudo). Puedes combinar con las estaciones que ya sabes: <b>Neguan elurra egiten du</b>.</p>'}
 ],
 make:()=>[].concat(SQ0(['euria','ari','du'],'Está lloviendo.','ari du = está (haciendo).'),SQ0(['gaur','hotz','egiten','du'],'Hoy hace frío.','hotz egiten du = hace frío.'),vq('eguraldia',5),[
  mc('Eguraldia','«Está nevando»','¿Cuál es?','Elurra ari du',['Euria ari du','Elurra da','Elurra dago ari'],'<b>ari du</b>.'),
  mc('Eguraldia','«¿Qué tiempo hace?»','¿Cuál es?','Zer eguraldi dago?',['Zer eguraldi naiz?','Nolako eguraldi du?','Zer ari du?'],'<b>Zer eguraldi dago?</b>'),
  mc('Eguraldia','«En verano hace calor»','¿Cuál es?','Udan bero egiten du',['Uda bero egiten da','Udan beroa naiz','Udan egin bero du'],'<b>bero egiten du</b>.')
 ])},

{id:'b18',lv:'a1',n:27,eu:'Erosketak',es:'Comprar y preguntar precios',ic:'🛍️',min:7,
 goals:['Preguntar precios con Zenbat balio du?','Pedir, elegir y pagar','Usar ordaindu dezaket y -arekin'],
 steps:[
 {t:'En la tienda',h:'<p>Frases que necesitas:</p>',
  ex:[['Barkatu, zenbat balio du honek?','Perdona, ¿cuánto cuesta esto?'],['Zenbat balio dute sagarrek?','¿Cuánto cuestan las manzanas?'],['Hau nahi dut.','Quiero esto.'],['Besterik nahi duzu?','¿Quiere algo más?'],['Ez, besterik ez.','No, nada más.']],
  tip:'<b>balio du</b> (singular) / <b>balio dute</b> (plural) = cuesta / cuestan.'},
 {t:'Pagar',h:'<p>Con <b>-arekin</b> dices con qué: <b>txartelarekin</b>, <b>diruarekin</b>. Y <b>dezaket</b> para preguntar si se puede.</p>',

{id:'c2',lv:'a1',n:21,eu:'Zerbait, ezer, inor',es:'Algo, nada, alguien, nadie, sin',ic:'❔',min:8,

 steps:[
 {t:'Algo y alguien',h:'<p>Para <b>algo</b> y <b>alguien</b> en frases afirmativas y preguntas:</p>',
  tb:'<table class="mini"><tr><th>Euskera</th><th>Español</th></tr><tr><td><b>zerbait</b></td><td>algo</td></tr><tr><td><b>norbait</b></td><td>alguien</td></tr><tr><td><b>nonbait</b></td><td>en algún sitio</td></tr></table>',

  tb:'<table class="mini"><tr><th>Negativo</th><th>Ejemplo</th></tr><tr><td><b>ez … ezer</b></td><td>Ez dut ezer ikusten.</td></tr><tr><td><b>ez … inor</b></td><td>Ez dago inor.</td></tr><tr><td><b>ez … inon</b></td><td>Ez dago inon.</td></tr><tr><td><b>ezer ez</b></td><td>— Zer duzu? — Ezer ez.</td></tr><tr><td><b>inor ez</b></td><td>— Nor dago? — Inor ez.</td></tr></table>',

  ex:[['Ez dut dirurik.','No tengo dinero (nada de).'],['Ez dago esnerik.','No hay leche.'],['Kafea esnerik gabe nahi dut.','Quiero el café sin leche.']]}
 ],

  tb:mt(['Sufijo','Sentido','Ejemplo'],[['<b>-egi</b>','demasiado','handi → <b>handiegia</b> (demasiado grande)'],['<b>-tsu</b>','lleno de, -oso','euri → <b>euritsua</b> (lluvioso)'],['<b>-dun</b>','que tiene','bizar → <b>bizardun</b> (con barba)'],['<b>-gabe</b>','sin','etxe → <b>etxegabea</b> (sin casa)'],['<b>-txo</b>','pequeño, cariñoso','etxe → <b>etxetxoa</b> (casita)']]),
  ex:[['Soineko hau handiegia da.','Este vestido es demasiado grande.'],['Eguraldi euritsua dago.','Hace un tiempo lluvioso.'],['Bizardun gizon bat ikusi dut.','He visto a un hombre con barba.'],['Etxetxo bat dute.','Tienen una casita.']]}
 ],
 make:()=>[].concat([
  mc('Atzizkia','«Demasiado grande»','¿Cuál es?','handiegia',['handitsua','handidun','handixoa'],'<b>-egi</b> = demasiado.'),
  mc('Atzizkia','«Lluvioso»','¿Cuál es?','euritsua',['euriegia','euridun','euritxoa'],'<b>-tsu</b> = lleno de.'),
  mc('Atzizkia','«Con barba»','¿Cuál es?','bizardun',['bizartsu','bizaregi','bizargabe'],'<b>-dun</b> = que tiene.'),
  mc('Atzizkia','«Casita»','¿Cuál es?','etxetxoa',['etxegia','etxedun','etxetsua'],'<b>-txo</b>.')
 ],SQ0(['soineko','hau','handiegia','da'],'Este vestido es demasiado grande.','handi + egi + a.'),SQ0(['eguraldi','euritsua','dago'],'Hace un tiempo lluvioso.','euri + tsu.'),SQ0(['bizardun','gizon','bat','ikusi','dut'],'He visto a un hombre con barba.','bizar + dun.'))},

{id:'e6',lv:'a2',n:15,eu:'Irekita dago',es:'Estados: abierto, cerrado, cansado',ic:'🚪',min:7,
 goals:['Formar el estado resultante con participio + -ta','Distinguir «he abierto» de «está abierto»','Usar prest, esna, irekita, itxita, nekatuta'],
 steps:[
 {t:'Participio + -ta dago',h:'<p>Para decir cómo <b>está</b> algo después de una acción: participio + <b>-ta</b> + <b>dago / daude</b> (o <b>nago</b>…).</p>',
  tb:mt(['Acción','Resultado'],[['Atea ireki dut. (<i>he abierto</i>)','Atea <b>irekita dago</b>. (<i>está abierta</i>)'],['Denda itxi dute.','Denda <b>itxita dago</b>.'],['Nekatu naiz.','<b>Nekatuta nago</b>.'],['Bazkaria prestatu dut.','Bazkaria <b>prest dago</b>.']]),
  ex:[['Atea irekita dago.','La puerta está abierta.'],['Leihoak irekita daude.','Las ventanas están abiertas.'],['Denda itxita dago.','La tienda está cerrada.'],['Gaur nekatuta nago.','Hoy estoy cansado.']],
  tip:'El plural no cambia la forma -ta, solo el verbo: <b>daude</b>.'}
 ],
 make:()=>[].concat([
  mc('Egoera','«La puerta está abierta»','¿Cuál es?','Atea irekita dago',['Atea ireki dut','Atea irekitzen da','Atea irekiko du'],'Estado: <b>irekita dago</b>.'),
  mc('Egoera','«La tienda está cerrada»','¿Cuál es?','Denda itxita dago',['Denda itxi dut','Denda ixten da','Denda itxiko dut'],'<b>itxita dago</b>.'),
  mc('Egoera','«Las ventanas están abiertas»','¿Cuál es?','Leihoak irekita daude',['Leihoak irekita dago','Leihoak ireki dut','Leihoak irekitzen dira'],'Plural → <b>daude</b>.')
 ],SQ0(['atea','irekita','dago'],'La puerta está abierta.','irekita dago.'),SQ0(['denda','itxita','dago'],'La tienda está cerrada.','itxita dago.'),SQ0(['atea','ireki','dut'],'He abierto la puerta.','acción: ireki dut.'),SQ0(['bazkaria','prest','dago'],'La comida está lista.','prest dago.'),SQ0(['gaur','nekatuta','nago'],'Hoy estoy cansado.','nekatuta nago.'))},

{id:'e7',lv:'a2',n:16,eu:'Norbait deskribatu',es:'Aspecto y carácter de una persona',ic:'🧑',min:8,
 goals:['Describir pelo, ojos y estatura con izan y ukan','Preguntar zer itxura du? y nolakoa da?','Decir a quién te pareces: antza du'],
 steps:[
 {t:'Izan o ukan',h:'<p>Con adjetivos de la persona se usa <b>izan</b> (<i>altua da</i>). Con partes del cuerpo se usa <b>ukan</b> (<i>ile beltza du</i>, <i>begi urdinak ditu</i>: plural → <b>ditu</b>).</p>',
  ex:[['Altua eta mehea da.','Es alto y delgado.'],['Ile beltza dut.','Tengo el pelo negro.'],['Begi urdinak ditu.','Tiene los ojos azules.'],['Nire aitari antza dut.','Me parezco a mi padre.']]},
 {t:'Preguntar',h:'<p><b>Zer itxura du?</b> = ¿qué aspecto tiene? <b>Nolakoa da?</b> = ¿cómo es (de carácter)?</p>',
  ex:[['Zer itxura du zure anaiak?','¿Qué aspecto tiene tu hermano?'],['Nolakoa da zure ama?','¿Cómo es tu madre?'],['Jatorra eta alaia da.','Es simpática y alegre.']]}
 ],
 make:()=>[].concat([
  mc('Deskribapena','«Tiene el pelo largo»','¿Cuál es?','Ile luzea du',['Ile luzea da','Ile luzea dago','Ile luzea dira'],'Parte del cuerpo → <b>ukan</b>: du.'),
  mc('Deskribapena','«Tiene los ojos azules»','¿Cuál es?','Begi urdinak ditu',['Begi urdinak du','Begi urdinak da','Begi urdinak dira'],'Plural → <b>ditu</b>.'),
  mc('Deskribapena','«¿Cómo es?» (carácter)','¿Cuál es?','Nolakoa da?',['Zer itxura du?','Non dago?','Zer du?'],'<b>Nolakoa da?</b>')
 ],SQ0(['ile','beltza','dut'],'Tengo el pelo negro.','ile beltza + dut.'),SQ0(['begi','urdinak','ditu'],'Tiene los ojos azules.','plural: ditu.'),SQ0(['zer','itxura','du'],'¿Qué aspecto tiene?','zer itxura du.'),SQ0(['nolakoa','da','zure','ama'],'¿Cómo es tu madre?','nolakoa da.'),vq('itxura',3))},

{id:'e8',lv:'a2',n:17,eu:'Telefonoz eta mezuetan',es:'Llamar, pedir cita y escribir un mensaje',ic:'📞',min:8,

  tb:mt(['Euskera','Español'],[['<b>Hitzordu bat eskatu nahi nuke.</b>','Querría pedir una cita.'],['<b>Noiz etor naiteke?</b>','¿Cuándo puedo venir?'],['<b>Kaixo, …</b> / <b>Egun on, …</b>','Hola, … / Buenos días, …'],['<b>Eskerrik asko aldez aurretik.</b>','Gracias de antemano.'],['<b>Agur bero bat</b> / <b>Laster arte</b>','Un saludo / Hasta pronto']])}
 ],
 make:()=>[].concat([
  mc('Telefonoa','«Querría hablar con Jon»','¿Cuál es?','Jonekin hitz egin nahi nuke',['Jonekin hitz egin nahi dut','Jonekin hitz egingo dut','Jon hitz egin nahi nuke'],'<b>nahi nuke</b> = querría (cortés).'),
  mc('Telefonoa','«Te volveré a llamar»','¿Cuál es?','Berriro deituko dizut',['Berriro deitu dut','Berriro deitzen naiz','Berriro deituko naiz'],'<b>deituko dizut</b>.'),
  mc('Mezua','«Gracias de antemano»','¿Cuál es?','Eskerrik asko aldez aurretik',['Eskerrik asko atzo','Mila esker bihar','Agur aldez aurretik'],'<b>aldez aurretik</b> = de antemano.')
 ],SQ0(['jonekin','hitz','egin','nahi','nuke'],'Querría hablar con Jon.','nahi nuke = querría.'),SQ0(['berriro','deituko','dizut'],'Te volveré a llamar.','deituko dizut.'),SQ0(['itxaron','pixka','bat','mesedez'],'Espere un poco, por favor.','itxaron pixka bat.'),SQ0(['hitzordu','bat','eskatu','nahi','nuke'],'Querría pedir una cita.','hitzordu = cita.'),SQ0(['ez','dut','ondo','entzuten'],'No oigo bien.','entzuten dut.'))},

{id:'e9',lv:'a2',n:18,eu:'Duela… Joan den…',es:'Contar el pasado: hace años, la semana pasada, alguna vez',ic:'🧳',min:9,
 goals:['Situar hechos en el pasado: duela, joan den, iaz','Preguntar inoiz…? y contestar behin, bitan, inoiz ez','Contar un viaje con nintzen y nuen'],
 steps:[
 {t:'Cuándo pasó',h:'<p>Expresiones de tiempo pasado:</p>',
  tb:mt(['Euskera','Español'],[['<b>atzo</b> / <b>herenegun</b>','ayer / anteayer'],['<b>joan den astean</b>','la semana pasada'],['<b>joan den hilean</b>','el mes pasado'],['<b>iaz</b> / <b>joan den urtean</b>','el año pasado'],['<b>duela bi urte</b>','hace dos años'],['<b>duela hilabete bat</b>','hace un mes']]),
  ex:[['Joan den astean Bilbora joan nintzen.','La semana pasada fui a Bilbao.'],['Duela bi urte Italian egon nintzen.','Hace dos años estuve en Italia.'],['Iaz euskaltegian hasi nintzen.','El año pasado empecé en el euskaltegi.']]},
 {t:'Experiencias',h:'<p><b>Inoiz egon al zara…?</b> = ¿has estado alguna vez…? Contesta con <b>behin</b> (una vez), <b>bitan</b> / <b>bi aldiz</b> (dos veces) o <b>inoiz ez</b> (nunca).</p>',
  ex:[['Inoiz egon al zara Donostian?','¿Has estado alguna vez en San Sebastián?'],['Bai, behin izan nintzen.','Sí, estuve una vez.'],['Ez naiz inoiz Londresen egon.','Nunca he estado en Londres.']]}
 ],
 make:()=>[].concat([
  mc('Denbora','«Hace dos años»','¿Cuál es?','duela bi urte',['bi urte barru','iaz bi urte','datorren bi urte'],'<b>duela</b> + tiempo = hace.'),
  mc('Denbora','«La semana pasada»','¿Cuál es?','joan den astean',['datorren astean','aste honetan','duela astea'],'<b>joan den</b> = pasado.'),
  mc('Esperientzia','«Nunca he estado»','¿Cuál es?','Ez naiz inoiz egon',['Behin egon naiz','Bitan egon naiz','Dagoeneko egon naiz'],'<b>inoiz ez</b> = nunca.'),
  mc('Esperientzia','«Dos veces»','¿Cuál es?','bitan',['behin','inoiz','beti'],'<b>bitan</b> / <b>bi aldiz</b>.')
 ],SQ0(['joan','den','astean','Bilbora','joan','nintzen'],'La semana pasada fui a Bilbao.','joan den astean + nintzen.'),SQ0(['duela','bi','urte','Italian','egon','nintzen'],'Hace dos años estuve en Italia.','duela + tiempo.'),SQ0(['inoiz','egon','al','zara','Donostian'],'¿Has estado alguna vez en San Sebastián?','inoiz ... al zara.'),SQ0(['behin','Parisen','izan','nintzen'],'Estuve una vez en París.','behin = una vez.'),SQ0(['ez','naiz','inoiz','Londresen','egon'],'Nunca he estado en Londres.','ez ... inoiz.'),vq('denborak',2))},

 ],SQ0(['mahai','bat','erreserbatu','nahi','nuke'],'Querría reservar una mesa.','nahi nuke = querría.'),SQ0(['zer','gomendatzen','duzu'],'¿Qué recomienda?','gomendatu.'),SQ0(['kontua','mesedez'],'La cuenta, por favor.','kontua = la cuenta.'),SQ0(['gela','bikoitza','nahi','nuke'],'Querría una habitación doble.','gela bikoitza.'),SQ0(['zenbat','balio','du','gau','batek'],'¿Cuánto cuesta una noche?','gau batek: -k por ser sujeto.'),vq('jatetxea',3))},

{id:'e11',lv:'a2',n:20,eu:'Plurala eta kasuak',es:'-ek, -ei, -en, -ekin: los casos en plural',ic:'👥',min:8,
 goals:['Formar sujeto plural con -ek','Usar -ei (a quiénes), -en (de quiénes) y -ekin (con)','Distinguir singular y plural'],
 steps:[
 {t:'Los casos en plural',h:'<p>El plural de los casos se forma sobre el plural <b>-ak</b>, quitando la -a final y añadiendo la terminación. Ejemplo con <b>haur</b> (niño):</p>',
  tb:mt(['Caso','Singular','Plural'],[['sujeto (-k)','haurrak','<b>haurrek</b>'],['a quién (-ri)','haurrari','<b>haurrei</b>'],['de quién (-ren)','haurraren','<b>haurren</b>'],['para (-rentzat)','haurrarentzat','<b>haurrentzat</b>'],['con (-rekin)','haurrarekin','<b>haurrekin</b>']]),
  ex:[['Ikasleek euskara ikasten dute.','Los alumnos aprenden euskera.'],['Haurrei txokolatea gustatzen zaie.','A los niños les gusta el chocolate.'],['Ikasleen liburuak mahaian daude.','Los libros de los alumnos están en la mesa.'],['Lagunekin afaltzen dut.','Ceno con los amigos.']]}
 ],

  mc('Plurala','«A los niños»','¿Cuál es?','haurrei',['haurrek','haurren','haurrekin'],'<b>-ei</b> = a los…'),
  mc('Plurala','«De los alumnos»','¿Cuál es?','ikasleen',['ikasleek','ikasleei','ikasleak'],'<b>-en</b> = de los…'),
  mc('Plurala','«Con los amigos»','¿Cuál es?','lagunekin',['lagunarekin','lagunei','lagunak'],'<b>-ekin</b> = con los…')
 ],SQ0(['haurrei','txokolatea','gustatzen','zaie'],'A los niños les gusta el chocolate.','haurrei + zaie.'),SQ0(['ikasleek','euskara','ikasten','dute'],'Los alumnos aprenden euskera.','ikasleek: sujeto plural.'),SQ0(['ikasleen','liburuak','mahaian','daude'],'Los libros de los alumnos están en la mesa.','ikasleen = de los alumnos.'),SQ0(['lagunekin','afaltzen','dut'],'Ceno con los amigos.','lagunekin.'))},

  tip:'Con varias cosas: <b>dakartzat</b>, <b>daramatzat</b> (ni); <b>dakartza</b>, <b>daramatza</b> (hura).'}
 ],

 ],SQ0(['nik','ogia','dakart'],'Yo traigo el pan.','dakart.'),SQ0(['zuk','zer','daramazu'],'¿Qué llevas?','daramazu.'),SQ0(['mutilak','kafea','dakar'],'El chico trae el café.','dakar.'),conjQs(['ekarri','eraman'],4))}
);

<script>
/* ===== Niri buruz: cuestionario personal y preguntas con tus datos ===== */

const NW=['','bat','bi','hiru','lau','bost','sei','zazpi','zortzi','bederatzi','hamar','hamaika','hamabi','hamahiru','hamalau','hamabost','hamasei','hamazazpi','hemezortzi','hemeretzi'];
const NB=['','','hogei','','berrogei','','hirurogei','','laurogei'];
function numEu(n){
  if(n<20)return NW[n];
  const q=Math.floor(n/20),r=n%20,b=NB[q*2];
  return r?b+'ta '+NW[r]:b;
}
const dayEu=d=>String(d)+([1,5,10,15,21,25,30].includes(d)?'ean':[11,31].includes(d)?'n':'an');
const inePl=p=>{const c=p.slice(-1).toLowerCase();return p+('aeiou'.includes(c)?'n':'en')};
const fromPl=p=>{const l=p.toLowerCase();if(l.endsWith('ea'))return p.slice(0,-1)+'koa';const c=l.slice(-1);return p+('aeiou'.includes(c)?'koa':'ekoa')};
function meAge(m){
  if(!m||!m.y||!m.m||!m.d)return null;
  const t=new Date();let a=t.getFullYear()-m.y;
  if(t.getMonth()+1<m.m||(t.getMonth()+1===m.m&&t.getDate()<m.d))a--;
  return a;
}
const meBirthdayToday=()=>{const m=S.me,t=new Date();return !!(m&&m.d&&m.m&&t.getDate()===m.d&&t.getMonth()+1===m.m)};
function meQs(){
  const m=S.me;if(!m)return [];
  const q=[],nm=m.n,hm=m.h,or=m.o;
  if(nm){
    q.push(sq({t:['ni',nm,'naiz'],es:'Yo soy '+nm+'.',tip:'Ni + tu nombre + naiz.'}));
    q.push(sq({t:['nire','izena',nm,'da'],es:'Mi nombre es '+nm+'.',tip:'nire izena … da = mi nombre es…'}));
    q.push(mc('Zu zara','«¿Cómo te llamas?»','¿Cuál es la pregunta?','Zer da zure izena?',['Nongoa zara?','Non bizi zara?','Zenbat urte dituzu?'],'<b>Zer da zure izena?</b> = ¿cómo te llamas?'));
  }
  if(hm){
    q.push(sq({t:[inePl(hm),'bizi','naiz'],es:'Vivo en '+hm+'.',tip:'lugar + -n/-en + bizi naiz.'}));
    q.push(mc('Zu zara','«Vivo en '+hm+'»','¿Cuál es?',inePl(hm)+' bizi naiz',[hm+'ra bizi naiz',hm+'tik bizi naiz',inePl(hm)+' bizi dut'],'<b>-n / -en</b> = en (dónde). bizi + naiz.'));
    q.push(mc('Zu zara','«¿Dónde vives?»','¿Cuál es la pregunta?','Non bizi zara?',['Nora zoaz?','Nongoa zara?','Noiz jaio zinen?'],'<b>Non bizi zara?</b> = ¿dónde vives?'));
  }
  if(or){
    q.push(sq({t:[fromPl(or),'naiz'],es:'Soy de '+or+'.',tip:'lugar + -ko + a → «de ese lugar».'}));
    q.push(mc('Zu zara','«Soy de '+or+'»','¿Cuál es?',fromPl(or)+' naiz',[or+'ra naiz',or+'tik naiz',inePl(or)+' naiz'],'<b>-koa</b> = de (origen).'));
    q.push(mc('Zu zara','«¿De dónde eres?»','¿Cuál es la pregunta?','Nongoa zara?',['Non bizi zara?','Zer da zure izena?','Nora zoaz?'],'<b>Nongoa zara?</b> = ¿de dónde eres?'));
  }
  if(m.d&&m.m){
    q.push(sq({t:[MON_GEN[m.m-1],dayEu(m.d),'jaio','nintzen'],es:'Nací el '+m.d+' de '+MON_ES[m.m-1]+'.',tip:'mes + -ren + día + -an + jaio nintzen.'}));
    q.push(mc('Zu zara','«¿Cuándo naciste?»','¿Cuál es la pregunta?','Noiz jaio zinen?',['Non jaio zinen?','Zenbat urte dituzu?','Noiz bizi zara?'],'<b>Noiz jaio zinen?</b> = ¿cuándo naciste?'));
  }
  const ag=meAge(m);
  if(ag!=null&&ag>=2&&ag<100){
    q.push(sq({t:numEu(ag).split(' ').concat(['urte','ditut']),es:'Tengo '+ag+' años.',tip:'número + urte ditut.'}));
    q.push(mc('Zu zara','«¿Cuántos años tienes?»','¿Cuál es la pregunta?','Zenbat urte dituzu?',['Zenbat urte zara?','Noiz jaio zinen?','Zer da zure izena?'],'<b>Zenbat urte dituzu?</b>'));
  }
  return shuffle(q).slice(0,9);
}
function meForm(){
  const m=S.me||{},ms=MON_NOM.map((x,i)=>`<option value="${i+1}"${m.m===i+1?' selected':''}>${x}</option>`).join('');
  return `<div class="card" id="meform"><b style="font:400 24px var(--f-display)">Aurkeztu zaitez${S.level==='a2'?'':' · cuéntanos de ti'}</b>

  <div class="stack" style="gap:8px">

  <div class="row"><button class="btn" data-act="mesave">Gorde · guardar</button><button class="btn sec" data-act="meskip">${S.me?'Utzi · cancelar':'Orain ez · ahora no'}</button></div></div></div>`;
}
function meCard(){
  if(UI.meEdit||(!S.me&&!S.meSkip))return meForm();
  return '';
}
function meSave(){
  const v=id=>($('#'+id)||{value:''}).value.trim().replace(/[<>]/g,'');
  const m={n:v('me-n'),h:v('me-h'),o:v('me-o'),d:+v('me-d')||0,m:+v('me-m')||0,y:+v('me-y')||0};
  if(m.d&&(m.d<1||m.d>31))m.d=0;
  const yr=new Date().getFullYear();if(m.y&&(m.y<1900||m.y>yr))m.y=0;
  if(m.d&&!m.m)m.d=0;
  if(!m.n&&!m.h&&!m.o&&!(m.d&&m.m)){toast('Escribe al menos un dato');return false}
  S.me=m;S.meSkip=0;UI.meEdit=false;save();return true;
}

<script>
/* ===== Test: saltar de nivel (A1 → A2) y autoevaluación ===== */
const TEST_BLK=[['vocab','Hiztegia','Vocabulario'],['verbs','Aditzak','Verbos y auxiliares'],['build','Esaldiak','Construir frases'],['gram','Gramatika','Gramática de las lecciones']];
const PLACE_SIZES=[12,10,10,8],SELF_SIZES=[6,5,5,4],PLACE_COOL=864e5;
function withLevel(lv,fn){const o=S.level;S.level=lv;try{return fn()}finally{S.level=o}}
const lvVerbKeys=lv=>Object.keys(CONJ).filter(k=>lvOf(CONJ[k])===lv);
function gramQs(lv,n){
  const out=[],seen=new Set(),ls=shuffle(LESSONS.filter(l=>lvOf(l)===lv));
  for(let pass=0;pass<3&&out.length<n;pass++){
    for(let i=0;i<ls.length&&out.length<n;i++){
      const l=ls[i];let qs=[];
      try{qs=withLevel(lv,()=>l.make())}catch(e){}
      qs=qs.filter(q=>q.k==='choice'&&!q.wid&&!q.vk&&!q.meta&&!q.key&&!seen.has(q.p+'|'+q.hint));
      if(!qs.length)continue;
      const q=qs[rnd(qs.length)];seen.add(q.p+'|'+q.hint);q.src=l.id;out.push(q);
    }
  }
  return out.slice(0,n);
}
function testSet(lv,sz){
  window.FORCEPAST=true;try{return testSet0(lv,sz)}finally{window.FORCEPAST=false}
}
function testSet0(lv,sz){
  const a=[],tag=(arr,b)=>arr.forEach(q=>{q.blk=b;a.push(q)});
  tag(withLevel(lv,()=>vocabQs(allWords(),sz[0])),'vocab');
  tag(conjQs(lvVerbKeys(lv),sz[1]),'verbs');
  tag(withLevel(lv,()=>buildQs(sz[2])),'build');
  tag(gramQs(lv,sz[3]),'gram');
  return shuffle(a);
}
const ptLeft=()=>S.ptLast?Math.max(0,S.ptLast+PLACE_COOL-Date.now()):0;
const fmtLeft=ms=>{const h=Math.floor(ms/36e5),m=Math.ceil((ms%36e5)/6e4);return h>0?h+' h '+m+' min':m+' min'};
function testView(){
  const left=ptLeft(),done=S.a1test===1,a1c=a1Complete(),tl=UI.tlv||(a2Open()&&S.level==='a2'?'a2':'a1');
  const total=PLACE_SIZES.reduce((a,b)=>a+b,0);
  let pl;
  if(done)pl=`<p class="okmsg" style="margin:8px 0 0">✅ A1 acreditado por test. El A2 está abierto.</p>`;
  else if(a1c)pl=`<p class="es" style="margin:8px 0 0">Ya completaste las ${a1Total()} lecciones del A1: el A2 está abierto, no necesitas el test.</p>`;
  else pl=`<ul class="goals small"><li>${total} preguntas: vocabulario 12 · verbos 10 · frases 10 · gramática 8.</li><li>Para pasar: <b>90 %</b> en total (${Math.ceil(total*.9)} aciertos) y <b>75 %</b> como mínimo en cada bloque.</li><li>Sin ayudas ni explicaciones hasta el final.</li><li>Si suspendes, puedes reintentar a las 24 h (con preguntas distintas).</li></ul>${S.ptTry?`<p class="es" style="margin:0 0 10px">Intentos: ${S.ptTry} · mejor resultado: ${S.ptBest||0}/${total}</p>`:''}${left?`<button class="btn block" disabled>Reintento disponible en ${fmtLeft(left)}</button>`:`<button class="btn block" data-act="tplace">Hasi proba · empezar el test</button>`}`;
  const sl=S.selfLast?`<p class="es" style="margin:0 0 10px">Última: ${S.selfLast.lv.toUpperCase()} · ${S.selfLast.ok}/${S.selfLast.n} (${S.selfLast.pct} %)</p>`:'';
  return `<h1 class="big">Test</h1><p class="sub">Salta el A1 o mide cómo vas, sin tocar tu progreso de lecciones.</p>
  <div class="stack">
  <div class="card"><div class="setrow"><span class="ic">🚀</span><div class="grow"><b>Maila saltatu</b><div class="es">Saltar el A1 y pasar al A2</div></div></div>${pl}</div>
  <div class="card"><div class="setrow"><span class="ic">🧭</span><div class="grow"><b>Autoebaluazioa</b><div class="es">Autoevaluación · ${SELF_SIZES.reduce((a,b)=>a+b,0)} preguntas, con explicación y sin nota mínima</div></div></div>
  <div class="sel" style="margin:12px 0"><button class="pill${tl==='a1'?' on':''}" data-act="tlv" data-l="a1">A1</button><button class="pill${tl==='a2'?' on':''}" data-act="tlv" data-l="a2">A2${a2Open()?'':' 🔒'}</button></div>${sl}
  <button class="btn sec block" data-act="tself" data-l="${tl}">Hasi · empezar autoevaluación</button></div>
  </div>`;
}
function startPlacement(){
  if(ptLeft()||S.a1test===1)return;
  runSession({tag:'test',test:'place',nohelp:true,lv:'a1',make:()=>testSet('a1',PLACE_SIZES)});
}
function startSelf(lv){

function testGrade(ok,q,given){

function missLabel(q){
  if(q.blk==='vocab'){const s=VOCAB.find(x=>x.id===String(q.wid||'').split(':')[0]);return s?'Hitzak · '+s.eu:'Hitzak'}
  if(q.blk==='verbs'){const v=q.vk||(q.meta&&q.meta.vk);return 'Aditzak'+(v?' · '+v:'')}
  if(q.blk==='build')return 'Esaldiak · construir frases';
  const l=LESSONS.find(x=>x.id===q.src);return l?'Ikasgaia '+l.n+' · '+l.eu:'Gramatika'

function testFinish(){
  const R=SES.res||[],cfg=SES.cfg;SES.i=SES.qs.length;
  const by={};TEST_BLK.forEach(b=>by[b[0]]={n:0,ok:0,miss:[]});
  R.forEach(r=>{const b=by[r.q.blk];if(!b)return;b.n++;if(r.ok)b.ok++;else b.miss.push(r.q)});
  const tot=R.length,okN=R.filter(r=>r.ok).length,pct=tot?Math.round(okN/tot*100):0,need=Math.ceil(tot*.9);
  const blkMin=b=>Math.ceil(b.n*.75),blkOk=TEST_BLK.every(b=>!by[b[0]].n||by[b[0]].ok>=blkMin(by[b[0]]));
  const place=cfg.test==='place',pass=place&&okN>=need&&blkOk;
  if(place){S.ptLast=Date.now();S.ptTry=(S.ptTry||0)+1;S.ptBest=Math.max(S.ptBest||0,okN);if(pass){S.a1test=1;S.a2unl=1}}
  else S.selfLast={lv:cfg.lv,ok:okN,n:tot,pct,ts:Date.now()};
  S.sess++;save();
  const labels=Array.from(new Set([].concat(...TEST_BLK.map(b=>by[b[0]].miss.map(missLabel))))).slice(0,8);
  const rows=TEST_BLK.map(b=>{const x=by[b[0]],mn=blkMin(x),p=x.n?Math.round(x.ok/x.n*100):0,good=!x.n||x.ok>=mn;
    return `<div class="card"><div class="row" style="justify-content:space-between"><b>${b[1]} <span class="es" style="font-weight:400">· ${b[2]}</span></b><span class="chip">${x.ok}/${x.n}</span></div><div class="bar"><i style="width:${p}%;background:${good||!place?'var(--berde)':'var(--gorri)'}"></i></div>${place?`<div class="es" style="font-size:13px;margin-top:4px">mínimo ${mn} · ${good?'✔ superado':'✘ por debajo'}</div>`:''}</div>`}).join('');
  let head,msg;
  if(place&&pass){head=['🏆','Zorionak!','¡Has superado el test!'];msg=`<p><b>A1 acreditado.</b> Has acertado ${okN} de ${tot} (${pct} %). El A2 está desbloqueado.</p>`}
  else if(place){head=['💪','Ia-ia!','Todavía no'];const why=[];if(okN<need)why.push(`necesitas ${need} aciertos y tienes ${okN}`);if(!blkOk)why.push('algún bloque está por debajo del 75 %');msg=`<p><b>No has llegado al mínimo:</b> ${why.join(' y ')}. Puedes reintentarlo a las 24 h con preguntas distintas; mientras, repasa lo de abajo.</p>`}
  else{head=[pct>=90?'🏆':pct>=60?'🎉':'💪','Autoebaluazioa','Resultado: '+okN+' de '+tot+' ('+pct+' %)'];msg=`<p>${pct>=90?'Nivel muy sólido: este nivel lo dominas.':pct>=70?'Vas bien; repasa los puntos débiles.':'Conviene repasar este nivel con las lecciones.'}</p>`}
  $('#view').innerHTML=`<div class="result"><div style="font-size:54px">${head[0]}</div><h1 class="big">${head[1]}</h1><p class="sub">${head[2]}</p><div class="num">${pct}%</div></div>
  <div class="explain">${msg}</div><div class="stack" style="margin-top:14px">${rows}</div>
  ${labels.length?`<div class="card" style="margin-top:14px"><b>Berrikusi · repasa</b><div class="stack" style="margin-top:8px">${labels.map(m=>`<div class="ex">${esc(m)}</div>`).join('')}</div></div>`:''}
  <div class="stack" style="margin-top:20px">${pass?'<button class="btn block" id="toa2">A2 ikasgelara · ir al A2</button>':''}<button class="btn${pass?' sec':''} block" id="tback">Test-era itzuli · volver</button></div>`;
  window.scrollTo(0,0);
  $('#tback').onclick=()=>endSession();
  if(pass)$('#toa2').onclick=()=>{S.level='a2';save();endSession(true);goTo('ikasgela')};

}

<script>

  const L=lessonById(id),SM=LSUM[id];if(!L)return'';

  });
  if(SM&&SM.kw)o+='<p class="rc-h">Hitz gakoak · palabras clave</p><div class="tscroll"><table class="mini"><tr><th>Euskera</th><th>Español</th></tr>'+SM.kw.map(k=>'<tr><td><b>'+esc(k[0])+'</b></td><td>'+esc(k[1])+'</td></tr>').join('')+'</table></div>';

function openLesson(id){pushState();LES={id,step:-1};document.body.classList.add('in-session');lessonRender()}

  let h=`<div class="qtop"><div class="prog"><i style="width:${(st+1)/(n+1)*100}%"></i></div><div class="combo">${Math.max(st+1,0)}/${n}</div></div>`;
  if(st<0){
    const sc=S.lessons[L.id];
    h+=`<p class="qkind">${L.n}. ikasgaia · ~${L.min} min</p><h1 class="big">${L.ic} ${esc(L.eu)}</h1><p class="sub">${lvOf(L)==='a2'&&L.n>=16?'':esc(L.es)}</p>

    <div class="stack" style="margin-top:18px"><button class="btn block" data-lact="next">Hasi · empezar</button></div>`;
  }else{
    const s=steps[st].sum?{t:'Laburpena · resumen',h:'<p>Lo esencial de la lección:</p><ul class="goals">'+SM.sum.map(x=>'<li>'+x+'</li>').join('')+'</ul><p style="margin-top:16px"><b>Hitz gakoak · palabras clave</b></p>',tb:'<table class="mini"><tr><th>Euskera</th><th>Español</th></tr>'+SM.kw.map(k=>'<tr><td><b>'+esc(k[0])+'</b></td><td>'+esc(k[1])+'</td></tr>').join('')+'</table>',cards:1}:steps[st],last=st===n-1;
    h+=`<p class="qkind">${L.n}. ikasgaia · ${st+1}/${n}</p><h1 class="big" style="font-size:clamp(24px,6vw,32px)">${esc(s.t)}</h1><div class="lbody">${s.h||''}`;
    if(s.pc)h+=`<div class="pieces">${s.pc.map(p=>`<div class="piece ${p[1]}"><span class="f">${esc(p[0])}</span><span class="l">${esc(p[2])}</span></div>`).join('')}</div>`;
    if(s.tb)h+=`<div class="tscroll">${s.tb}</div>`;
    if(s.ex)h+=s.ex.map(e=>`<div class="ex${hideTr(L)?' tr':''}">${esc(e[0])}<small>${esc(e[1])}</small></div>`).join('');

  }
  $('#view').innerHTML=h+'<div style="height:30px"></div>';
  window.scrollTo(0,0);
}
$('#view').addEventListener('click',e=>{
  if(!LES)return;
  const b=e.target.closest('[data-lact]');if(!b)return;
  const a=b.dataset.lact,L=lessonById(LES.id);
  if(a==='exit')closeLesson();
  else if(a==='next'){LES.step++;lessonRender()}
  else if(a==='prev'){if(LES.step>=0)LES.step--;lessonRender()}

    const id=L.id,ws=LSUM[id].kw.map(k=>({id:'kw:'+id+':'+k[0],eu:k[0],es:k[1],em:''}));LES=null;

    const id=L.id;LES=null;
    runSession({tag:'lesson',lesson:id,make:()=>L.make().map(q=>{if(q.k==='choice'&&!q.help&&!q.wid&&!q.vk)q.help='Repasa la idea de la lección: '+LSUM[id].sum[0];return q})});

});

function wordsFind(q){
  q=norm(q);if(q.length<2)return [];
  return allWords(true).filter(w=>norm(w.eu).includes(q)||norm(w.es).includes(q)).slice(0,25);
}
function weakQs(){
  const a=allWords().map(w=>({w,k:mast(w.id)+Math.random()*1.5})).sort((x,y)=>x.k-y.k).slice(0,12).map(x=>x.w);
  return vocabQs(a,10);
}

function importCode(c){
  const o=JSON.parse(decodeURIComponent(escape(atob(c.replace(/\s+/g,'')))));
  if(!o||typeof o!=='object'||typeof o.xp!=='number'||typeof o.m!=='object')throw new Error('bad');
  return o;
}

  <tr><td><b>zer</b> qué</td><td>Zer edaten duzu?</td></tr><tr><td><b>nor</b> quién</td><td>Nor zara zu?</td></tr>
  <tr><td><b>non</b> dónde</td><td>Non bizi zara?</td></tr><tr><td><b>nora</b> adónde</td><td>Nora zoaz?</td></tr>
  <tr><td><b>noiz</b> cuándo</td><td>Noiz etorriko zara?</td></tr><tr><td><b>nola</b> cómo</td><td>Nola zaude?</td></tr>
  <tr><td><b>zergatik</b> por qué</td><td>Zergatik ikasten duzu euskara?</td></tr><tr><td><b>zenbat</b> cuánto</td><td>Zenbat da?</td></tr></table></div></details>
  <details class="g"><summary>7 · Decir que no</summary><div class="body">
  <p>«<b>ez</b>» va justo antes del auxiliar. El verbo queda detrás.</p>
  ${ex('<b>Ez</b> nago etxean.','No estoy en casa.')}${ex('<b>Ez</b> dut kaferik edaten.','No bebo café. Con ez, el objeto lleva -rik.')}</div></details>
  <details class="g"><summary>8 · Los 4 tipos de verbo: NOR, NOR-NORK, NOR-NORI, NOR-NORI-NORK</summary><div class="body">
  <p>El auxiliar depende de <b>quién participa</b> en la acción. <b>NOR</b> = quién/qué (sin marca), <b>NORK</b> = quién lo hace (lleva <b>-k</b>), <b>NORI</b> = a quién (lleva <b>-ri</b>).</p>
  <div class="tscroll"><table class="mini"><tr><th>Tipo</th><th>Participan</th><th>Auxiliar</th><th>Ejemplo</th></tr>
  <tr><td style="white-space:nowrap"><b>NOR</b></td><td>solo el sujeto</td><td>naiz, zara, da, gara…</td><td>Ni Iruñean bizi <b>naiz</b>.</td></tr>
  <tr><td style="white-space:nowrap"><b>NOR-NORK</b></td><td>sujeto + objeto («qué»)</td><td>dut, duzu, du, dugu…</td><td>Nik ogia jaten <b>dut</b>.</td></tr>
  <tr><td style="white-space:nowrap"><b>NOR-NORI</b></td><td>una cosa + «a quién»</td><td>zait, zaizu, zaio, zaigu…</td><td>Niri euskara gustatzen <b>zait</b>.</td></tr>
  <tr><td style="white-space:nowrap"><b>NOR-NORI-NORK</b></td><td>quien lo hace + «qué» + «a quién»</td><td>diot, diozu, dio… / dit, dizu, dio…</td><td>Nik amari liburua ematen <b>diot</b>.</td></tr></table></div>
  <p style="margin-top:12px"><b>Cómo reconocer el tipo</b></p>
  <ol style="margin:0 0 10px;padding-left:20px"><li>¿Hay «a quién» (-ri) además del «qué»? → <b>NOR-NORI-NORK</b> (dar, decir, enviar, enseñar, explicar, preguntar).</li><li>¿Algo «le gusta, le parece, se le olvida» a alguien? → <b>NOR-NORI</b> (gustatu, iruditu, ahaztu, interesatu).</li><li>¿Hay un objeto directo («qué»)? → <b>NOR-NORK</b>.</li><li>¿Solo sujeto? → <b>NOR</b> (izan, egon, joan, etorri, bizi, jaio).</li></ol>
  <p><b>Ojo con la dirección:</b> <i>Nik amari ematen <b>diot</b></i> (yo le doy a mamá) frente a <i>Amak niri ematen <b>dit</b></i> (mamá me da a mí). El auxiliar cambia según quién da y quién recibe.</p>
  ${ex('Amak niri liburu bat eman <b>dit</b>.','Mamá me ha dado un libro.')}${ex('Irakasleak guri euskara irakasten <b>digu</b>.','El profesor nos enseña euskera.')}
  <p class="es">Practica: lección 22 «Nori eman diozu?» (A1), lecciones 1 y 10 del A2, la pestaña Aditzak y el botón «Probatu» de arriba.</p></div></details>`;
}

/* ===== RUTAS Y EVENTOS ===== */
function render(){
  if(SES)return;
  if(LES){lessonRender();return}
  const r=route();
  $('#view').innerHTML=({home:homeView,ikasgela:ikasgelaView,hitzak:hitzakView,aditzak:aditzakView,esaldiak:esaldiakView,gida:gidaView,ezarpenak:ezarpenakView,test:testView})[r]();
  $('#tabs').innerHTML=TABS.map(t=>`<button class="tab${t[0]===r?' on':''}" data-go="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');
  const gr=$('#gear');if(gr)gr.classList.toggle('on',r==='ezarpenak');
  refreshHeader();
}
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('[data-go]');if(!b)return;
  goTo(b.dataset.go);
});
window.addEventListener('hashchange',()=>{let h='';try{h=location.hash.slice(1)}catch(e){}if(validRoute(h)&&h!==CUR){CUR=h;render();window.scrollTo(0,0)}});
$('#view').addEventListener('click',e=>{
  if(SES)return;
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,d=b.dataset,all=allWords();
  const setPool=()=>setWords(VOCAB.find(s=>s.id===d.set));
  if(a==='go'){goTo(d.to)}
  else if(a==='lesson'){openLesson(d.id)}
  else if(a==='code'){
    const v=norm($('#acc').value).replace(/\s+/g,'');
    if(v==='irakasle2026'){S.a2key=1;save();render();toast('🔓 Acceso especial activo: A2 desbloqueado')}
    else{$('#accm').innerHTML='<p class="errmsg">Código incorrecto.</p>'}
  }
  else if(a==='codeoff'){S.a2key=0;if(S.level==='a2'&&!a1Complete())S.level='a1';save();render()}
  else if(a==='lvl'){
    if(d.l==='a2'&&!a2Open()){toast('🔒 Completa las '+a1Total()+' lecciones del A1 para abrir el A2 ('+a1Done()+'/'+a1Total()+')');return}
    S.level=d.l;save();render();window.scrollTo(0,0);
  }
  else if(a==='me'){if(S.me)runSession({tag:'mix',make:meQs});else{UI.meEdit=true;render();scrollTo(0,0)}}
  else if(a==='medit'){UI.meEdit=true;render();scrollTo(0,0)}
  else if(a==='mesave'){if(meSave()){toast('Gordeta! · guardado');render();scrollTo(0,0)}}
  else if(a==='meskip'){UI.meEdit=false;if(!S.me)S.meSkip=1;save();render()}
  else if(a==='tplace')startPlacement();
  else if(a==='tself')startSelf(d.l||'a1');
  else if(a==='tlv'){if(d.l==='a2'&&!a2Open()){toast('El A2 sigue bloqueado');return}UI.tlv=d.l;render()}
  else if(a==='quick')runSession({tag:'mix',make:()=>S.level==='a2'?shuffle(vocabQs(all,5).concat(conjQs(['gustatu','ahal (dezaket)','joan (iragana)'],3),buildQs(2))):shuffle(vocabQs(all,4).concat(conjQs(['izan','egon','ukan'],3),buildQs(3)))});
  else if(a==='weak')runSession({tag:'vocab',make:weakQs});
  else if(a==='say')say(d.t);
  else if(a==='goal'){S.goal=+d.g;save();render()}
  else if(a==='exp'){
    const t=$('#bk');t.hidden=false;t.value=exportCode();t.dataset.mode='exp';t.select();
    let ok=false;try{ok=document.execCommand&&document.execCommand('copy')}catch(e){}
    try{if(navigator.clipboard)navigator.clipboard.writeText(t.value).catch(()=>{})}catch(e){}
    bkMsg(ok?'Código copiado. Guárdalo en tus notas o envíatelo.':'Código generado: cópialo del recuadro y guárdalo.',true);
  }
  else if(a==='imp'){
    const t=$('#bk');
    if(t.hidden||t.dataset.mode==='exp'){t.hidden=false;t.value='';t.dataset.mode='imp';t.focus();bkMsg('Pega tu código y pulsa «Inportatu» otra vez.',true);return}
    try{const o=importCode(t.value);S=Object.assign({lessons:{},xp:0,today:0,day:'',streak:0,last:'',m:{},badges:[],typeMode:false,sess:0,conj:0,built:0,bestCombo:0,goal:50,level:'a1'},o);S.a2key=0;if(S.level!=='a2'||!a2Open())S.level='a1';save();render();bkMsg('¡Progreso importado!',true)}
    catch(e){bkMsg('Código no válido. Cópialo entero, sin cortar.',false)}
  }
  else if(a==='reset'){
    if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='¿Seguro? Pulsa otra vez para borrar todo';return}
    S={lessons:{},xp:0,today:0,day:S.day,streak:0,last:'',m:{},badges:[],typeMode:false,sess:0,conj:0,built:0,bestCombo:0,goal:S.goal,level:'a1'};save();render();window.scrollTo(0,0);
  }
  else if(a==='mixv')runSession({tag:'vocab',make:()=>vocabQs(all,10)});
  else if(a==='quiz'){const p=setPool();runSession({tag:'vocab',make:()=>vocabQs(p,Math.min(8,p.length))})}
  else if(a==='flash'){const p=setPool();runSession({tag:'flash',make:()=>flashQs(p,Math.min(10,p.length))})}
  else if(a==='verb'){UI.verb=d.v;render()}
  else if(a==='practice'){const vk=UI.verb;runSession({tag:'conj',make:()=>conjQs([vk],8)})}
  else if(a==='practiceall')runSession({tag:'conj',make:()=>conjQs(verbKeys(),10)});
  else if(a==='build')runSession({tag:'build',make:()=>buildQs(6)});
  else if(a==='nn')runSession({tag:'nn',make:()=>typeQs(10)});
  else if(a==='typemode'){S.typeMode=b.checked;save()}
  else if(a==='dict'){UI.dict=true;UI.dc=null;render();scrollTo(0,0)}
  else if(a==='dictx'){UI.dict=false;UI.dc=null;render()}
  else if(a==='dcat'){UI.dc=d.i===''||d.i==null?null:+d.i;render();scrollTo(0,0)}
  else if(a==='labv'){UI.lab.v=+d.i;render()}
  else if(a==='labt'){UI.lab.tk=d.t;render()}
  else if(a==='labp'){UI.lab.i=+d.i;render()}
});
$('#view').addEventListener('input',e=>{
  if(e.target.id==='dsrch'){const v=e.target.value,box=$('#dres'),bd=$('#dbody');if(v.trim().length<2){box.hidden=true;bd.hidden=false;return}const r=dictFind(v);box.hidden=false;bd.hidden=true;box.innerHTML=r.length?r.slice(0,80).map(w=>`<div class="hit"><button class="spk" data-act="say" data-t="${esc(w[0])}" aria-label="Escuchar">🔊</button><b>${esc(w[0])}</b><span class="es">${esc(w[1])}</span></div>`).join('')+(r.length>80?`<p class="es">+${r.length-80} gehiago · afina la búsqueda</p>`:''):'<p class="es">Sin resultados.</p>';return}
  if(e.target.id!=='srch')return;
  const r=wordsFind(e.target.value),box=$('#srr');
  if(e.target.value.trim().length<2){box.hidden=true;return}
  box.hidden=false;
  box.innerHTML=r.length?r.map(w=>`<div class="hit"><button class="spk" data-act="say" data-t="${esc(w.eu)}" aria-label="Escuchar">🔊</button><b>${esc(w.em?w.em+' ':'')}${esc(w.eu)}</b><span class="es">${esc(w.es)}</span></div>`).join(''):'<p class="es">Sin resultados.</p>';
});
$('#gear').addEventListener('click',()=>{goTo(route()==='ezarpenak'?'home':'ezarpenak')});
if(S.level==='a2'&&!a2Open())S.level='a1';
refreshHeader();
render();
checkBadges();
</script>
