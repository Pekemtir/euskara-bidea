 {t:'En frases',h:'<p>Se usan con verbos como <b>ikusi, maite izan, entzun, ezagutu</b>.</p>',
  ex:[['Maite zaitut.','Te quiero.'],['Ikusten zaitut.','Te veo.'],['Zuk ni ikusten nauzu.','Tú me ves.'],['Amak maite gaitu.','Mamá nos quiere.'],['Entzuten nauzu?','¿Me oyes?']]},
 {t:'Ojo con el orden',h:'<p>El auxiliar sigue al final y concuerda con <b>quién hace</b> y <b>a quién</b>: no se puede adivinar solo por el sujeto. Si dudas, fíjate en el objeto: <b>zu → zait-</b>, <b>ni → nau-</b>, <b>gu → gai-</b>.</p>'}
 ],
 make:()=>[].concat(SQ0(['maite','zaitut'],'Te quiero.','zaitut = yo a ti.'),SQ0(['zuk','ni','ikusten','nauzu'],'Tú me ves.','nauzu = tú a mí.'),[
  mc('Zaitut','«Te quiero»','¿Cuál es?','Maite zaitut',['Maite nauzu','Maite dut','Maite zait'],'Yo → ti: <b>zaitut</b>.'),
  mc('Nauzu','«Tú me ves»','¿Cuál es?','Ikusten nauzu',['Ikusten zaitut','Ikusten du','Ikusten gaitu'],'Tú → mí: <b>nauzu</b>.'),
  mc('Gaitu','«Mamá nos quiere»','Elige el auxiliar','gaitu',['gaitut','zaitu','nau'],'Hark → gu: <b>gaitu</b>.'),
  mc('Nau','«Él/ella me ve»','Elige el auxiliar','nau',['nauzu','zaitu','naute'],'Hark → ni: <b>nau</b>.'),
  mc('Zaitu','«Él/ella te ve»','Elige el auxiliar','zaitu',['zaitut','nauzu','gaitu'],'Hark → zu: <b>zaitu</b>.')
 ])},

{id:'b12',lv:'a1',n:24,eu:'Aginduak',es:'Órdenes, peticiones y prohibiciones',ic:'📣',min:7,
 goals:['Dar órdenes sencillas con el verbo suelto (Itxi atea!)','Usar zatoz, zoaz, zaude','Pedir con cortesía (ezazu) y prohibir (ez)'],
 steps:[
 {t:'El verbo suelto',h:'<p>La orden más sencilla es el <b>participio solo</b>: sin auxiliar ni pronombre.</p>',
  ex:[['Itxi atea!','¡Cierra la puerta!'],['Ireki leihoa!','¡Abre la ventana!'],['Etorri hona!','¡Ven aquí!'],['Entzun!','¡Escucha!']]},
 {t:'Zatoz, zoaz, zaude',h:'<p>Tres imperativos propios que usarás mucho:</p>',
  tb:'<table class="mini"><tr><th>A uno (zu)</th><th>A varios (zuek)</th><th></th></tr><tr><td><b>zatoz</b></td><td>zatozte</td><td>ven</td></tr><tr><td><b>zoaz</b></td><td>zoazte</td><td>ve</td></tr><tr><td><b>zaude</b></td><td>zaudete</td><td>quédate / espera</td></tr></table>',
  ex:[['Zatoz hona!','¡Ven aquí!'],['Zoaz etxera!','¡Vete a casa!'],['Zaude isilik!','¡Cállate! (estate quieto)']]},
 {t:'Cortesía y prohibición',h:'<p>Para pedir con educación: verbo + <b>ezazu</b> (a ti) / <b>ezazue</b> (a vosotros). Para prohibir: <b>ez</b> + verbo (o <b>ez ezazu</b> + verbo).</p>',
  ex:[['Ireki ezazu atea, mesedez.','Abre la puerta, por favor.'],['Itxi ezazue leihoa.','Cerrad la ventana.'],['Ez ireki atea!','¡No abras la puerta!'],['Ez ezazu ireki.','No la abras (educado).']]}
 ],
 make:()=>[].concat(SQ0(['zatoz','hona'],'Ven aquí.','zatoz = ven (etorri).'),SQ0(['ireki','ezazu','atea'],'Abre la puerta.','verbo + ezazu = petición educada.'),[
  mc('Agindua','«¡Cierra la puerta!»','¿Cuál es?','Itxi atea!',['Itxi dut atea','Ixten atea','Atea itxi naiz'],'Orden simple: <b>participio solo</b>.'),
  mc('Agindua','«Ven aquí»','¿Cuál es?','Zatoz hona',['Zatoz horra','Etorri naiz hona','Dator hona'],'<b>zatoz</b> = ven.'),
  mc('Agindua','«Vete a casa»','¿Cuál es?','Zoaz etxera',['Zatoz etxera','Zaude etxera','Noa etxera'],'<b>zoaz</b> = ve.'),
  mc('Agindua','«Espera aquí»','¿Cuál es?','Zaude hemen',['Zoaz hemen','Zatoz hemen','Zaudete hemen'],'<b>zaude</b> = quédate, espera.'),
  mc('Agindua','«No abras»','¿Cuál es?','Ez ireki!',['Ireki ez!','Ez irekia!','Ireki ezin!'],'<b>ez</b> + verbo.')
 ])},

{id:'b13',lv:'a2',n:6,eu:'Dezaket eta naiteke',es:'Poder: puedo hacer, puedo ir',ic:'💪',min:8,
 goals:['Formar el potencial: dezaket (con objeto), naiteke (sin objeto)','Pedir permiso: Sar naiteke?','Distinguir ezin dut de dezaket'],
 steps:[
 {t:'Dos tablas de «poder»',h:'<p>Para <b>poder</b> hay formas propias. Se usa el participio y la forma que corresponde al tipo de verbo:</p>',
  tb:'<table class="mini"><tr><th></th><th>con objeto<br>(ukan)</th><th>sin objeto<br>(izan)</th></tr><tr><td>ni</td><td><b>dezaket</b></td><td><b>naiteke</b></td></tr><tr><td>zu</td><td><b>dezakezu</b></td><td><b>zaitezke</b></td></tr><tr><td>hura</td><td><b>dezake</b></td><td><b>daiteke</b></td></tr><tr><td>gu</td><td><b>dezakegu</b></td><td><b>gaitezke</b></td></tr><tr><td>zuek</td><td><b>dezakezue</b></td><td><b>zaitezkete</b></td></tr><tr><td>haiek</td><td><b>dezakete</b></td><td><b>daitezke</b></td></tr></table>',
  tip:'<b>Euskaraz hitz egin dezaket</b> (hablar lleva objeto) · <b>Etor naiteke</b> (venir no lo lleva).'},
 {t:'Preguntar si puedes',h:'<p>Mismas formas en pregunta, con <b>al</b> si quieres: <b>Sar naiteke?</b> (¿puedo pasar?), <b>Hitz egin dezaket?</b></p>',
  ex:[['Sar naiteke?','¿Puedo pasar?'],['Euskaraz hitz egin dezaket.','Puedo hablar en euskera.'],['Bihar etor naiteke.','Mañana puedo venir.'],['Telefonoa erabil dezaket?','¿Puedo usar el teléfono?']]},
 {t:'Dezaket o ezin dut',h:'<p>La negación es <b>ezin</b> + el auxiliar normal: <b>Ezin dut etorri</b> (no puedo venir). El potencial se usa sobre todo en afirmativo y para pedir permiso.</p>'}
 ],
 make:()=>[].concat(conjQs(['ahal (dezaket)','ahal (naiteke)'],5),SQ0(['euskaraz','hitz','egin','dezaket'],'Puedo hablar en euskera.','objeto → dezaket.'),[
  mc('Potentziala','«Puedo venir» (etorri)','¿Cuál es?','Etor naiteke',['Etor dezaket','Etorri dut','Etor nahi dut'],'etorri no lleva objeto → <b>naiteke</b>.'),
  mc('Potentziala','«Puedo leer el libro»','¿Cuál es?','Liburua irakur dezaket',['Liburua irakur naiteke','Liburua irakurri dut','Liburua irakurtzen naiz'],'irakurri lleva objeto → <b>dezaket</b>.'),
  mc('Baimena','«¿Puedo pasar?»','¿Cuál es?','Sar naiteke?',['Sar dezaket?','Sartu al dut?','Sar naiz?'],'<b>naiteke</b>.')
 ])},

{id:'b14',lv:'a1',n:23,eu:'Norekin? Zertaz?',es:'Con quién, en qué (transporte), hasta, hacia',ic:'🚆',min:8,
 goals:['Decir «con» con -rekin: amarekin, nirekin','Decir el medio con -z: autobusez, oinez','Usar -raino (hasta) y -rantz (hacia)'],
 steps:[
 {t:'-rekin: «con»',h:'<p>Para <b>con alguien</b> se añade <b>-rekin</b> (o <b>-ekin</b> si acaba en consonante). Con pronombres:</p>',
  tb:'<table class="mini"><tr><th>Pronombre</th><th>Con…</th></tr><tr><td>ni</td><td><b>nirekin</b></td></tr><tr><td>zu</td><td><b>zurekin</b></td></tr><tr><td>hura</td><td><b>harekin</b></td></tr><tr><td>gu</td><td><b>gurekin</b></td></tr><tr><td>zuek</td><td><b>zuekin</b></td></tr><tr><td>haiek</td><td><b>haiekin</b></td></tr></table>',
  ex:[['Amarekin mendira joaten naiz.','Voy al monte con mamá.'],['Norekin bizi zara?','¿Con quién vives?'],['Nirekin zatoz?','¿Vienes conmigo?']]},
 {t:'-z: el medio',h:'<p><b>-z</b> dice <b>cómo</b> o <b>en qué</b>: autobusez (en autobús), trenez, autoz, oinez (a pie), euskaraz (en euskera).</p>',
  ex:[['Autobusez etorri naiz.','He venido en autobús.'],['Oinez joaten naiz lanera.','Voy al trabajo a pie.'],['Trenez joaten naiz.','Voy en tren.']]},
 {t:'-raino y -rantz',h:'<p><b>-raino</b> = hasta (el punto final): <b>Iruñeraino</b>. <b>-rantz</b> = en dirección a: <b>mendirantz</b>.</p>',
  ex:[['Iruñeraino autobusez noa.','Voy hasta Pamplona en autobús.'],['Etxerantz noa.','Voy hacia casa.']]}
 ],
 make:()=>[].concat(SQ0(['amarekin','mendira','joaten','naiz'],'Voy al monte con mamá.','-rekin = con.'),SQ0(['autobusez','etorri','naiz'],'He venido en autobús.','-z = en (medio).'),vq('garraioak',3),[
  mc('-rekin','«Conmigo»','¿Cuál es?','nirekin',['niretzat','niri','nirea'],'<b>nirekin</b> = conmigo.'),
  mc('-rekin','«Con mamá»','¿Cuál es?','amarekin',['amari','amarentzat','amaz'],'<b>-rekin</b> = con.'),
  mc('-z','«A pie»','¿Cuál es?','oinez',['oinean','oinetan','oinera'],'<b>oinez</b> = a pie.'),
  mc('-z','«En tren»','¿Cuál es?','trenez',['trenean','trenera','trenarekin'],'<b>-z</b> para el medio de transporte.'),
  mc('-raino','«Hasta Pamplona»','¿Cuál es?','Iruñeraino',['Iruñean','Iruñetik','Iruñarekin'],'<b>-raino</b> = hasta.')
 ])},

{id:'b15',lv:'a2',n:7,eu:'Esan du…',es:'Contar lo que otros dicen y preguntas indirectas',ic:'💬',min:9,
 goals:['Contar lo que alguien dice con -ela (que)','Hacer preguntas indirectas con -n','Responder baietz / ezetz'],
 steps:[
 {t:'-ela: «que»',h:'<p>Para decir <b>que</b> + algo, al auxiliar se le añade <b>-(e)la</b>: <b>dela, duela, dudala, naizela, dagoela</b>. Se usa tras <b>esan</b> (decir), <b>pentsatu</b> (pensar), <b>uste izan</b> (creer).</p>',
  tb:'<table class="mini"><tr><th>Auxiliar</th><th>Que…</th></tr><tr><td>da</td><td><b>dela</b></td></tr><tr><td>dago</td><td><b>dagoela</b></td></tr><tr><td>naiz</td><td><b>naizela</b></td></tr><tr><td>du</td><td><b>duela</b></td></tr><tr><td>dut</td><td><b>dudala</b></td></tr></table>',
  ex:[['Amak esan du etorriko dela.','Mamá ha dicho que vendrá.'],['Esan dut ondo nagoela.','He dicho que estoy bien.'],['Uste dut euskara polita dela.','Creo que el euskera es bonito.']]},
 {t:'Preguntas indirectas',h:'<p>Dentro de otra frase, la pregunta lleva <b>-n</b> en el auxiliar: <b>non dagoen</b> (dónde está), <b>zer den</b> (qué es), <b>zer duzun</b> (qué tienes).</p>',
  ex:[['Badakizu non dagoen udaletxea?','¿Sabes dónde está el ayuntamiento?'],['Ez dakit zer den.','No sé qué es.'],['Galdetu dut noiz etorriko den.','He preguntado cuándo vendrá.']]},
 {t:'Baietz eta ezetz',h:'<p>Para contar un «sí» o un «no» ajeno: <b>baietz esan du</b> (dijo que sí), <b>ezetz esan du</b> (dijo que no).</p>',
  ex:[['Baietz esan du.','Ha dicho que sí.'],['Ezetz esan dut.','He dicho que no.']]}
 ],
 make:()=>[].concat(SQ0(['esan','du','etorriko','dela'],'Ha dicho que vendrá.','da + ela = dela.'),[
  mc('-ela','«Dice que está en casa» (dago)','¿Cuál es?','Etxean dagoela esaten du',['Etxean dagoen esaten du','Etxean dago esaten du','Etxean dagoela da'],'dago + <b>ela</b>.'),
  mc('-ela','«Creo que es bonito» (da)','¿Cuál es?','Polita dela uste dut',['Polita dena uste dut','Polita da uste dut','Polita delako uste dut'],'da + <b>ela</b> = dela.'),
  mc('-ela','«He dicho que tengo» (dut)','Elige la forma','dudala',['duela','dutela','dudan'],'dut + <b>ala</b> = dudala.'),
  mc('Galdera','«¿Sabes dónde está?»','¿Cuál es?','Badakizu non dagoen?',['Badakizu non dago?','Badakizu non dagoela?','Badakizu non da?'],'Pregunta indirecta: <b>-n</b>: dagoen.'),
  mc('Baietz','«Ha dicho que sí»','¿Cuál es?','Baietz esan du',['Bai esan du','Ezetz esan du','Baina esan du'],'<b>baietz</b> = que sí.')
 ])},

{id:'b16',lv:'a1',n:26,eu:'Baldin eta…',es:'«Si», «cuando», «antes de» y «después de»',ic:'🔀',min:9,
 goals:['Formar el condicional real con ba- (si…)','Decir «cuando» con -(e)nean','Usar baino lehen y eta gero'],
 steps:[
 {t:'Ba-: «si»',h:'<p>Para <b>si</b> + algo real, se pone <b>ba-</b> delante del auxiliar: <b>badut, baduzu, badu, bazara, badago</b>.</p>',
  tb:'<table class="mini"><tr><th>Auxiliar</th><th>Si…</th></tr><tr><td>dut</td><td><b>badut</b></td></tr><tr><td>duzu</td><td><b>baduzu</b></td></tr><tr><td>da</td><td><b>bada</b></td></tr><tr><td>zara</td><td><b>bazara</b></td></tr><tr><td>dago</td><td><b>badago</b></td></tr></table>',
  ex:[['Nahi baduzu, etorri.','Si quieres, ven.'],['Euria egiten badu, etxean geratuko naiz.','Si llueve, me quedaré en casa.'],['Etortzen bazara, esan.','Si vienes, dímelo.']]},
 {t:'-(e)nean: «cuando»',h:'<p>Para <b>cuando</b>, al auxiliar se le añade <b>-(e)nean</b>: <b>naizenean, zarenean, denean, dudanean, duzunean</b>.</p>',
  ex:[['Etxera heltzen naizenean, afaltzen dut.','Cuando llego a casa, ceno.'],['Gaixorik zarenean, medikuarenera joan.','Cuando estés enfermo, ve al médico.']]},
 {t:'Antes y después',h:'<p><b>baino lehen</b> = antes de · <b>eta gero</b> = y después. Sirven para ordenar acciones.</p>',
  ex:[['Afaldu baino lehen dutxatzen naiz.','Me ducho antes de cenar.'],['Jan eta gero, kafea hartzen dut.','Después de comer, tomo café.']]}
 ],
 make:()=>[].concat(SQ0(['nahi','baduzu','etorri'],'Si quieres, ven.','ba- + duzu = baduzu.'),[
  mc('Ba-','«Si tienes» (duzu)','¿Cuál es?','baduzu',['duzula','duzunean','duzu ba'],'<b>ba-</b> + duzu.'),
  mc('Ba-','«Si vienes» (zara, etortzen)','¿Cuál es?','etortzen bazara',['etortzen zarenean','etortzen zarela','etortzen baino lehen'],'<b>ba-</b> = si.'),
  mc('-nean','«Cuando llego» (naiz)','¿Cuál es?','heltzen naizenean',['heltzen bazara','heltzen naizela','heltzen eta gero'],'naiz + <b>enean</b> = naizenean.'),
  mc('Denbora','«Antes de cenar»','¿Cuál es?','Afaldu baino lehen',['Afaldu eta gero','Afaldu orduan','Afaltzean baino'],'<b>baino lehen</b> = antes de.'),
  mc('Denbora','«Después de comer»','¿Cuál es?','Jan eta gero',['Jan baino lehen','Jan bada','Jan duela'],'<b>eta gero</b> = después de.')
 ])},

{id:'b17',lv:'a1',n:16,eu:'Eguraldia',es:'El tiempo atmosférico',ic:'🌦️',min:6,
 goals:['Decir qué tiempo hace','Usar ari du (llueve, nieva)','Comparar el tiempo en cada estación'],
 steps:[
 {t:'Qué tiempo hace',h:'<p>Pregunta: <b>Zer eguraldi dago?</b> (¿qué tiempo hace?). Hay dos estructuras muy útiles:</p>',
  tb:'<table class="mini"><tr><th>Estructura</th><th>Ejemplo</th></tr><tr><td><b>… ari du</b></td><td>Euria ari du (llueve)</td></tr><tr><td><b>… egiten du</b></td><td>Hotz egiten du (hace frío)</td></tr><tr><td><b>… dago</b></td><td>Eguzkia dago (hace sol)</td></tr></table>',
  ex:[['Euria ari du.','Está lloviendo.'],['Elurra ari du.','Está nevando.'],['Gaur hotz egiten du.','Hoy hace frío.'],['Udan bero egiten du.','En verano hace calor.'],['Hodei asko daude.','Hay muchas nubes.']]},
 {t:'Eguraldia Baztanen',h:'<p>En Baztan llueve mucho: <b>Baztanen euria egiten du askotan</b> (en Baztan llueve a menudo). Puedes combinar con las estaciones que ya sabes: <b>Neguan elurra egiten du</b>.</p>'}
 ],
 make:()=>[].concat(SQ0(['euria','ari','du'],'Está lloviendo.','ari du = está (haciendo).'),SQ0(['gaur','hotz','egiten','du'],'Hoy hace frío.','hotz egiten du = hace frío.'),vq('eguraldia',5),[
  mc('Eguraldia','«Está nevando»','¿Cuál es?','Elurra ari du',['Euria ari du','Elurra da','Elurra dago ari'],'<b>ari du</b>.'),
  mc('Eguraldia','«¿Qué tiempo hace?»','¿Cuál es?','Zer eguraldi dago?',['Zer eguraldi naiz?','Nolako eguraldi du?','Zer ari du?'],'<b>Zer eguraldi dago?</b>'),
  mc('Eguraldia','«En verano hace calor»','¿Cuál es?','Udan bero egiten du',['Uda bero egiten da','Udan beroa naiz','Udan egin bero du'],'<b>bero egiten du</b>.')
 ])},

{id:'b18',lv:'a1',n:27,eu:'Erosketak',es:'Comprar y preguntar precios',ic:'🛍️',min:7,
 goals:['Preguntar precios con Zenbat balio du?','Pedir, elegir y pagar','Usar ordaindu dezaket y -arekin'],
 steps:[
 {t:'En la tienda',h:'<p>Frases que necesitas:</p>',
  ex:[['Barkatu, zenbat balio du honek?','Perdona, ¿cuánto cuesta esto?'],['Zenbat balio dute sagarrek?','¿Cuánto cuestan las manzanas?'],['Hau nahi dut.','Quiero esto.'],['Besterik nahi duzu?','¿Quiere algo más?'],['Ez, besterik ez.','No, nada más.']],
  tip:'<b>balio du</b> (singular) / <b>balio dute</b> (plural) = cuesta / cuestan.'},
 {t:'Pagar',h:'<p>Con <b>-arekin</b> dices con qué: <b>txartelarekin</b>, <b>diruarekin</b>. Y <b>dezaket</b> para preguntar si se puede.</p>',
  ex:[['Txartelarekin ordaindu dezaket?','¿Puedo pagar con tarjeta?'],['Bai, jakina.','Sí, claro.'],['Poltsa bat nahi dut.','Quiero una bolsa.'],['Zenbat da guztira?','¿Cuánto es en total?']]},
 {t:'Cantidades',h:'<p>Palabras para pedir: <b>kilo bat</b> (un kilo), <b>erdi bat</b> (medio), <b>pixka bat</b> (un poco), <b>gehiago</b> (más), <b>gutxiago</b> (menos).</p>'}
 ],
 make:()=>[].concat(SQ0(['zenbat','balio','du'],'¿Cuánto cuesta?','balio du = cuesta.'),vq('erosketak',5),[
  mc('Erosketak','«¿Cuánto cuesta esto?»','¿Cuál es?','Zenbat balio du honek?',['Zenbat da honek?','Zer balio du honek?','Non balio du honek?'],'<b>Zenbat balio du?</b>'),
  mc('Erosketak','«¿Puedo pagar con tarjeta?»','¿Cuál es?','Txartelarekin ordaindu dezaket?',['Txartelaz ordaindu dezaket?','Txartelari ordaindu dezaket?','Txartelarekin ordaindu naiteke?'],'<b>-arekin</b> + dezaket (ordaindu lleva objeto).'),
  mc('Erosketak','«Nada más»','¿Cuál es?','Besterik ez',['Gehiago bai','Ezer ez bai','Beste da'],'<b>besterik ez</b> = nada más.')
 ])},

{id:'b19',lv:'a1',n:28,eu:'Osasuna',es:'Salud: me duele, estoy enfermo',ic:'🩺',min:7,
 goals:['Decir dónde te duele (mina dut)','Hablar con el médico y la farmacia','Dar y entender consejos con behar'],
 steps:[
 {t:'Me duele…',h:'<p>Para <b>me duele</b> se dice <b>…ko mina dut</b> (tengo dolor de…):</p>',
  ex:[['Buruko mina dut.','Me duele la cabeza.'],['Eztarriko mina dut.','Me duele la garganta.'],['Sabeleko mina dut.','Me duele el estómago.'],['Sukarra dut.','Tengo fiebre.'],['Gripea dut.','Tengo gripe.']],
  tip:'<b>buru</b> + <b>-ko</b> = «de la cabeza»: buruko mina. Si el nombre acaba en -a, se pierde: sabela → sabeleko.'},
 {t:'En el médico',h:'<p>Preguntas y consejos típicos:</p>',
  ex:[['Zer duzu?','¿Qué tienes?'],['Gaixorik nago.','Estoy enfermo.'],['Medikuarenera joan behar dut.','Tengo que ir al médico.'],['Botika hartu behar duzu.','Tienes que tomar la medicina.'],['Atseden hartu behar duzu.','Tienes que descansar.']],
  tip:'<b>-(r)enera</b> = a casa/consulta de alguien: medikuarenera.'},
 {t:'Estados útiles',h:'<p>Ya conoces <b>gaixorik, nekatuta, gose, egarri, hotz, bero</b> con <b>naiz / nago</b>. Añade <b>ondo / gaizki</b> (bien / mal): <b>Gaizki sentitzen naiz</b> (me siento mal).</p>'}
 ],
 make:()=>[].concat(SQ0(['buruko','mina','dut'],'Me duele la cabeza.','buru + ko mina dut.'),vq('osasuna',5),[
  mc('Osasuna','«Me duele la garganta»','¿Cuál es?','Eztarriko mina dut',['Eztarria mina naiz','Mina eztarrian zait','Eztarri mina duzu'],'<b>…ko mina dut</b>.'),

function startPlacement(){
  if(ptLeft()||S.a1test===1)return;
  runSession({tag:'test',test:'place',nohelp:true,lv:'a1',make:()=>testSet('a1',PLACE_SIZES)});
}
function startSelf(lv){
  if(lv==='a2'&&!a2Open()){toast('El A2 sigue bloqueado');return}
  runSession({tag:'test',test:'self',nohelp:true,lv,make:()=>testSet(lv,SELF_SIZES)});
}
function testGrade(ok,q,given){
  SES.locked=true;(SES.res=SES.res||[]).push({q,ok});
  if(SES.cfg.test==='self'){sheet(ok,Object.assign({},q,{retry:true}),0,given);return}
  $$('.opt,.wt,.typebox,.line').forEach(e=>e.classList.remove('good','bad'));
  const last=SES.i+1>=SES.qs.length,d=document.createElement('div');d.className='sheet ask';d.id='sh';
  d.innerHTML=`<div class="in"><p><b>Erantzuna gordeta</b> · respuesta guardada (${SES.i+1}/${SES.qs.length})</p><div class="sheetbtn"><button class="btn block" id="nx">${last?'Amaitu · ver resultado':'Hurrengoa · siguiente'}</button></div></div>`;
  document.body.appendChild(d);const nx=$('#nx');nx.onclick=nextQ;nx.focus();
}
function missLabel(q){
  if(q.blk==='vocab'){const s=VOCAB.find(x=>x.id===String(q.wid||'').split(':')[0]);return s?'Hitzak · '+s.eu:'Hitzak'}
  if(q.blk==='verbs'){const v=q.vk||(q.meta&&q.meta.vk);return 'Aditzak'+(v?' · '+v:'')}
  if(q.blk==='build')return 'Esaldiak · construir frases';
  const l=LESSONS.find(x=>x.id===q.src);return l?'Ikasgaia '+l.n+' · '+l.eu:'Gramatika'
}
function testFinish(){
  const R=SES.res||[],cfg=SES.cfg;SES.i=SES.qs.length;
  const by={};TEST_BLK.forEach(b=>by[b[0]]={n:0,ok:0,miss:[]});
  R.forEach(r=>{const b=by[r.q.blk];if(!b)return;b.n++;if(r.ok)b.ok++;else b.miss.push(r.q)});
  const tot=R.length,okN=R.filter(r=>r.ok).length,pct=tot?Math.round(okN/tot*100):0,need=Math.ceil(tot*.9);
  const blkMin=b=>Math.ceil(b.n*.75),blkOk=TEST_BLK.every(b=>!by[b[0]].n||by[b[0]].ok>=blkMin(by[b[0]]));
  const place=cfg.test==='place',pass=place&&okN>=need&&blkOk;
  if(place){S.ptLast=Date.now();S.ptTry=(S.ptTry||0)+1;S.ptBest=Math.max(S.ptBest||0,okN);if(pass){S.a1test=1;S.a2unl=1}}
  else S.selfLast={lv:cfg.lv,ok:okN,n:tot,pct,ts:Date.now()};
  S.sess++;save();
  const labels=Array.from(new Set([].concat(...TEST_BLK.map(b=>by[b[0]].miss.map(missLabel))))).slice(0,8);
  const rows=TEST_BLK.map(b=>{const x=by[b[0]],mn=blkMin(x),p=x.n?Math.round(x.ok/x.n*100):0,good=!x.n||x.ok>=mn;
    return `<div class="card"><div class="row" style="justify-content:space-between"><b>${b[1]} <span class="es" style="font-weight:400">· ${b[2]}</span></b><span class="chip">${x.ok}/${x.n}</span></div><div class="bar"><i style="width:${p}%;background:${good||!place?'var(--berde)':'var(--gorri)'}"></i></div>${place?`<div class="es" style="font-size:13px;margin-top:4px">mínimo ${mn} · ${good?'✔ superado':'✘ por debajo'}</div>`:''}</div>`}).join('');
  let head,msg;
  if(place&&pass){head=['🏆','Zorionak!','¡Has superado el test!'];msg=`<p><b>A1 acreditado.</b> Has acertado ${okN} de ${tot} (${pct} %). El A2 está desbloqueado.</p>`}
  else if(place){head=['💪','Ia-ia!','Todavía no'];const why=[];if(okN<need)why.push(`necesitas ${need} aciertos y tienes ${okN}`);if(!blkOk)why.push('algún bloque está por debajo del 75 %');msg=`<p><b>No has llegado al mínimo:</b> ${why.join(' y ')}. Puedes reintentarlo a las 24 h con preguntas distintas; mientras, repasa lo de abajo.</p>`}
  else{head=[pct>=90?'🏆':pct>=60?'🎉':'💪','Autoebaluazioa','Resultado: '+okN+' de '+tot+' ('+pct+' %)'];msg=`<p>${pct>=90?'Nivel muy sólido: este nivel lo dominas.':pct>=70?'Vas bien; repasa los puntos débiles.':'Conviene repasar este nivel con las lecciones.'}</p>`}
  $('#view').innerHTML=`<div class="result"><div style="font-size:54px">${head[0]}</div><h1 class="big">${head[1]}</h1><p class="sub">${head[2]}</p><div class="num">${pct}%</div></div>
  <div class="explain">${msg}</div><div class="stack" style="margin-top:14px">${rows}</div>
  ${labels.length?`<div class="card" style="margin-top:14px"><b>Berrikusi · repasa</b><div class="stack" style="margin-top:8px">${labels.map(m=>`<div class="ex">${esc(m)}</div>`).join('')}</div></div>`:''}
  <div class="stack" style="margin-top:20px">${pass?'<button class="btn block" id="toa2">A2 ikasgelara · ir al A2</button>':''}<button class="btn${pass?' sec':''} block" id="tback">Test-era itzuli · volver</button></div>`;
  window.scrollTo(0,0);
  $('#tback').onclick=()=>endSession();
  if(pass)$('#toa2').onclick=()=>{S.level='a2';save();endSession(true);goTo('ikasgela')};
  checkBadges();refreshHeader();if(pass||pct>=90)burst();
}

function dictView(){

  return `<div style="display:flex;align-items:center;gap:10px">${back}<h1 class="big" style="margin:0">Hiztegia</h1></div><p class="sub">Diccionario de consulta · ${tot} palabras por temas (no entran en las lecciones). Toca 🔊 para escuchar.</p>

  :DICT.map((k,i)=>`<button class="card" style="text-align:left;width:100%" data-act="dcat" data-i="${i}"><div class="setrow"><div class="grow"><b>${esc(k.cat)}</b></div><span class="chip">${k.w.length}</span></div></button>`).join('')}</div></div>`;
}
function dictFind(q){
  q=norm(q);if(q.length<2)return [];const r=[];
  DICT.forEach(c=>c.w.forEach(w=>{if(norm(w[0]).includes(q)||norm(w[1]).includes(q))r.push(w)}));
  return r;
}

<script>

let LES=null;

function lessonRecap(id){

  if(SM&&SM.sum)o+='<p class="rc-h">Lo esencial</p><ul class="goals">'+SM.sum.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  L.steps.forEach((s,i)=>{
    o+='<div class="rc-step"><p class="rc-h">'+(i+1)+'. '+esc(s.t)+'</p>';
    const f=first(s.h);if(f)o+='<p>'+f+'</p>';
    if(s.tb)o+='<div class="tscroll">'+s.tb+'</div>';
    if(s.ex)o+=s.ex.slice(0,2).map(e=>'<div class="ex'+(hideTr(L)?' tr':'')+'">'+esc(e[0])+'<small>'+esc(e[1])+'</small></div>').join('');

  });
  if(SM&&SM.kw)o+='<p class="rc-h">Hitz gakoak · palabras clave</p><div class="tscroll"><table class="mini"><tr><th>Euskera</th><th>Español</th></tr>'+SM.kw.map(k=>'<tr><td><b>'+esc(k[0])+'</b></td><td>'+esc(k[1])+'</td></tr>').join('')+'</table></div>';

function openLesson(id){pushState();LES={id,step:-1};document.body.classList.add('in-session');lessonRender()}

function gidaView(){

  <button class="btn block" data-act="nn" style="margin-bottom:14px">Probatu: zein aditz mota? · NOR, NORK, NORI</button>
  <details class="g" open><summary>1 · El orden de la frase</summary><div class="body">
  <p>Sujeto → objeto → verbo + auxiliar. El verbo cierra la frase.</p>
  ${ex('<b>Nik</b> ogia jaten dut.','Yo pan como = Yo como pan.')}${ex('<b>Ni</b> Iruñera joaten naiz.','Yo a Pamplona voy = Voy a Pamplona.')}</div></details>
  <details class="g"><summary>2 · Izan o egon</summary><div class="body">
  <p><b>izan</b> = ser: quién eres, de dónde, profesión. <b>egon</b> = estar: dónde y cómo estás.</p>
  ${ex('Ni Dabid <b>naiz</b>. Ni Nafarroakoa <b>naiz</b>.','Soy David. Soy de Navarra.')}${ex('Etxean <b>nago</b>. Ondo <b>nago</b>.','Estoy en casa. Estoy bien.')}
  <table class="mini"><tr><th></th><th>izan</th><th>egon</th></tr>${PRON.map((p,i)=>`<tr><td>${p}</td><td>${CONJ.izan.T.oraina.f[i]}</td><td>${CONJ.egon.T.oraina.f[i]}</td></tr>`).join('')}</table></div></details>
  <details class="g"><summary>3 · Nor o nork: qué auxiliar uso</summary><div class="body">
  <p>Pregúntate si el verbo lleva objeto directo («¿qué?»).</p>
  <table class="mini"><tr><th>Sin objeto</th><th>Con objeto</th></tr><tr><td>auxiliar <b>izan</b>: naiz, zara, da…<br>sujeto sin -k: <i>ni</i>, <i>zu</i></td><td>auxiliar <b>ukan</b>: dut, duzu, du…<br>sujeto con -k: <i>nik</i>, <i>zuk</i></td></tr><tr><td>joan, etorri, bizi, egon</td><td>jan, edan, ikusi, irakurri, ikasi</td></tr></table>
  ${ex('Ni etxera <b>joan naiz</b>.','He ido a casa (sin objeto → izan).')}${ex('<b>Nik</b> ogia <b>jan dut</b>.','He comido pan (con objeto → ukan).')}</div></details>
  <details class="g"><summary>4 · Los tiempos, pieza a pieza</summary><div class="body">
  <p>Casi todos los verbos usan <b>participio + auxiliar</b>. Lo que cambia es la forma del participio y el auxiliar.</p>
  <div class="tscroll"><table class="mini"><tr><th>Tiempo</th><th>Fórmula</th><th>jan</th><th>joan</th></tr>${t6.map(r=>`<tr>${r.map((c,k)=>`<td>${k>=2?'<b>'+c+'</b>':c}</td>`).join('')}</tr>`).join('')}</table></div>
  <p style="margin-top:10px">Forma habitual: <b>jan → jaten</b>, <b>edan → edaten</b>, <b>ikasi → ikasten</b>, <b>irakurri → irakurtzen</b>. Se aprende con cada verbo.</p>
  <p>Futuro: <b>-go</b> detrás de -n (jan → jango, joan → joango) y <b>-ko</b> en el resto (ikusi → ikusiko).</p></div></details>
  <details class="g"><summary>5 · Terminaciones: a dónde, en dónde, con quién</summary><div class="body">
  <table class="mini"><tr><th>Final</th><th>Significa</th><th>Ejemplo</th></tr>
  <tr><td>-a / -ak</td><td>el, la / los, las</td><td>etxea / etxeak</td></tr>
  <tr><td>-k</td><td>sujeto con objeto</td><td>aitak ogia jaten du</td></tr>
  <tr><td>-n</td><td>en</td><td>etxean, Elizondon</td></tr>
  <tr><td>-ra</td><td>a, hacia</td><td>etxera, Iruñera</td></tr>
  <tr><td>-tik</td><td>desde</td><td>etxetik, Iruñetik</td></tr>
  <tr><td>-rekin</td><td>con</td><td>lagunarekin</td></tr>
  <tr><td>-ren</td><td>de (posesión)</td><td>aitaren etxea</td></tr>
  <tr><td>-z</td><td>en / mediante</td><td>euskaraz</td></tr>
  <tr><td>-ko / -go</td><td>de (lugar o tiempo)</td><td>Baztango, gaurko</td></tr></table></div></details>
  <details class="g"><summary>6 · Preguntar</summary><div class="body">
  <table class="mini"><tr><th>Palabra</th><th>Ejemplo</th></tr>
  <tr><td><b>zer</b> qué</td><td>Zer edaten duzu?</td></tr><tr><td><b>nor</b> quién</td><td>Nor zara zu?</td></tr>
  <tr><td><b>non</b> dónde</td><td>Non bizi zara?</td></tr><tr><td><b>nora</b> adónde</td><td>Nora zoaz?</td></tr>
  <tr><td><b>noiz</b> cuándo</td><td>Noiz etorriko zara?</td></tr><tr><td><b>nola</b> cómo</td><td>Nola zaude?</td></tr>
  <tr><td><b>zergatik</b> por qué</td><td>Zergatik ikasten duzu euskara?</td></tr><tr><td><b>zenbat</b> cuánto</td><td>Zenbat da?</td></tr></table></div></details>
  <details class="g"><summary>7 · Decir que no</summary><div class="body">

  <details class="g"><summary>8 · Los 4 tipos de verbo: NOR, NOR-NORK, NOR-NORI, NOR-NORI-NORK</summary><div class="body">
  <p>El auxiliar depende de <b>quién participa</b> en la acción. <b>NOR</b> = quién/qué (sin marca), <b>NORK</b> = quién lo hace (lleva <b>-k</b>), <b>NORI</b> = a quién (lleva <b>-ri</b>).</p>
  <div class="tscroll"><table class="mini"><tr><th>Tipo</th><th>Participan</th><th>Auxiliar</th><th>Ejemplo</th></tr>
  <tr><td style="white-space:nowrap"><b>NOR</b></td><td>solo el sujeto</td><td>naiz, zara, da, gara…</td><td>Ni Iruñean bizi <b>naiz</b>.</td></tr>
  <tr><td style="white-space:nowrap"><b>NOR-NORK</b></td><td>sujeto + objeto («qué»)</td><td>dut, duzu, du, dugu…</td><td>Nik ogia jaten <b>dut</b>.</td></tr>
  <tr><td style="white-space:nowrap"><b>NOR-NORI</b></td><td>una cosa + «a quién»</td><td>zait, zaizu, zaio, zaigu…</td><td>Niri euskara gustatzen <b>zait</b>.</td></tr>
  <tr><td style="white-space:nowrap"><b>NOR-NORI-NORK</b></td><td>quien lo hace + «qué» + «a quién»</td><td>diot, diozu, dio… / dit, dizu, dio…</td><td>Nik amari liburua ematen <b>diot</b>.</td></tr></table></div>
  <p style="margin-top:12px"><b>Cómo reconocer el tipo</b></p>
  <ol style="margin:0 0 10px;padding-left:20px"><li>¿Hay «a quién» (-ri) además del «qué»? → <b>NOR-NORI-NORK</b> (dar, decir, enviar, enseñar, explicar, preguntar).</li><li>¿Algo «le gusta, le parece, se le olvida» a alguien? → <b>NOR-NORI</b> (gustatu, iruditu, ahaztu, interesatu).</li><li>¿Hay un objeto directo («qué»)? → <b>NOR-NORK</b>.</li><li>¿Solo sujeto? → <b>NOR</b> (izan, egon, joan, etorri, bizi, jaio).</li></ol>
  <p><b>Ojo con la dirección:</b> <i>Nik amari ematen <b>diot</b></i> (yo le doy a mamá) frente a <i>Amak niri ematen <b>dit</b></i> (mamá me da a mí). El auxiliar cambia según quién da y quién recibe.</p>
  ${ex('Amak niri liburu bat eman <b>dit</b>.','Mamá me ha dado un libro.')}${ex('Irakasleak guri euskara irakasten <b>digu</b>.','El profesor nos enseña euskera.')}
  <p class="es">Practica: lección 22 «Nori eman diozu?» (A1), lecciones 1 y 10 del A2, la pestaña Aditzak y el botón «Probatu» de arriba.</p></div></details>`;
}

  else if(a==='goal'){S.goal=+d.g;save();render()}
  else if(a==='exp'){
    const t=$('#bk');t.hidden=false;t.value=exportCode();t.dataset.mode='exp';t.select();
    let ok=false;try{ok=document.execCommand&&document.execCommand('copy')}catch(e){}
    try{if(navigator.clipboard)navigator.clipboard.writeText(t.value).catch(()=>{})}catch(e){}
    bkMsg(ok?'Código copiado. Guárdalo en tus notas o envíatelo.':'Código generado: cópialo del recuadro y guárdalo.',true);
  }
  else if(a==='imp'){
    const t=$('#bk');
    if(t.hidden||t.dataset.mode==='exp'){t.hidden=false;t.value='';t.dataset.mode='imp';t.focus();bkMsg('Pega tu código y pulsa «Inportatu» otra vez.',true);return}
    try{const o=importCode(t.value);S=Object.assign({lessons:{},xp:0,today:0,day:'',streak:0,last:'',m:{},badges:[],typeMode:false,sess:0,conj:0,built:0,bestCombo:0,goal:50,level:'a1'},o);S.a2key=0;if(S.level!=='a2'||!a2Open())S.level='a1';save();render();bkMsg('¡Progreso importado!',true)}
    catch(e){bkMsg('Código no válido. Cópialo entero, sin cortar.',false)}
  }
  else if(a==='reset'){
    if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='¿Seguro? Pulsa otra vez para borrar todo';return}
    S={lessons:{},xp:0,today:0,day:S.day,streak:0,last:'',m:{},badges:[],typeMode:false,sess:0,conj:0,built:0,bestCombo:0,goal:S.goal,level:'a1'};save();render();window.scrollTo(0,0);
  }
  else if(a==='mixv')runSession({tag:'vocab',make:()=>vocabQs(all,10)});
  else if(a==='quiz'){const p=setPool();runSession({tag:'vocab',make:()=>vocabQs(p,Math.min(8,p.length))})}
  else if(a==='flash'){const p=setPool();runSession({tag:'flash',make:()=>flashQs(p,Math.min(10,p.length))})}
  else if(a==='verb'){UI.verb=d.v;render()}
  else if(a==='practice'){const vk=UI.verb;runSession({tag:'conj',make:()=>conjQs([vk],8)})}
  else if(a==='practiceall')runSession({tag:'conj',make:()=>conjQs(knownVerbs(),10)});
  else if(a==='build')runSession({tag:'build',make:()=>buildQs(6)});
  else if(a==='nn')runSession({tag:'nn',make:()=>typeQs(10)});
  else if(a==='typemode'){S.typeMode=b.checked;save()}
  else if(a==='dict'){UI.dc=null;UI.dfrom=route();goTo('hiztegia')}
  else if(a==='dictx'){UI.dict=false;UI.dc=null;if(route()==='hiztegia'){const f=UI.dfrom||'home';UI.dfrom=null;goTo(f)}else render()}
  else if(a==='dcat'){UI.dc=d.i===''||d.i==null?null:+d.i;render();scrollTo(0,0)}
  else if(a==='labv'){UI.lab.v=+d.i;render()}
  else if(a==='labt'){UI.lab.tk=d.t;render()}
  else if(a==='labp'){UI.lab.i=+d.i;render()}
});
$('#view').addEventListener('input',e=>{
  if(e.target.id==='dsrch'){const v=e.target.value,box=$('#dres'),bd=$('#dbody');if(v.trim().length<2){box.hidden=true;bd.hidden=false;return}const r=dictFind(v);box.hidden=false;bd.hidden=true;box.innerHTML=r.length?r.slice(0,80).map(w=>`<div class="hit"><button class="spk" data-act="say" data-t="${esc(w[0])}" aria-label="Escuchar">🔊</button><b>${esc(w[0])}</b><span class="es">${esc(w[1])}</span></div>`).join('')+(r.length>80?`<p class="es">+${r.length-80} gehiago · afina la búsqueda</p>`:''):'<p class="es">Sin resultados.</p>';return}
  if(e.target.id!=='srch')return;
  const r=wordsFind(e.target.value),box=$('#srr');
  if(e.target.value.trim().length<2){box.hidden=true;return}
  box.hidden=false;
  box.innerHTML=r.length?r.map(w=>`<div class="hit"><button class="spk" data-act="say" data-t="${esc(w.eu)}" aria-label="Escuchar">🔊</button><b>${esc(w.em?w.em+' ':'')}${esc(w.eu)}</b><span class="es">${esc(w.es)}</span></div>`).join(''):'<p class="es">Sin resultados.</p>';
});
if(S.level==='a2'&&!a2Open())S.level='a1';
refreshHeader();
render();
checkBadges();
</script>

</body>
</html>
